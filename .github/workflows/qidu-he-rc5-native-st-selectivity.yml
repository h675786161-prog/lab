name: Qidu HE rc5 native SillyTavern selectivity

on:
  push:
    branches:
      - qidu-he-if-longrp
    paths:
      - '.lab/qidu-he-v03-rc5-recursion-patch.py'
      - '.lab/qidu-he-rc5-native-scan.mjs'
      - '.github/workflows/qidu-he-rc5-native-st-selectivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-st:
    runs-on: ubuntu-24.04
    env:
      CARD_PATH: fixtures/qidu-he-if/qidu-he-if.character.json
      LAB_OUT: bench-evidence/qidu-he-rc5-native-st-current
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-rc5-native-st
      ST_URL: http://127.0.0.1:8000/
      PLAYWRIGHT_MODULE: file:///tmp/qidu-rc5-native-browser/node_modules/playwright-core/index.mjs
    steps:
      - uses: actions/checkout@v4

      - name: Build current rc5 candidate
        run: |
          set -euo pipefail
          python .lab/qidu-he-v03-rc5-recursion-patch.py
          node - <<'NODE'
          const d=JSON.parse(require('fs').readFileSync(process.env.CARD_PATH,'utf8')).data;
          if(d.character_version!=='0.3.0-rc5') throw new Error(d.character_version);
          if(d.character_book.entries.length!==31) throw new Error(String(d.character_book.entries.length));
          const n=d.character_book.entries.filter(e=>e.extensions?.prevent_recursion===true).length;
          if(n!==31) throw new Error(`prevent_recursion ${n}/31`);
          if(!d.post_history_instructions.includes('【用户主权硬门槛｜逐字约束】')) throw new Error('missing literal user sovereignty guard');
          if(!d.post_history_instructions.includes('【当前回合连续性与身份精确性】')) throw new Error('missing continuity guard');
          const mila=d.character_book.entries.find(e=>e.name==='米菈');
          if(!mila?.content.includes('身份名锚点：自我介绍时只使用准确姓名“米菈”')) throw new Error('missing 米菈 exact name anchor');
          console.log('candidate ready', d.character_version, n);
          NODE

      - name: Adapt native scanner to current rc5 guard wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.lab/qidu-he-rc5-native-scan.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('【用户主权硬门槛】','【用户主权硬门槛｜逐字约束】')
          s=s.replace('身份名锚点：自我介绍时姓名使用“米菈”','身份名锚点：自我介绍时只使用准确姓名“米菈”')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          mkdir -p "$LAB_OUT"
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          cd "$ST_DIR" && npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$GITHUB_WORKSPACE/$LAB_OUT/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-rc5-native.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat "$GITHUB_WORKSPACE/$LAB_OUT/st-runtime.log"
          exit 1

      - name: Install browser driver
        run: |
          set -euo pipefail
          rm -rf /tmp/qidu-rc5-native-browser
          mkdir -p /tmp/qidu-rc5-native-browser
          cd /tmp/qidu-rc5-native-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          echo "CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Import card in browser and run native world-info scan
        run: node .lab/qidu-he-rc5-native-scan.mjs

      - name: Stop ST
        if: always()
        run: |
          if [ -f /tmp/qidu-he-rc5-native.pid ]; then kill "$(cat /tmp/qidu-he-rc5-native.pid)" 2>/dev/null || true; fi

      - name: Upload current native-ST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-rc5-native-st-current
          path: bench-evidence/qidu-he-rc5-native-st-current/
          if-no-files-found: error
