name: Qidu v0424 Parallel Narrative Release

on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-v0424-parallel-trigger.txt'

permissions:
  contents: read

jobs:
  candidate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact candidate hash and privacy
        run: |
          node --input-type=module <<'NODE'
          import { loadQiduCgCandidate, assertReleasePrivacy } from './.lab/qidu-card-v0424-cg-candidate.mjs';
          const {card,compactSha256}=await loadQiduCgCandidate(process.cwd());
          assertReleasePrivacy(card);
          console.log(JSON.stringify({version:card.data.character_version,sha256:compactSha256,privacy:true},null,2));
          NODE

  narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        kind: [core, encounter, conflict, info, npc, npcsource, chimera]
    env:
      MODEL_API_KEY: ${{ secrets.PIAOMIAO }}
      MODEL_API_BASE: https://claudeapi.cc.cd/v1
      RELEASE_MODEL: 'deepseek/deepseek-v4.1-flash'
      LAB_OUT: bench-evidence/qidu-card-v0421-core
      LAB_OUT_CONFLICT: bench-evidence/qidu-card-v0418-preset-conflict
      LAB_OUT_INFO: bench-evidence/qidu-card-v0423-info-timeline
      LAB_OUT_ENCOUNTER: bench-evidence/qidu-card-v0421-encounter
      LAB_OUT_NPC_KNOWLEDGE: bench-evidence/qidu-card-v0423-npc-knowledge
      LAB_OUT_NPC_SOURCE: bench-evidence/qidu-card-v0423-offscreen-source
    steps:
      - uses: actions/checkout@v4
      - name: Adapt probe to exact v0.4.24 candidate
        run: python .lab/qidu-final-adapt-probes-v0424.py
      - name: Verify adapted probes target v0.4.24
        run: |
          set -euo pipefail
          files=(
            .lab/qidu-card-model-bench-v0418-core.mjs
            .lab/qidu-card-model-bench-v0421-encounter.mjs
            .lab/qidu-card-model-bench-v0418-preset-conflict.mjs
            .lab/qidu-card-model-bench-v0423-info-timeline.mjs
            .lab/qidu-card-model-bench-v0423-npc-knowledge.mjs
            .lab/qidu-card-model-bench-v0423-offscreen-source.mjs
            .lab/qidu-first-chimera-release-v0423.mjs
          )
          for f in "${files[@]}"; do
            grep -q "qidu-card-v0424-cg-candidate.mjs" "$f"
            if grep -q "qidu-card-v0423-release-candidate.mjs" "$f"; then
              echo "old candidate import remains in $f" >&2
              exit 1
            fi
          done
      - name: Run narrative probe
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            ok=0
            case "${{ matrix.kind }}" in
              core)
                node .lab/qidu-card-model-bench-v0421-core.mjs && ok=1
                ;;
              encounter)
                node .lab/qidu-card-model-bench-v0421-encounter.mjs && ok=1
                ;;
              conflict)
                node .lab/qidu-card-model-bench-v0418-preset-conflict.mjs && ok=1
                ;;
              info)
                if node .lab/qidu-card-model-bench-v0423-info-timeline.mjs && node .lab/qidu-info-report-gate-v0423.mjs; then ok=1; fi
                ;;
              npc)
                node .lab/qidu-card-model-bench-v0423-npc-knowledge.mjs && ok=1
                ;;
              npcsource)
                node .lab/qidu-card-model-bench-v0423-offscreen-source.mjs && ok=1
                ;;
              chimera)
                node .lab/qidu-first-chimera-release-v0423.mjs && ok=1
                ;;
            esac
            if [ "$ok" = 1 ]; then exit 0; fi
            echo "${{ matrix.kind }} retry $n"
            sleep 5
          done
          exit 1
      - name: Upload narrative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-narrative-${{ matrix.kind }}
          path: bench-evidence/
          if-no-files-found: warn

  package:
    needs: [candidate-check, narrative]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact v0.4.24 release
        run: |
          set -euo pipefail
          rm -rf dist-release
          mkdir -p dist-release
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { loadQiduCgCandidate, CG_KEYS, assertReleasePrivacy } from './.lab/qidu-card-v0424-cg-candidate.mjs';
          const notes='作者：叶罹。相关卡：《永远的7日之都》七日轮回文本互动。原作向文本互动角色卡，以七日轮回为核心，包含区域巡查、角色剧情、战术终端、状态记录、多结局分支与CG触发。';
          const {card,raw,compactSha256}=await loadQiduCgCandidate(process.cwd());
          assertReleasePrivacy(card);
          if(card.data?.creator!=='叶罹'||card.data?.creator_notes!==notes||card.creatorcomment!==notes) throw new Error('public author metadata mismatch');
          if(card.data?.character_version!=='0.4.24'||card.data?.character_book?.extensions?.version!=='0.4.24') throw new Error('version mismatch');
          const txt=raw.toString('utf8');
          if(/(?:玲|h675786161|github\.com|raw\.githubusercontent\.com|api\.github\.com|实验酒馆|world-backstage|(?:\bLAB\b|[-_]lab\b|\blab[-_])|feature\/qidu-card|gmail\.com)/i.test(txt)) throw new Error('private development provenance remains');
          const scripts=card.data?.extensions?.regex_scripts||[];
          for(const key of CG_KEYS){
            const r=scripts.find(x=>x?.id===`f7d-cg-${key}-v0424`);
            if(!r||!String(r.replaceString||'').includes('data:image/webp;base64,')) throw new Error(`embedded CG missing: ${key}`);
          }
          const m=String(card.data.first_mes||'').match(/<f7d_state>([\s\S]*?)<\/f7d_state>/i);
          if(!m) throw new Error('initial state missing');
          const s=JSON.parse(m[1]);
          if(s.cg_system?.mode!=='direct_only'||s.cg_system?.album_enabled!==false||s.player_profile?.gender!=='unknown') throw new Error('initial CG state invalid');
          if(!CG_KEYS.every(k=>s.cg_system?.shown?.[k.replace(/^cg_/,'')]===false)) throw new Error('initial CG flags invalid');
          const name='永远的7日之都-七日轮回文本互动-v0.4.24.json';
          await fs.writeFile(`dist-release/${name}`,raw);
          await fs.writeFile('dist-release/SHA256.txt',`${compactSha256}  ${name}\n`);
          console.log(JSON.stringify({version:'0.4.24',creator:'叶罹',sha256:compactSha256,bytes:raw.length,cgCount:CG_KEYS.length,privacy:true},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: qidu-card-v0424-release
          path: dist-release/
          if-no-files-found: error
