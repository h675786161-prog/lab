name: Qidu HE IF rc4 native-ST GLM behavior

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-rc4-glm-behavior.yml'
      - '.lab/qidu-he-rc4-behavior.mjs'

permissions:
  contents: read

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      GLM_API: https://youzi.today/v1/chat/completions
      GLM_MODEL: '[NV]GLM-5.3-flash'
      CARD_PATH: fixtures/qidu-he-if/qidu-he-if.character.json
      PRESET_PATH: fixtures/qidu-he-if/riyuexi-glm-active.json
      LAB_OUT: ${{ github.workspace }}/bench-evidence/qidu-he-rc4-behavior
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-rc4-behavior-st
      ST_URL: http://127.0.0.1:8000/
      PLAYWRIGHT_MODULE: file:///tmp/qidu-rc4-behavior-browser/node_modules/playwright-core/index.mjs
    steps:
      - uses: actions/checkout@v4

      - name: Assert committed rc4 fixture
        run: |
          node - <<'NODE'
          const d=JSON.parse(require('fs').readFileSync(process.env.CARD_PATH,'utf8')).data;
          if(d.character_version!=='0.3.0-rc4') throw new Error(d.character_version);
          if(d.extensions.world!=='交界都市普通人HE IF世界书') throw new Error(d.extensions.world);
          if(d.character_book.entries.length!==31) throw new Error(String(d.character_book.entries.length));
          console.log('fixture', d.character_version, d.extensions.world, d.character_book.entries.length);
          NODE

      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          mkdir -p "$LAB_OUT"
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          cd "$ST_DIR" && npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$LAB_OUT/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-rc4-behavior.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat "$LAB_OUT/st-runtime.log"; exit 1

      - name: Install browser driver
        run: |
          set -euo pipefail
          rm -rf /tmp/qidu-rc4-behavior-browser
          mkdir -p /tmp/qidu-rc4-behavior-browser
          cd /tmp/qidu-rc4-behavior-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          echo "CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Native ST scan then real GLM behavior regression
        run: node .lab/qidu-he-rc4-behavior.mjs

      - name: Stop ST
        if: always()
        run: if [ -f /tmp/qidu-he-rc4-behavior.pid ]; then kill "$(cat /tmp/qidu-he-rc4-behavior.pid)" 2>/dev/null || true; fi

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-rc4-native-st-glm-behavior
          path: bench-evidence/qidu-he-rc4-behavior/
          if-no-files-found: error
