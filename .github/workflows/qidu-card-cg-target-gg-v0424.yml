name: Qidu CG v0424 GG Targeted Behavior

on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-cg-v0424-gg-trigger.txt'

permissions:
  contents: read

jobs:
  targeted-cg-behavior-gg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODEL_API_KEY: ${{ secrets.GG }}
      MODEL_API_BASE: https://gcli.ggchan.dev/v1
      CG_MODEL: 'gemini-3-flash-preview'
      CG_CASES: ann_first_meet,antoneva_first_meet,journey_ending,eternal_ending,sacrifice_male,sacrifice_female,final_male,box_female,box_unknown_gender,journey_repeat_suppressed
      CG_MAX_TOKENS: 8000
      CG_TIMEOUT_MS: 100000
      CG_ATTEMPTS: 2
      CG_CASE_GAP_MS: 12000
      LAB_OUT_CG_MODEL: ${{ github.workspace }}/cg-target-gg-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run GG full-context exact v0.4.24 CG behavior bench
        run: node .lab/qidu-card-model-bench-v0424-cg.mjs
      - name: Upload GG targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-cg-target-gg-evidence
          path: cg-target-gg-evidence/
          if-no-files-found: warn
