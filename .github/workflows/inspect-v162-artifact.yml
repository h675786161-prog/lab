name: Inspect GLM v1.6.2 artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v162-artifact.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and print original benchmark report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10115351986/zip" \
            -o artifact.zip
          unzip -q artifact.zip -d artifact
          echo '===== REPORT.MD BEGIN ====='
          cat artifact/report.md
          echo '===== REPORT.MD END ====='
