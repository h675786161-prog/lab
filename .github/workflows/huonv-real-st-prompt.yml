name: Huo Nü Real ST Prompt Capture

on:
  pull_request:
    paths:
      - 'cards/huonv/**'
      - '.lab/rebuild-preset13-for-st.mjs'
      - '.lab/capture-huonv-st-prompt.mjs'
      - '.lab/preset-three-person-13.active.part*.b64'
      - '.github/workflows/huonv-real-st-prompt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ST_DIR: /tmp/lingqi-huonv-st
      BROWSER_DIR: /tmp/lingqi-huonv-browser
      LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence/huonv-st-prompt
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      CARD_PATH: cards/huonv/霍女_玲七_v1.0.3.json
      PRESET_PATH: /tmp/三人逆行13_核心启用项_ST.json

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild base-ST generation-equivalent active preset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LAB_EVIDENCE_DIR"
          node .lab/rebuild-preset13-for-st.mjs "$PRESET_PATH" | tee "$LAB_EVIDENCE_DIR/preset-rebuild.txt"
          node -e "const p=require(process.env.PRESET_PATH); if(p.prompts.length!==100||p.stream_openai!==true)process.exit(1); console.log('ACTIVE_PRESET_OK')"

      - name: Clone exact SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          echo "$ST_COMMIT" > "$LAB_EVIDENCE_DIR/sillytavern-commit.txt"

      - name: Install SillyTavern dependencies
        working-directory: /tmp/lingqi-huonv-st
        run: npm ci

      - name: Start isolated SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          cd "$ST_DIR"
          nohup node server.js --listen --port 8000 --disableCsrf > "$LAB_EVIDENCE_DIR/sillytavern-runtime.log" 2>&1 &
          echo $! > /tmp/lingqi-huonv-st.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/ >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/lingqi-huonv-st.pid)" 2>/dev/null; then cat "$LAB_EVIDENCE_DIR/sillytavern-runtime.log"; exit 1; fi
            sleep 1
          done
          exit 1

      - name: Prepare browser
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BROWSER_DIR"
          mkdir -p "$BROWSER_DIR"
          cd "$BROWSER_DIR"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "LAB_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "LAB_PLAYWRIGHT_CORE_ENTRY=file://$BROWSER_DIR/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"

      - name: Capture request assembled by real SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          export CARD_ABS="$GITHUB_WORKSPACE/$CARD_PATH"
          export PRESET_ABS="$PRESET_PATH"
          node .lab/capture-huonv-st-prompt.mjs

      - name: Stop isolated runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/lingqi-huonv-st.pid ]; then kill "$(cat /tmp/lingqi-huonv-st.pid)" 2>/dev/null || true; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huonv-real-st-prompt
          path: lab-evidence/huonv-st-prompt/
          if-no-files-found: error
