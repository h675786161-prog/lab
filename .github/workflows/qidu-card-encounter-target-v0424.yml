name: Qidu v0424 Targeted Encounter

on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-encounter-v0424-target-trigger.txt'

permissions:
  contents: read

jobs:
  encounter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MODEL_API_KEY: ${{ secrets.GG }}
      MODEL_API_BASE: https://gcli.ggchan.dev/v1
      RELEASE_MODEL: 'gemini-3-flash-preview'
      LAB_OUT_ENCOUNTER: bench-evidence/qidu-card-v0421-encounter
    steps:
      - uses: actions/checkout@v4
      - name: Adapt encounter probe to exact v0.4.24 candidate
        run: python .lab/qidu-final-adapt-probes-v0424.py
      - name: Run targeted encounter regression
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2 3; do
            node .lab/qidu-card-model-bench-v0421-encounter.mjs && exit 0
            echo "encounter retry $n"
            sleep 15
          done
          exit 1
      - name: Upload encounter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-encounter-target
          path: bench-evidence/qidu-card-v0421-encounter/
          if-no-files-found: warn
