name: Qidu HE IF v0.3 rc4 UI acceptance v7

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-rc4-ui-acceptance-v7.yml'
      - '.lab/qidu-he-v03-rc4-patch.py'

permissions:
  contents: read

jobs:
  ui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARD: fixtures/qidu-he-if/qidu-he-if.character.json
      EVIDENCE: ${{ github.workspace }}/bench-evidence/qidu-he-v03-rc4-ui-v7
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-v03-rc4-ui-v7-st
    steps:
      - uses: actions/checkout@v4
      - name: Build rc4 candidate
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python .lab/qidu-he-v03-rc4-patch.py
      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          cd "$ST_DIR" && npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-v03-rc4-ui-v7.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat "$EVIDENCE/st-runtime.log"; exit 1
      - name: Real UI path with automatic lore prompt handling
        run: |
          set -euo pipefail
          mkdir -p /tmp/qidu-rc4-ui-v7-browser && cd /tmp/qidu-rc4-ui-v7-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/qidu-rc4-ui-v7.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const {chromium}=await import('file:///tmp/qidu-rc4-ui-v7-browser/node_modules/playwright-core/index.mjs');
          const raw=await fs.readFile(process.env.CARD,'utf8');
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          const ev={stCommit:process.env.ST_COMMIT,pageErrors,startupDialogs:[],loreDialogSnapshots:[]};
          const save=async(name='ui-progress.json')=>fs.writeFile(`${process.env.EVIDENCE}/${name}`,JSON.stringify(ev,null,2));
          const snapDialogs=()=>page.evaluate(()=>[...document.querySelectorAll('dialog[open]')].map(d=>({id:d.getAttribute('data-id')||'',text:(d.innerText||d.textContent||'').trim().slice(0,4000),display:getComputedStyle(d).display,buttons:[...d.querySelectorAll('[role="button"],button,.menu_button')].map(b=>({text:(b.innerText||b.textContent||'').trim(),result:b.getAttribute('data-result')})).filter(x=>x.text)})));
          const acceptTopLore=async()=>{
            const dialogs=page.locator('dialog[open]');
            for(let i=(await dialogs.count())-1;i>=0;i--){
              const d=dialogs.nth(i);
              if(!(await d.isVisible().catch(()=>false))) continue;
              const text=(await d.innerText().catch(()=>''));
              if(!text.includes('embedded World/Lorebook')) continue;
              const id=await d.getAttribute('data-id');
              ev.loreDialogSnapshots.push({phase:'accept',id,text:text.slice(0,4000),all:await snapDialogs()});
              await save();
              const yes=d.locator('[role="button"][data-result="1"]').first();
              if(!(await yes.isVisible().catch(()=>false))) throw new Error('top lore dialog has no visible Yes '+text);
              await yes.click();
              if(id) await page.locator(`dialog[data-id="${id}"]`).waitFor({state:'hidden',timeout:10000});
              else await page.waitForTimeout(700);
              return true;
            }
            return false;
          };

          await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2500);
          ev.imported=await page.evaluate(async raw=>{const f=new FormData();f.set('file_type','json');f.set('avatar',new Blob([raw],{type:'application/json'}),'qidu-he-v030-rc4.character.json');const r=await fetch('/api/characters/import',{method:'POST',body:f});return {ok:r.ok,status:r.status,text:(await r.text()).slice(0,500)};},raw);
          if(!ev.imported.ok) throw new Error('seed import failed '+JSON.stringify(ev.imported));
          await page.reload({waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(3500);

          // Clean lab first-run welcome. Close it with the visible Cancel control.
          for(let guard=0;guard<4;guard++){
            const visible=page.locator('dialog[open]:visible');
            const n=await visible.count(); if(!n) break;
            const d=visible.nth(n-1); const text=await d.innerText().catch(()=> '');
            if(text.includes('Welcome to SillyTavern')){
              ev.startupDialogs.push({id:await d.getAttribute('data-id'),text:text.slice(0,4000)}); await save();
              const cancel=d.getByRole('button',{name:/^(cancel|取消)$/i}).first();
              if(await cancel.isVisible().catch(()=>false)) await cancel.click(); else await page.keyboard.press('Escape');
              await page.waitForTimeout(800); continue;
            }
            break;
          }

          ev.chid=await page.evaluate(async()=>{const st=await import('/script.js');await st.getCharacters();if(typeof st.printCharactersDebounced==='function')st.printCharactersDebounced();await new Promise(r=>setTimeout(r,700));return (st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');});
          if(ev.chid<0) throw new Error('rc4 missing');

          await page.locator('#rightNavDrawerIcon').click();
          await page.locator('#right-nav-panel').waitFor({state:'visible',timeout:10000});
          const card=page.locator(`#rm_print_characters_block .character_select[data-chid="${ev.chid}"]`).first();
          await card.waitFor({state:'visible',timeout:15000}); await card.click();
          await page.waitForFunction(async chid=>{const st=await import('/script.js');return String(st.this_chid)===String(chid)&&!!st.getCurrentChatId?.();},ev.chid,{timeout:15000});
          await page.waitForTimeout(900);

          ev.afterCharacterClick=await page.evaluate(async()=>{const st=await import('/script.js');const wi=await import('/scripts/world-info.js');await st.getCharacters();const chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');const sorted=await wi.getSortedEntries();return {thisChid:st.this_chid,currentChatId:st.getCurrentChatId?.()||null,activeWorld:st.characters[chid]?.data?.extensions?.world||'',worldNames:[...(wi.world_names||[])],sortedCount:sorted.length};});
          ev.dialogsAfterCharacterClick=await snapDialogs(); await save();

          // ST may auto-prompt for embedded lore immediately after the character opens.
          ev.usedAutomaticLorePrompt=await acceptTopLore();
          if(!ev.usedAutomaticLorePrompt){
            const management=page.locator('#char-management-dropdown');
            await management.waitFor({state:'visible',timeout:10000});
            await management.selectOption({label:'Import Card Lore'});
            await page.waitForTimeout(500);
            ev.dialogsAfterManualMenu=await snapDialogs(); await save();
            if(!(await acceptTopLore())) throw new Error('Import Card Lore did not open a lore confirmation dialog '+JSON.stringify(ev.dialogsAfterManualMenu));
          }

          await page.waitForFunction(async world=>{const wi=await import('/scripts/world-info.js');return (wi.world_names||[]).includes(world);},ev.afterCharacterClick.activeWorld,{timeout:15000});
          await page.waitForTimeout(1400);

          ev.final=await page.evaluate(async()=>{const st=await import('/script.js');const wi=await import('/scripts/world-info.js');await st.getCharacters();const chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');const sorted=await wi.getSortedEntries();const defaults={trigger:'normal',personaDescription:'',characterDescription:'',characterPersonality:'',characterDepthPrompt:'',scenario:'',creatorNotes:''};const probes=[['芭蕾舞蹈室','源千雪：'],['喷泉广场街头演出','米菈：'],['警局侦探案件','亚修：'],['圣星教会礼拜花房','伊萨克'],['旅行马戏团巡演篷车','悠久乐园'],['黑羽莲华','黑羽莲华']];const scans=[];for(const [text,needle] of probes){const r=await wi.getWorldInfoPrompt([text],200000,true,defaults);const joined=[r.worldInfoString,r.worldInfoBefore,r.worldInfoAfter,JSON.stringify(r.worldInfoDepth||[]),JSON.stringify(r.outletEntries||{})].join('\n');scans.push({text,needle,hit:joined.includes(needle)});}return {thisChid:st.this_chid,currentChatId:st.getCurrentChatId?.()||null,activeWorld:st.characters[chid]?.data?.extensions?.world||'',worldNames:[...(wi.world_names||[])],sortedCount:sorted.length,sortedWorlds:[...new Set(sorted.map(e=>e.world))],scans};});
          ev.finalDialogs=await snapDialogs();
          console.log(JSON.stringify(ev,null,2)); await save('ui-acceptance.json');
          await page.screenshot({path:`${process.env.EVIDENCE}/ui-acceptance.png`,fullPage:true}); await browser.close();
          const f=ev.final;if(pageErrors.length||String(f.thisChid)!==String(ev.chid)||!f.currentChatId||f.activeWorld!=='交界都市普通人HE IF世界书'||!f.worldNames.includes(f.activeWorld)||f.sortedCount<31||f.scans.some(x=>!x.hit))throw new Error('UI acceptance failed '+JSON.stringify(ev));
          NODE
          node /tmp/qidu-rc4-ui-v7.mjs
      - name: Stop ST
        if: always()
        run: if [ -f /tmp/qidu-he-v03-rc4-ui-v7.pid ]; then kill "$(cat /tmp/qidu-he-v03-rc4-ui-v7.pid)" 2>/dev/null || true; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-v03-rc4-ui-v7
          path: bench-evidence/qidu-he-v03-rc4-ui-v7/
          if-no-files-found: error
