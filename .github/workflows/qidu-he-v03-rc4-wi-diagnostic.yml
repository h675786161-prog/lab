name: Qidu HE IF v0.3 rc4 WI diagnostic

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-rc4-wi-diagnostic.yml'
      - '.lab/qidu-he-v03-rc4-patch.py'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARD: fixtures/qidu-he-if/qidu-he-if.character.json
      EVIDENCE: ${{ github.workspace }}/bench-evidence/qidu-he-v03-rc4-wi-diagnostic
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-v03-rc4-diag-st
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate
        run: |
          mkdir -p "$EVIDENCE"
          python .lab/qidu-he-v03-rc4-patch.py
      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          cd "$ST_DIR" && npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-v03-rc4-diag.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat "$EVIDENCE/st-runtime.log"; exit 1
      - name: Diagnose browser world-info state
        run: |
          set -euo pipefail
          mkdir -p /tmp/qidu-rc4-diag-browser && cd /tmp/qidu-rc4-diag-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/qidu-rc4-diag.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const {chromium}=await import('file:///tmp/qidu-rc4-diag-browser/node_modules/playwright-core/index.mjs');
          const raw=await fs.readFile(process.env.CARD,'utf8');
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(2500);
          await page.evaluate(async raw=>{const f=new FormData();f.set('file_type','json');f.set('avatar',new Blob([raw],{type:'application/json'}),'rc4.character.json');const r=await fetch('/api/characters/import',{method:'POST',body:f});if(!r.ok)throw new Error(await r.text())},raw);
          const report=await page.evaluate(async()=>{
            const st=await import('/script.js'); const wi=await import('/scripts/world-info.js');
            await st.getCharacters(); let chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');
            if(chid<0) throw new Error('rc4 missing');
            await Promise.resolve(st.select_selected_character(chid,{switchMenu:false})); await new Promise(r=>setTimeout(r,1000));
            wi.checkEmbeddedWorld(chid); await wi.importEmbeddedWorldInfo(true); await new Promise(r=>setTimeout(r,1200));
            await st.getCharacters(); chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');
            await Promise.resolve(st.select_selected_character(chid,{switchMenu:false})); await new Promise(r=>setTimeout(r,1000));
            const active=st.characters[chid]?.data?.extensions?.world||'';
            const loaded=await wi.loadWorldInfo(active);
            const loadedEntries=loaded?.entries ? Object.values(loaded.entries) : [];
            const sorted=typeof wi.getSortedEntries==='function' ? await wi.getSortedEntries() : [];
            const defaults={trigger:'normal',personaDescription:'',characterDescription:'',characterPersonality:'',characterDepthPrompt:'',scenario:'',creatorNotes:''};
            const prompt=await wi.getWorldInfoPrompt(['下午去学园区的芭蕾舞蹈室看看。'],200000,true,defaults);
            const summarize=e=>e?{uid:e.uid,world:e.world,key:e.key,keysecondary:e.keysecondary,content:String(e.content||'').slice(0,300),disable:e.disable,constant:e.constant,position:e.position,order:e.order}:null;
            return {
              chid, exportedThisChid:st.this_chid, characterName:st.characters[chid]?.name,
              currentChatId:typeof st.getCurrentChatId==='function'?st.getCurrentChatId():null,
              chatLength:Array.isArray(st.chat)?st.chat.length:null,
              activeWorld:active, worldNames:[...(wi.world_names||[])],
              loadedEntryCount:loadedEntries.length, loadedSample:loadedEntries.slice(0,5).map(summarize),
              sortedEntryCount:Array.isArray(sorted)?sorted.length:null, sortedWorlds:Array.isArray(sorted)?[...new Set(sorted.map(e=>e.world))]:[], sortedSample:Array.isArray(sorted)?sorted.slice(0,8).map(summarize):[],
              promptKeys:Object.keys(prompt||{}),
              promptSummary:Object.fromEntries(Object.entries(prompt||{}).map(([k,v])=>[k,typeof v==='string'?{type:'string',length:v.length,preview:v.slice(0,500)}:Array.isArray(v)?{type:'array',length:v.length,preview:JSON.stringify(v).slice(0,500)}:v instanceof Set?{type:'set',size:v.size,preview:JSON.stringify([...v].slice(0,5))}:{type:typeof v,preview:JSON.stringify(v).slice(0,500)}]))
            };
          });
          const out={stCommit:process.env.ST_COMMIT,report,errors}; console.log(JSON.stringify(out,null,2));
          await fs.writeFile(`${process.env.EVIDENCE}/diagnostic.json`,JSON.stringify(out,null,2)); await browser.close();
          if(errors.length) throw new Error('page errors '+JSON.stringify(errors));
          NODE
          node /tmp/qidu-rc4-diag.mjs
      - name: Stop ST
        if: always()
        run: if [ -f /tmp/qidu-he-v03-rc4-diag.pid ]; then kill "$(cat /tmp/qidu-he-v03-rc4-diag.pid)" 2>/dev/null || true; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-v03-rc4-wi-diagnostic
          path: bench-evidence/qidu-he-v03-rc4-wi-diagnostic/
          if-no-files-found: error
