name: Qidu Card v0424 Final Release Gate

on:
  workflow_dispatch:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-final-v0424-trigger.txt'

permissions:
  contents: read

concurrency:
  group: qidu-v0424-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-sillytavern:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ST_DIR: /tmp/qidu-sillytavern
      BROWSER_DIR: /tmp/qidu-browser-qa
      LAB_EVIDENCE_DIR: ${{ github.workspace }}/release-evidence
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      TAVERN_HELPER_COMMIT: fe6388985ffb8a3d9ac08d09b9dfb28423a5fc2b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone exact SillyTavern runtime
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
      - name: Install SillyTavern dependencies
        working-directory: /tmp/qidu-sillytavern
        run: npm ci
      - name: Install exact Tavern Helper for embedded card-script acceptance
        run: |
          set -euo pipefail
          HELPER_DIR="$ST_DIR/public/scripts/extensions/third-party/JS-Slash-Runner"
          rm -rf "$HELPER_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/N0VI028/JS-Slash-Runner.git "$HELPER_DIR"
          git -C "$HELPER_DIR" fetch origin "$TAVERN_HELPER_COMMIT" --depth=1
          git -C "$HELPER_DIR" checkout --detach "$TAVERN_HELPER_COMMIT"
          test "$(git -C "$HELPER_DIR" rev-parse HEAD)" = "$TAVERN_HELPER_COMMIT"
          corepack enable
          cd "$HELPER_DIR"
          pnpm install --frozen-lockfile
          ST_IMPORT_DEPTH=5 pnpm build
          test -s dist/index.js
      - name: Start isolated SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$LAB_EVIDENCE_DIR"
          mkdir -p "$LAB_EVIDENCE_DIR"
          cd "$ST_DIR"
          nohup node server.js --listen --port 8000 --disableCsrf > /tmp/qidu-sillytavern.log 2>&1 &
          echo $! > /tmp/qidu-sillytavern.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/ >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/qidu-sillytavern.pid)" 2>/dev/null; then cat /tmp/qidu-sillytavern.log; exit 1; fi
            sleep 1
          done
          cat /tmp/qidu-sillytavern.log
          exit 1
      - name: Prepare browser QA
        run: |
          set -euo pipefail
          rm -rf "$BROWSER_DIR"
          mkdir -p "$BROWSER_DIR"
          cd "$BROWSER_DIR"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "LAB_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "LAB_PLAYWRIGHT_CORE_ENTRY=file://$BROWSER_DIR/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          echo "LAB_ST_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "LAB_ST_DIR=$ST_DIR" >> "$GITHUB_ENV"
      - name: Run exact release candidate UI acceptance
        run: node .lab/runtime-release-candidate-v0424.mjs
      - name: Run exact 10-CG browser acceptance
        run: node .lab/runtime-cg-v0424.mjs
      - name: Stop isolated runtime
        if: always()
        run: |
          if [ -f /tmp/qidu-sillytavern.pid ]; then kill "$(cat /tmp/qidu-sillytavern.pid)" 2>/dev/null || true; fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-final-browser-evidence
          path: release-evidence/
          if-no-files-found: error

  cg-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - group: a
            cases: ann_first_meet,antoneva_first_meet,journey_ending,eternal_ending,sacrifice_male
          - group: b
            cases: sacrifice_female,final_male,box_female,box_unknown_gender,journey_repeat_suppressed
    env:
      MODEL_API_KEY: ${{ secrets.GG }}
      MODEL_API_BASE: https://gcli.ggchan.dev/v1
      CG_MODEL: 'gemini-3-flash-preview'
      CG_CASES: ${{ matrix.cases }}
      CG_MAX_TOKENS: 8000
      CG_TIMEOUT_MS: 100000
      CG_ATTEMPTS: 2
      CG_CASE_GAP_MS: 12000
      LAB_OUT_CG_MODEL: ${{ github.workspace }}/cg-model-evidence/${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run exact CG behavior gate
        run: node .lab/qidu-card-model-bench-v0424-cg.mjs
      - name: Upload CG behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-final-cg-behavior-${{ matrix.group }}
          path: cg-model-evidence/${{ matrix.group }}/
          if-no-files-found: warn

  narrative:
    needs: cg-behavior
    if: ${{ needs.cg-behavior.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      MODEL_API_KEY: ${{ secrets.GG }}
      MODEL_API_BASE: https://gcli.ggchan.dev/v1
      RELEASE_MODEL: 'gemini-3-flash-preview'
      LAB_OUT: bench-evidence/qidu-card-v0421-core
      LAB_OUT_CONFLICT: bench-evidence/qidu-card-v0418-preset-conflict
      LAB_OUT_INFO: bench-evidence/qidu-card-v0423-info-timeline
      LAB_OUT_ENCOUNTER: bench-evidence/qidu-card-v0421-encounter
      LAB_OUT_NPC_KNOWLEDGE: bench-evidence/qidu-card-v0423-npc-knowledge
      LAB_OUT_NPC_SOURCE: bench-evidence/qidu-card-v0423-offscreen-source
      LAB_OUT_GENDER: bench-evidence/qidu-card-v0424-user-gender
      LAB_OUT_SHELL: bench-evidence/qidu-card-v0424-output-shell
      LAB_OUT_FLOW: bench-evidence/qidu-card-v0424-narrative-flow
    steps:
      - uses: actions/checkout@v4
      - name: Adapt narrative probes to exact v0.4.24 candidate
        run: python .lab/qidu-final-adapt-probes-v0424.py
      - name: Record behavioral gate model
        run: |
          echo "provider_base=$MODEL_API_BASE"
          echo "behavior_model=$RELEASE_MODEL"
      - id: core
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0421-core.mjs && exit 0
            echo "core retry $n"; sleep 15
          done
          exit 1
      - run: sleep 12
      - id: encounter
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0421-encounter.mjs && exit 0
            echo "encounter retry $n"; sleep 15
          done
          exit 1
      - run: sleep 12
      - id: conflict
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0418-preset-conflict.mjs && exit 0
            echo "conflict retry $n"; sleep 15
          done
          exit 1
      - run: sleep 12
      - id: info
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            if node .lab/qidu-card-model-bench-v0423-info-timeline.mjs; then
              node .lab/qidu-info-report-gate-v0423.mjs && exit 0
            fi
            echo "info retry $n"; sleep 15
          done
          exit 1
      - run: sleep 12
        if: always()
      - id: npc
        if: always()
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0423-npc-knowledge.mjs && exit 0
            echo "npc retry $n"; sleep 15
          done
          exit 1
      - run: sleep 12
        if: always()
      - id: npcsource
        if: always()
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0423-offscreen-source.mjs && exit 0
            echo "npcsource retry $n"; sleep 15
          done
          exit 1
      - run: sleep 12
        if: always()
      - id: chimera
        if: always()
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-first-chimera-release-v0423.mjs && exit 0
            echo "chimera retry $n"; sleep 15
          done
          exit 1
      - run: sleep 12
        if: always()
      - id: gender
        if: always()
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0424-user-gender.mjs && exit 0
            echo "gender retry $n"; sleep 15
          done
          exit 1
      - run: sleep 12
        if: always()
      - id: shell
        if: always()
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0424-output-shell.mjs && exit 0
            echo "shell retry $n"; sleep 15
          done
          exit 1
      - run: sleep 12
        if: always()
      - id: flow
        if: always()
        continue-on-error: true
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0424-flow.mjs && exit 0
            echo "flow retry $n"; sleep 15
          done
          exit 1
      - name: Enforce narrative gate
        if: always()
        run: |
          printf 'core=%s\n' '${{ steps.core.outcome }}'
          printf 'encounter=%s\n' '${{ steps.encounter.outcome }}'
          printf 'conflict=%s\n' '${{ steps.conflict.outcome }}'
          printf 'info=%s\n' '${{ steps.info.outcome }}'
          printf 'npc=%s\n' '${{ steps.npc.outcome }}'
          printf 'npcsource=%s\n' '${{ steps.npcsource.outcome }}'
          printf 'chimera=%s\n' '${{ steps.chimera.outcome }}'
          printf 'gender=%s\n' '${{ steps.gender.outcome }}'
          printf 'shell=%s\n' '${{ steps.shell.outcome }}'
          printf 'flow=%s\n' '${{ steps.flow.outcome }}'
          test '${{ steps.core.outcome }}' = success
          test '${{ steps.encounter.outcome }}' = success
          test '${{ steps.conflict.outcome }}' = success
          test '${{ steps.info.outcome }}' = success
          test '${{ steps.npc.outcome }}' = success
          test '${{ steps.npcsource.outcome }}' = success
          test '${{ steps.chimera.outcome }}' = success
          test '${{ steps.gender.outcome }}' = success
          test '${{ steps.shell.outcome }}' = success
          test '${{ steps.flow.outcome }}' = success
      - name: Upload narrative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-final-narrative-evidence
          path: bench-evidence/
          if-no-files-found: warn

  package:
    needs: [real-sillytavern, cg-behavior, narrative]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact release artifact
        run: |
          set -euo pipefail
          rm -rf dist-release
          mkdir -p dist-release
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { loadQiduCgCandidate, CG_KEYS, assertReleasePrivacy } from './.lab/qidu-card-v0424-cg-candidate.mjs';
          const {card,raw,compactSha256}=await loadQiduCgCandidate(process.cwd());
          assertReleasePrivacy(card);
          const expectedNotes='作者：叶罹。相关卡：《永远的7日之都》七日轮回文本互动。原作向文本互动角色卡，以七日轮回为核心，包含区域巡查、角色剧情、战术终端、状态记录、多结局分支与CG触发。';
          if(card.data?.creator!=='叶罹') throw new Error('creator mismatch');
          if(card.data?.creator_notes!==expectedNotes||card.creatorcomment!==expectedNotes) throw new Error('creator notes mismatch');
          if(card.data?.character_version!=='0.4.24') throw new Error('version mismatch');
          if(card.data?.character_book?.extensions?.creator!=='叶罹'||card.data?.character_book?.extensions?.version!=='0.4.24') throw new Error('worldbook metadata mismatch');
          if(Object.prototype.hasOwnProperty.call(card,'create_date')||Object.prototype.hasOwnProperty.call(card.data||{},'create_date')) throw new Error('creation timestamp remains');
          const txt=raw.toString('utf8');
          if(/(?:玲|h675786161|github\.com|raw\.githubusercontent\.com|api\.github\.com|实验酒馆|world-backstage|(?:\bLAB\b|[-_]lab\b|\blab[-_])|feature\/qidu-card|gmail\.com)/i.test(txt)) throw new Error('private development provenance remains in final bytes');
          const scripts=card.data?.extensions?.regex_scripts||[];
          const rx=id=>scripts.find(x=>x?.id===id);
          if(!rx('f7d-terminal-v040')||!rx('f7d-state-hide-v040')||!rx('f7d-choices-wrap-v0414')||!rx('f7d-choice-button-v0414')) throw new Error('required embedded UI regex missing');
          if(String(rx('f7d-state-hide-v040').replaceString??'')!=='') throw new Error('state is not hidden');
          for(const key of CG_KEYS){
            const cg=rx(`f7d-cg-${key}-v0424`);
            if(!cg) throw new Error(`CG regex missing: ${key}`);
            const rep=String(cg.replaceString||'');
            if(!rep.includes('data:image/webp;base64,')||!rep.includes('data-f7d-cg-image="1"')) throw new Error(`CG image not embedded: ${key}`);
          }
          const entries=card.data?.character_book?.entries||[];
          const by=p=>entries.find(e=>String(e.name||'').startsWith(p));
          const required=[
            [by('04｜'),'角色首次识别门禁｜隐藏执行'],
            [by('04｜'),'NPC零来源硬锁与不可见自检｜隐藏执行'],
            [by('04｜'),'禁止合规自评旁白｜隐藏执行'],
            [by('04｜'),'第一活骸事故事实边界｜隐藏执行'],
            [by('04｜'),'高校初见身份来源连续性｜隐藏执行'],
            [by('04｜'),'战术终端标签强制｜隐藏执行'],
            [by('04｜'),'CG事务原子性'],
            [by('04｜'),'剧情流速推进与日结｜最高优先级隐藏执行'],
            [by('91｜'),'无节点状态迁移与日结字段'],
            [by('00｜'),'玩家性别同步｜高优先'],
            [by('91｜'),'player_profile.gender初始化顺序'],
            [by('10｜'),'安初见CG｜首条开场强制'],
            [by('04｜'),'终端标签语法硬锁'],
            [by('30｜'),'高校已识别角色不得重新匿名'],
            [by('41｜'),'第一活骸事故只讲已锚定事实'],
            [by('44｜'),'高校身份来源顺序'],
            [by('67｜'),'泰丝拉姓名必须来自珈儿介绍'],
          ];
          for(const [entry,marker] of required) if(!String(entry?.content||'').includes(marker)) throw new Error(`missing release rule: ${marker}`);
          const initialMatch=String(card.data?.first_mes||'').match(/<f7d_state>([\s\S]*?)<\/f7d_state>/i);
          if(!initialMatch) throw new Error('initial state missing');
          const initial=JSON.parse(initialMatch[1]);
          if(initial.intel_flags?.zero_identity_known!==false||initial.intel_flags?.countdown_meaning_known!==false) throw new Error('initial secret flags invalid');
          if(!initial.npc_intel||Object.keys(initial.npc_intel).length!==0) throw new Error('initial npc_intel invalid');
          if(initial.player_profile?.gender!=='unknown') throw new Error('initial gender invalid');
          if(Object.prototype.hasOwnProperty.call(initial,'node_used')) throw new Error('legacy node_used remains in initial state');
          if(Object.values(initial.regions||{}).some(r=>r&&Object.prototype.hasOwnProperty.call(r,'patrol'))) throw new Error('legacy patrol counter remains in initial state');
          if(initial.day_ready_to_sleep!==false) throw new Error('initial day_ready_to_sleep invalid');
          if(initial.cg_system?.mode!=='direct_only'||initial.cg_system?.album_enabled!==false||initial.cg_system?.responsive_enabled!==true) throw new Error('initial CG mode invalid');
          if(initial.cg_system?.shown?.ann_first_meet!==true) throw new Error('opening Ann CG shown flag invalid');
          if(!CG_KEYS.filter(k=>k!=='cg_ann_first_meet').every(k=>initial.cg_system?.shown?.[k.replace(/^cg_/,'')]===false)) throw new Error('other initial CG shown flags invalid');
          if(!/<f7d_cg\s+key=["']cg_ann_first_meet["']\s*>\s*<\/f7d_cg>/i.test(String(card.data?.first_mes||''))) throw new Error('opening Ann CG tag missing');
          if(!String(card.data?.post_history_instructions||'').includes('结构壳稳定性｜最高优先级隐藏执行')) throw new Error('stable output shell rule missing');
          const helper=card.data?.extensions?.tavern_helper;
          const helperScript=helper?.scripts?.find(x=>x?.id==='qidu-v0424-choice-bridge');
          if(!helperScript?.enabled||!String(helperScript?.content||'').includes('__F7D_CARD_CHOICE_BRIDGE_V0424__')) throw new Error('embedded clickable choice bridge missing');
          const choiceWrap=rx('f7d-choices-wrap-v0414');
          const choiceButton=rx('f7d-choice-button-v0414');
          if(!String(choiceWrap?.replaceString||'').includes('data-f7d-choice-free="1"')) throw new Error('free-input choice missing');
          if(!String(choiceButton?.replaceString||'').includes('<button')||!String(choiceButton?.replaceString||'').includes('data-f7d-choice="1"')) throw new Error('clickable choice button regex missing');
          if(card.data?.extensions?.qidu_frontend?.choice_runtime!=='tavern_helper_embedded_script') throw new Error('choice runtime metadata missing');
          const qf=card.data?.extensions?.qidu_frontend||{};
          if(qf.progression_mode!=='narrative_flow'||qf.action_nodes!==false||qf.patrol_counter!==false) throw new Error('narrative-flow frontend metadata invalid');
          if(qf.region_liberation!=='auto_on_story_completion'||qf.core_purification!=='explicit_user_action_only'||qf.day_transition!=='explicit_sleep_only') throw new Error('narrative-flow policy metadata invalid');
          if(entries.some(e=>/(?:六|6)巡查/.test(String(e.name||'')))) throw new Error('counted-patrol worldbook title remains');
          const firstVisible=String(card.data?.first_mes||'').replace(/<f7d_state>[\s\S]*?<\/f7d_state>/gi,'');
          if(/行动节点\s*(?:尚未开始|\d+\s*\/\s*12)/.test(firstVisible)) throw new Error('opening still exposes action-node counter');
          const name='永远的7日之都-七日轮回文本互动-v0.4.24.json';
          await fs.writeFile(`dist-release/${name}`,raw);
          await fs.writeFile('dist-release/SHA256.txt',`${compactSha256}  ${name}\n`);
          console.log(JSON.stringify({version:card.data.character_version,creator:card.data.creator,sha256:compactSha256,bytes:raw.length,cgCount:CG_KEYS.length,privacy:true},null,2));
          NODE
      - name: Upload final release artifact
        uses: actions/upload-artifact@v4
        with:
          name: qidu-card-v0424-final-release
          path: dist-release/
          if-no-files-found: error
