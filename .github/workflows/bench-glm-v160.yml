name: Bench GLM v1.6 focused

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bench-glm-v160.yml'
      - '.lab/bench-glm-v160.mjs'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      GLM_MODEL: '[B]glm-5.3-flash'
      LAB_OUT: bench-evidence/glm-v160
    steps:
      - uses: actions/checkout@v4

      - name: Run focused GLM behavior benchmark
        run: node .lab/bench-glm-v160.mjs

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-glm-v160
          path: bench-evidence/glm-v160/
          if-no-files-found: warn
