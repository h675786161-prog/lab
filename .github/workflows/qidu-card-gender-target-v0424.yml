name: Qidu v0424 Targeted User Gender

on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-gender-v0424-target-trigger.txt'

permissions:
  contents: read

jobs:
  gender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_API_KEY: ${{ secrets.GG }}
      MODEL_API_BASE: https://gcli.ggchan.dev/v1
      RELEASE_MODEL: 'gemini-3-flash-preview'
      LAB_OUT_GENDER: bench-evidence/qidu-card-v0424-user-gender
    steps:
      - uses: actions/checkout@v4
      - name: Run user persona gender regression
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0424-user-gender.mjs && exit 0
            echo "gender retry $n"
            sleep 15
          done
          exit 1
      - name: Upload gender evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-user-gender-target
          path: bench-evidence/qidu-card-v0424-user-gender/
          if-no-files-found: warn
