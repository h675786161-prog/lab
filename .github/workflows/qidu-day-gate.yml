name: Qidu daily lore gate revision
on:
  push:
    branches: ['feature/qidu-day-gate-20261002']
    paths: ['.lab/fixtures/qidu-day-gate/patch.py','.lab/fixtures/qidu-day-gate/day-gate.js','.lab/fixtures/qidu-day-gate/test.mjs','.github/workflows/qidu-day-gate.yml']
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .lab/fixtures/qidu-day-gate/patch.py
      - run: node --check .lab/fixtures/qidu-day-gate/day-gate.js
      - run: node .lab/fixtures/qidu-day-gate/test.mjs
      - name: Save candidate on isolated branch
        run: |
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add .lab/fixtures/qidu-day-gate/Qidu-v0.4.42-day-gate.json .lab/fixtures/qidu-day-gate/revision-report.json .lab/fixtures/qidu-day-gate/gate-tests.json
          git commit -m "Save daily-gated candidate and validation evidence"
          git push origin HEAD:feature/qidu-day-gate-20261002
      - uses: actions/upload-artifact@v4
        with:
          name: qidu-v0442-day-gate
          path: |
            .lab/fixtures/qidu-day-gate/Qidu-v0.4.42-day-gate.json
            .lab/fixtures/qidu-day-gate/day-gate.js
            .lab/fixtures/qidu-day-gate/gate-tests.json
            .lab/fixtures/qidu-day-gate/revision-report.json
