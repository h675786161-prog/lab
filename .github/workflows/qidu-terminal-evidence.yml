name: Verify complete handoff evidence
on:
  push:
    branches: [audit/qidu-terminal-v1.0.4-20261007]
    paths: ['.github/workflows/qidu-terminal-evidence.yml']
permissions:
  contents: read
jobs:
  verify-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify eight exact raw attempts and contact isolation
        run: node .lab/evidence/qidu-terminal-v1.0.4-handoff-20261007/verify.mjs
