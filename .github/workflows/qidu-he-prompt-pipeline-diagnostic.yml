name: Qidu HE prompt pipeline diagnostic

on:
  push:
    branches:
      - qidu-he-if-longrp
    paths:
      - '.github/workflows/qidu-he-prompt-pipeline-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-prompt-st
      ST_URL: http://127.0.0.1:8000/
      CARD_PATH: fixtures/qidu-he-if/qidu-he-if.character.json
      PRESET_PATH: fixtures/qidu-he-if/riyuexi-glm-active.json
      LAB_OUT: bench-evidence/qidu-he-prompt-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed rc10 card
        run: |
          node - <<'NODE'
          const d=JSON.parse(require('fs').readFileSync(process.env.CARD_PATH,'utf8')).data;
          if(d.character_version!=='0.3.0-rc10') throw new Error(`expected rc10, got ${d.character_version}`);
          NODE

      - name: Prepare exact SillyTavern and browser
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR" /tmp/qidu-prompt-browser /tmp/qidu-prompt-data
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          cd "$ST_DIR" && npm ci
          mkdir -p /tmp/qidu-prompt-browser
          cd /tmp/qidu-prompt-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          echo "CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/$LAB_OUT"
          cd "$ST_DIR"
          nohup node server.js --listen --port 8000 --disableCsrf --dataRoot /tmp/qidu-prompt-data > "$GITHUB_WORKSPACE/$LAB_OUT/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-prompt-st.pid
          for i in $(seq 1 90); do
            if curl -fsS "$ST_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/$LAB_OUT/st-runtime.log"
          exit 1

      - name: Capture a real ST request before and after explicit prompt-order restoration
        run: |
          cat > /tmp/qidu-prompt-diagnostic.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const { chromium } = await import('file:///tmp/qidu-prompt-browser/node_modules/playwright-core/index.mjs');
          const card=JSON.parse(await fs.readFile(process.env.CARD_PATH,'utf8'));
          const data=card.data;
          const preset=JSON.parse(await fs.readFile(process.env.PRESET_PATH,'utf8'));
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.goto(process.env.ST_URL,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2500);
          for(let guard=0;guard<5;guard++){
            const ds=page.locator('dialog[open]:visible'); if(!(await ds.count())) break;
            const d=ds.nth((await ds.count())-1); const t=await d.innerText().catch(()=> '');
            if(!t.includes('Welcome to SillyTavern')) break;
            const c=d.getByRole('button',{name:/^(cancel|取消)$/i}).first();
            if(await c.isVisible().catch(()=>false)) await c.click(); else await page.keyboard.press('Escape');
            await page.waitForTimeout(300);
          }
          const raw=await fs.readFile(process.env.CARD_PATH,'utf8');
          const imp=await page.evaluate(async rawCard=>{const f=new FormData();f.set('file_type','json');f.set('avatar',new Blob([rawCard],{type:'application/json'}),'qidu-rc10.json');const r=await fetch('/api/characters/import',{method:'POST',body:f});return {ok:r.ok,status:r.status,text:(await r.text()).slice(0,300)};},raw);
          if(!imp.ok) throw new Error(`import failed ${JSON.stringify(imp)}`);
          await page.reload({waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(2500);
          const chid=await page.evaluate(async()=>{const st=await import('/script.js');await st.getCharacters();if(typeof st.printCharactersDebounced==='function')st.printCharactersDebounced();await new Promise(r=>setTimeout(r,500));return (st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc10');});
          if(chid<0) throw new Error('rc10 character missing');
          await page.locator('#rightNavDrawerIcon').click();
          await page.locator('#right-nav-panel').waitFor({state:'visible',timeout:10000});
          await page.locator(`#rm_print_characters_block .character_select[data-chid="${chid}"]`).first().click();
          await page.waitForFunction(async expected=>{const st=await import('/script.js');return String(st.this_chid)===String(expected)&&!!st.getCurrentChatId?.();},chid,{timeout:15000});
          await page.waitForTimeout(600);
          const acceptLore=async()=>{const ds=page.locator('dialog[open]');for(let i=(await ds.count())-1;i>=0;i--){const d=ds.nth(i);const t=await d.innerText().catch(()=> '');if(!t.includes('embedded World/Lorebook'))continue;await d.locator('[role="button"][data-result="1"]').first().click();await page.waitForTimeout(500);return true;}return false;};
          if(!(await acceptLore())){const menu=page.locator('#char-management-dropdown');await menu.waitFor({state:'visible',timeout:10000});await menu.selectOption({label:'Import Card Lore'});await page.waitForTimeout(300);if(!(await acceptLore()))throw new Error('lore import prompt missing');}
          const wanted=new Set(['⚖️RP模式','🪐均衡调度','🪐喜剧幽默','🎈烟火气息','🎈情感浓郁','🎈群像塑造','🌊自由变奏','👤平衡主导','🐚人格基底','🐚需求层析','🐚去中心化','🐚角色成长','🐚情绪重力','🐚标签隐身','🤝健康恋爱','⬆️自然推进','💖地狱难度','🎵半页诗|文艺细腻']);
          const fixturePrompts=(preset.prompts||[]).filter(p=>wanted.has(p.name)||['main','nsfw'].includes(p.identifier));
          const state=await page.evaluate(({fixturePrompts,sampling})=>{
            return (async()=>{
              const st=await import('/script.js'); const open=await import('/scripts/openai.js'); const pm=open.promptManager;
              const before={strategy:pm?.configuration?.promptOrder?.strategy,dummyId:pm?.configuration?.promptOrder?.dummyId,activeCharacter:pm?.activeCharacter?.id??null,promptOrder:(open.oai_settings.prompt_order||[]).map(x=>({character_id:x.character_id,count:x.order?.length,enabled:x.order?.filter(y=>y.enabled).map(y=>y.identifier)})),promptIds:(open.oai_settings.prompts||[]).map(p=>p.identifier)};
              const src=document.querySelector('#chat_completion_source'); const mainApi=document.querySelector('#main_api');
              mainApi.value='openai';mainApi.dispatchEvent(new Event('change',{bubbles:true}));await new Promise(r=>setTimeout(r,300));
              src.value='custom';src.dispatchEvent(new Event('change',{bubbles:true}));await new Promise(r=>setTimeout(r,300));
              Object.assign(open.oai_settings,{chat_completion_source:'custom',custom_url:'https://youzi.today/v1',custom_model:'[NV]GLM-5.3-flash',temperature:sampling.temperature??0.98,top_p:sampling.top_p??0.5,frequency_penalty:sampling.frequency_penalty??0,presence_penalty:sampling.presence_penalty??0,openai_max_tokens:30000,openai_max_context:200000,max_context_unlocked:true,stream_openai:false,bypass_status_check:true,custom_prompt_post_processing:''});
              const structuralIds=['worldInfoBefore','personaDescription','charDescription','charPersonality','scenario','worldInfoAfter','dialogueExamples','chatHistory','jailbreak'];
              const current=new Map((open.oai_settings.prompts||[]).map(p=>[p.identifier,p]));
              const merged=[]; const seen=new Set();
              for(const p of fixturePrompts){merged.push({...p,system_prompt:Boolean(p.system_prompt),marker:Boolean(p.marker)});seen.add(p.identifier);}
              for(const id of structuralIds){if(current.has(id)&&!seen.has(id)){merged.push(current.get(id));seen.add(id);}}
              pm.setPrompts(merged);
              const active=pm.activeCharacter || {id:pm?.configuration?.promptOrder?.dummyId??100000};
              const order=[...fixturePrompts.map(p=>({identifier:p.identifier,enabled:true})),...structuralIds.filter(id=>seen.has(id)).map(identifier=>({identifier,enabled:true}))];
              pm.removePromptOrderForCharacter(active);pm.addPromptOrderForCharacter(active,order);
              if(pm.render)pm.render(false);
              return {before,after:{activeCharacter:active.id,promptOrder:pm.getPromptOrderForCharacter(active),prompts:pm.getPromptsForCharacter(active,true).map(p=>({id:p.identifier,name:p.name,role:p.role,marker:p.marker}))}};
            })();
          },{fixturePrompts,sampling:preset.sampling||{}});
          const captures=[];
          await page.route('**/api/backends/chat-completions/generate',async route=>{let body={};try{body=JSON.parse(route.request().postData()||'{}')}catch{}captures.push(body);await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({id:'diag',choices:[{index:0,message:{role:'assistant',content:'诊断占位回复：已收到当前场景。'},finish_reason:'stop'}]})});});
          const user='午后我去学园区一间芭蕾舞蹈室给朋友送落下的水杯。排练还没结束，我站在门边等，不主动叫任何人的名字。继续眼前普通场景。';
          const ta=page.locator('#send_textarea');await ta.waitFor({state:'visible',timeout:15000});await ta.fill(user);await page.locator('#send_but').click();
          await page.waitForTimeout(1500);
          if(!captures.length) throw new Error('no chat-completions request captured');
          const req=captures.at(-1);const msgs=Array.isArray(req.messages)?req.messages:[];
          const report={state,request:{messageCount:msgs.length,messages:msgs.map((m,i)=>({i,role:m.role,name:m.name||null,content:String(m.content??'').slice(0,6000)}))},pageErrors};
          await fs.writeFile(path.join(process.env.LAB_OUT,'prompt-pipeline.json'),JSON.stringify(report,null,2));
          await page.screenshot({path:path.join(process.env.LAB_OUT,'prompt-pipeline.png'),fullPage:true});
          const joined=msgs.map(m=>String(m.content??'')).join('\n');
          const checks={hasUserScene:joined.includes('午后我去学园区一间芭蕾舞蹈室'),hasPresetRP:joined.includes('不要抢子民的台词'),hasCardWorld:joined.includes('交界都市'),hasScenario:joined.includes('当前时间从一个普通早晨开始')||joined.includes('三人合租公寓'),hasChatHistory:msgs.some(m=>m.role==='user'&&String(m.content??'').includes('午后我去学园区')),notLoreOnly:msgs.length>3};
          await fs.writeFile(path.join(process.env.LAB_OUT,'prompt-pipeline-checks.json'),JSON.stringify(checks,null,2));
          console.log('PROMPT_PIPELINE_CHECKS',checks,'messageCount',msgs.length);
          if(Object.values(checks).some(v=>!v)) throw new Error(`prompt pipeline incomplete ${JSON.stringify(checks)}`);
          await browser.close();
          NODE
          node /tmp/qidu-prompt-diagnostic.mjs

      - name: Stop ST
        if: always()
        run: |
          if [ -f /tmp/qidu-prompt-st.pid ]; then kill "$(cat /tmp/qidu-prompt-st.pid)" 2>/dev/null || true; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-prompt-pipeline
          path: bench-evidence/qidu-he-prompt-pipeline/
          if-no-files-found: error
