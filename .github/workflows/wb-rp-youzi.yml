name: World Backstage Youzi live RP memory
on:
  push:
    branches: [test/wb-memory-continuity-two-cards]
    paths:
      - '.lab/wb-rp-youzi.mjs'
      - '.github/workflows/wb-rp-youzi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-rp:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: h675786161-prog/world-backstage
          ref: 8b99b8150d1153a0720dc48ef5ac7a8c132a5a0b
          path: wb-candidate
      - uses: actions/checkout@v4
        with:
          repository: h675786161-prog/world-backstage
          ref: 9adafde433c13e20cde88e3ac7c712855969a430
          path: wb-baseline
      - name: Play Youzi RP and model-write memory at no more than 15 RPM
        env:
          LAB_MODEL_KEY: ${{ secrets.YOUZI }}
          LAB_MODEL_BASE_URL: https://cofi.date/v1
          LAB_MODEL_ID: agnes-3.0-flash
          LAB_RP_ROUNDS: 60
        run: node .lab/wb-rp-youzi.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb-youzi-live-rp
          path: bench-evidence/wb-youzi-rp/
          if-no-files-found: warn
