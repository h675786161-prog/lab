name: GLM Super Humanization v0.1

on:
  workflow_dispatch:
  push:
    branches: ['bench/glm-super-v01']
    paths:
      - '.github/workflows/glm-super-v01.yml'
      - '.lab/glm-super-v01.mjs'
      - 'fixtures/preset-benchmark/**'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ST_DIR: /tmp/lingqi-sillytavern
      LAB_ST_URL: http://127.0.0.1:8000
      LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Prepare isolated real SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR" "$LAB_EVIDENCE_DIR"
          mkdir -p "$LAB_EVIDENCE_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          printf 'repository=%s\nsha=%s\nsillytavern_commit=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$ST_COMMIT" > "$LAB_EVIDENCE_DIR/run-context.txt"
          cd "$ST_DIR"
          npm ci

      - name: Start isolated SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          cd "$ST_DIR"
          nohup node server.js --listen --port 8000 --disableCsrf > "$LAB_EVIDENCE_DIR/sillytavern-runtime.log" 2>&1 &
          echo $! > /tmp/lingqi-sillytavern.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 "$LAB_ST_URL/" >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/lingqi-sillytavern.pid)" 2>/dev/null; then cat "$LAB_EVIDENCE_DIR/sillytavern-runtime.log"; exit 1; fi
            sleep 1
          done
          exit 1

      - name: Run GLM super v0.1 A/B
        shell: bash
        env:
          YOUZI: ${{ secrets.YOUZI }}
        run: |
          set -euo pipefail
          node --check .lab/glm-super-v01.mjs
          node .lab/glm-super-v01.mjs

      - name: Record runtime tail
        if: always()
        shell: bash
        run: tail -n 500 "$LAB_EVIDENCE_DIR/sillytavern-runtime.log" > "$LAB_EVIDENCE_DIR/sillytavern-runtime-tail.log" 2>/dev/null || true

      - name: Stop isolated runtime
        if: always()
        shell: bash
        run: '[ ! -f /tmp/lingqi-sillytavern.pid ] || kill "$(cat /tmp/lingqi-sillytavern.pid)" 2>/dev/null || true'

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glm-super-v01
          path: lab-evidence/
          if-no-files-found: error
