name: World Backstage real Youzi memory safety
on:
  push:
    branches: [test/memory-hide-safe-recall-20261007]
    paths: ['.lab/wb-memory-real-youzi.mjs', '.lab/wb-youzi-select-model.mjs', '.lab/wb-memory-mom-selected.json', '.github/workflows/wb-memory-real-youzi.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-rp:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: [frieren, ashley]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LAB_ST_URL: http://127.0.0.1:8000
      LAB_ST_DIR: /tmp/wb-memory-real-st
      LAB_WB_SHA: b50dde3b7501a72267f0aeced876c0918d4b88b3
      LAB_RP_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select a different model from current Youzi catalog
        env:
          LAB_MODEL_KEY: ${{ secrets.YOUZI }}
          LAB_MODEL_BASE_URL: https://cofi.date/v1
        run: node .lab/wb-youzi-select-model.mjs
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: h675786161-prog/world-backstage
          ref: b50dde3b7501a72267f0aeced876c0918d4b88b3
          path: wb-candidate
      - name: Install Chinese screenshot fonts
        run: sudo apt-get install -y fonts-noto-cjk > /tmp/wb-font-install.log 2>&1
      - name: Prepare exact isolated SillyTavern 1.18.0
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$LAB_ST_DIR"
          git -C "$LAB_ST_DIR" fetch origin 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8 --depth=1
          git -C "$LAB_ST_DIR" checkout --detach 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
          npm ci --prefix "$LAB_ST_DIR"
          mkdir -p "$LAB_ST_DIR/public/scripts/extensions/third-party/world-backstage"
          rsync -a --exclude=.git wb-candidate/ "$LAB_ST_DIR/public/scripts/extensions/third-party/world-backstage/"
          mkdir -p /tmp/wb-browser
          npm install --prefix /tmp/wb-browser playwright-core@1.55.0 --no-audit --no-fund
          echo "LAB_PLAYWRIGHT_CORE_ENTRY=file:///tmp/wb-browser/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          echo "LAB_CHROME=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          mkdir -p bench-evidence
          cd "$LAB_ST_DIR"
          node server.js --port 8000 --disableCsrf > "$GITHUB_WORKSPACE/bench-evidence/server.log" 2>&1 &
          echo $! > /tmp/wb-memory-st.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run native ST generation and model-generated memory using existing Youzi secret
        env:
          LAB_MODEL_KEY: ${{ secrets.YOUZI }}
          LAB_MODEL_BASE_URL: https://cofi.date/v1
        run: node .lab/wb-memory-real-youzi.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb-memory-real-${{ matrix.case }}
          path: bench-evidence/
          if-no-files-found: error
      - name: Stop isolated runtime
        if: always()
        run: |
          if [ -f /tmp/wb-memory-st.pid ]; then kill "$(cat /tmp/wb-memory-st.pid)" || true; fi
