name: Qidu Card Final Release Gate 2

on:
  workflow_dispatch:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-final2-trigger.txt'

permissions:
  contents: read

jobs:
  real-sillytavern:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ST_DIR: /tmp/qidu-sillytavern
      BROWSER_DIR: /tmp/qidu-browser-qa
      LAB_EVIDENCE_DIR: ${{ github.workspace }}/release-evidence
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone exact SillyTavern runtime
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
      - name: Install SillyTavern dependencies
        working-directory: /tmp/qidu-sillytavern
        run: npm ci
      - name: Start isolated SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$LAB_EVIDENCE_DIR"
          mkdir -p "$LAB_EVIDENCE_DIR"
          cd "$ST_DIR"
          nohup node server.js --listen --port 8000 --disableCsrf > /tmp/qidu-sillytavern.log 2>&1 &
          echo $! > /tmp/qidu-sillytavern.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/ >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/qidu-sillytavern.pid)" 2>/dev/null; then cat /tmp/qidu-sillytavern.log; exit 1; fi
            sleep 1
          done
          cat /tmp/qidu-sillytavern.log
          exit 1
      - name: Prepare browser QA
        run: |
          set -euo pipefail
          rm -rf "$BROWSER_DIR"
          mkdir -p "$BROWSER_DIR"
          cd "$BROWSER_DIR"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "LAB_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "LAB_PLAYWRIGHT_CORE_ENTRY=file://$BROWSER_DIR/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          echo "LAB_ST_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "LAB_ST_DIR=$ST_DIR" >> "$GITHUB_ENV"
      - name: Run exact candidate browser acceptance
        run: node .lab/runtime-release-candidate-v0423.mjs
      - name: Stop isolated runtime
        if: always()
        run: |
          if [ -f /tmp/qidu-sillytavern.pid ]; then kill "$(cat /tmp/qidu-sillytavern.pid)" 2>/dev/null || true; fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0423-final2-browser-evidence
          path: release-evidence/
          if-no-files-found: error

  narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      MODEL_API_KEY: ${{ secrets.PIAOMIAO }}
      MODEL_API_BASE: https://claudeapi.cc.cd/v1
      RELEASE_MODEL: '[ct]deepseek-v4-flash-0731'
      LAB_OUT: bench-evidence/qidu-card-v0421-core
      LAB_OUT_CONFLICT: bench-evidence/qidu-card-v0418-preset-conflict
      LAB_OUT_INFO: bench-evidence/qidu-card-v0423-info-timeline
      LAB_OUT_ENCOUNTER: bench-evidence/qidu-card-v0421-encounter
      LAB_OUT_NPC_KNOWLEDGE: bench-evidence/qidu-card-v0423-npc-knowledge
      LAB_OUT_NPC_SOURCE: bench-evidence/qidu-card-v0423-offscreen-source
    steps:
      - uses: actions/checkout@v4
      - name: Adapt probes to exact candidate, live provider, and transient retry
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            '.lab/qidu-card-model-bench-v0418-core.mjs',
            '.lab/qidu-card-model-bench-v0421-encounter.mjs',
            '.lab/qidu-card-model-bench-v0418-preset-conflict.mjs',
            '.lab/qidu-card-model-bench-v0423-info-timeline.mjs',
            '.lab/qidu-card-model-bench-v0423-npc-knowledge.mjs',
            '.lab/qidu-card-model-bench-v0423-offscreen-source.mjs',
            '.lab/qidu-first-chimera-release-v0423.mjs',
          ]
          retry_prelude = r'''const __qiduNativeFetch=globalThis.fetch;
globalThis.fetch=async(...args)=>{
  let response;
  for(let attempt=0;attempt<4;attempt++){
    response=await __qiduNativeFetch(...args);
    if(![502,503].includes(response.status)) return response;
    if(attempt<3){try{await response.arrayBuffer()}catch{};await new Promise(r=>setTimeout(r,1200*(attempt+1)));}
  }
  return response;
};
'''
          for name in files:
            p=Path(name); s=p.read_text(encoding='utf-8')
            s=s.replace("process.env.YOUZI_KEY||''", "process.env.MODEL_API_KEY||''")
            s=s.replace("process.env.YOUZI_KEY || ''", "process.env.MODEL_API_KEY||''")
            s=s.replace("const API_BASE='https://youzi.today/v1';", "const API_BASE=process.env.MODEL_API_BASE;")
            s=s.replace("const API='https://youzi.today/v1/chat/completions';", "const API=`${process.env.MODEL_API_BASE}/chat/completions`;")
            s=s.replace("import { loadQiduOneFileCard, entryMap } from './qidu-card-v0423-author-secret-guard.mjs';", "import { loadQiduReleaseCandidate as loadQiduOneFileCard, entryMap } from './qidu-card-v0423-release-candidate.mjs';")
            s=s.replace("import { loadQiduOneFileCard, entryMap } from './qidu-card-v0423-release-sanitized.mjs';", "import { loadQiduReleaseCandidate as loadQiduOneFileCard, entryMap } from './qidu-card-v0423-release-candidate.mjs';")
            s=s.replace("import { loadQiduOneFileCard, entryMap } from './qidu-card-v0418-info-timeline.mjs';", "import { loadQiduReleaseCandidate as loadQiduOneFileCard, entryMap } from './qidu-card-v0423-release-candidate.mjs';")
            s=s.replace("import { loadQiduOneFileCard, entryMap } from './qidu-card-v0421-encounter-focus.mjs';", "import { loadQiduReleaseCandidate as loadQiduOneFileCard, entryMap } from './qidu-card-v0423-release-candidate.mjs';")
            s=s.replace("const contentOf=d=>String(d?.choices?.[0]?.message?.content||'');", "const contentOf=d=>{const c=d?.choices?.[0]?.message?.content;if(Array.isArray(c))return c.map(x=>typeof x==='string'?x:(x?.text||x?.content||'')).join('');return String(c||'')};")
            s=s.replace("process.env.GLM_MODEL", "process.env.RELEASE_MODEL")
            s=s.replace("const pref=['[B]qwen3.8-flash','qwen3.8-flash','step-3.5-flash',...ids.filter(x=>/(qwen|step)/i.test(x))];", "const pref=[process.env.RELEASE_MODEL,'[B]qwen3.8-flash','qwen3.8-flash','step-3.5-flash',...ids.filter(x=>/(deepseek|qwen|step|glm)/i.test(x))];")
            s=s.replace("for(const m of ['[B]qwen3.8-flash','qwen3.8-flash','step-3.5-flash'])", "for(const m of [process.env.RELEASE_MODEL,'[B]qwen3.8-flash','qwen3.8-flash','step-3.5-flash'].filter(Boolean))")
            s=s.replace('|不能说|如果|假如|要是|难道|是否|是不是|会不会)', '|不能说|不能乱说|不敢乱说|如果|假如|要是|难道|是否|是不是|会不会)')
            idx=0
            while idx < len(s) and s[idx:idx+6] == 'import':
              end=s.find('\n',idx)
              if end<0: break
              idx=end+1
            if '__qiduNativeFetch' not in s:
              s=s[:idx]+retry_prelude+s[idx:]
            p.write_text(s,encoding='utf-8')
          PY
      - name: Record behavioral gate model
        run: |
          echo "provider_base=$MODEL_API_BASE"
          echo "behavior_model=$RELEASE_MODEL"
          echo "GLM is not claimed as passed by this fallback gate"
      - id: core
        continue-on-error: true
        run: |
          for n in 1 2; do node .lab/qidu-card-model-bench-v0421-core.mjs && exit 0; echo "core retry $n"; sleep 5; done; exit 1
      - run: sleep 3
      - id: encounter
        continue-on-error: true
        run: |
          for n in 1 2; do node .lab/qidu-card-model-bench-v0421-encounter.mjs && exit 0; echo "encounter retry $n"; sleep 5; done; exit 1
      - run: sleep 3
      - id: conflict
        continue-on-error: true
        run: |
          for n in 1 2; do node .lab/qidu-card-model-bench-v0418-preset-conflict.mjs && exit 0; echo "conflict retry $n"; sleep 5; done; exit 1
      - run: sleep 3
      - id: info
        continue-on-error: true
        run: |
          for n in 1 2; do
            if node .lab/qidu-card-model-bench-v0423-info-timeline.mjs; then
              node .lab/qidu-info-report-gate-v0423.mjs && exit 0
            fi
            echo "info retry $n"; sleep 5
          done
          exit 1
      - run: sleep 3
        if: always()
      - id: npc
        if: always()
        continue-on-error: true
        run: |
          for n in 1 2; do node .lab/qidu-card-model-bench-v0423-npc-knowledge.mjs && exit 0; echo "npc retry $n"; sleep 5; done; exit 1
      - run: sleep 3
        if: always()
      - id: npcsource
        if: always()
        continue-on-error: true
        run: |
          for n in 1 2; do node .lab/qidu-card-model-bench-v0423-offscreen-source.mjs && exit 0; echo "npcsource retry $n"; sleep 5; done; exit 1
      - run: sleep 3
        if: always()
      - id: chimera
        if: always()
        continue-on-error: true
        run: |
          for n in 1 2; do node .lab/qidu-first-chimera-release-v0423.mjs && exit 0; echo "chimera retry $n"; sleep 5; done; exit 1
      - name: Enforce narrative gate
        if: always()
        run: |
          printf 'core=%s\n' '${{ steps.core.outcome }}'
          printf 'encounter=%s\n' '${{ steps.encounter.outcome }}'
          printf 'conflict=%s\n' '${{ steps.conflict.outcome }}'
          printf 'info=%s\n' '${{ steps.info.outcome }}'
          printf 'npc=%s\n' '${{ steps.npc.outcome }}'
          printf 'npcsource=%s\n' '${{ steps.npcsource.outcome }}'
          printf 'chimera=%s\n' '${{ steps.chimera.outcome }}'
          test '${{ steps.core.outcome }}' = success
          test '${{ steps.encounter.outcome }}' = success
          test '${{ steps.conflict.outcome }}' = success
          test '${{ steps.info.outcome }}' = success
          test '${{ steps.npc.outcome }}' = success
          test '${{ steps.npcsource.outcome }}' = success
          test '${{ steps.chimera.outcome }}' = success
      - name: Upload narrative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0423-final2-narrative-evidence
          path: bench-evidence/
          if-no-files-found: warn

  package:
    needs: [real-sillytavern, narrative]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact release artifact
        run: |
          set -euo pipefail
          rm -rf dist-release
          mkdir -p dist-release
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { loadQiduReleaseCandidate, assertReleasePrivacy } from './.lab/qidu-card-v0423-release-candidate.mjs';
          const {card,raw,compactSha256}=await loadQiduReleaseCandidate(process.cwd(),{skipHashCheck:true});
          assertReleasePrivacy(card);
          const expectedNotes='作者：叶罹。相关卡：《永远的7日之都》七日轮回文本互动。原作向文本互动角色卡，以七日轮回为核心，包含区域巡查、角色剧情、战术终端、状态记录与多结局分支。';
          if(card.data?.creator!=='叶罹') throw new Error('creator mismatch');
          if(card.data?.creator_notes!==expectedNotes) throw new Error('creator notes mismatch');
          if(card.creatorcomment!==expectedNotes) throw new Error('creator comment mismatch');
          if(card.data?.character_version!=='0.4.23') throw new Error('version mismatch');
          if(card.data?.character_book?.extensions?.creator!=='叶罹') throw new Error('worldbook creator mismatch');
          if(card.data?.character_book?.extensions?.version!=='0.4.23') throw new Error('worldbook version mismatch');
          if(Object.prototype.hasOwnProperty.call(card,'create_date')||Object.prototype.hasOwnProperty.call(card.data||{},'create_date')) throw new Error('creation timestamp remains');
          const txt=raw.toString('utf8');
          const forbidden=/(?:玲|h675786161|github\.com|raw\.githubusercontent\.com|api\.github\.com|实验酒馆|world-backstage|(?:\bLAB\b|[-_]lab\b|\blab[-_])|feature\/qidu-card|gmail\.com)/i;
          if(forbidden.test(txt)) throw new Error('private development provenance remains in final bytes');
          const scripts=card.data?.extensions?.regex_scripts||[];
          const rx=id=>scripts.find(x=>x?.id===id);
          const terminal=rx('f7d-terminal-v040'), stateHide=rx('f7d-state-hide-v040'), choices=rx('f7d-choices-wrap-v0414'), choice=rx('f7d-choice-button-v0414');
          if(!terminal||!stateHide||!choices||!choice) throw new Error('required embedded UI regex missing');
          if(String(stateHide.replaceString??'')!=='') throw new Error('state is not hidden');
          if(!String(terminal.replaceString||'').includes('linear-gradient')) throw new Error('terminal style missing');
          if(!String(choices.replaceString||'').includes('display:grid')) throw new Error('choice grid missing');
          if(!String(choice.replaceString||'').includes('min-height:44px')) throw new Error('choice hit target missing');
          const entries=card.data?.character_book?.entries||[];
          const by=p=>entries.find(e=>String(e.name||'').startsWith(p));
          const required=[
            [by('04｜'),'角色首次识别门禁｜隐藏执行'],
            [by('04｜'),'NPC零来源硬锁与不可见自检｜隐藏执行'],
            [by('04｜'),'禁止合规自评旁白｜隐藏执行'],
            [by('04｜'),'第一活骸事故事实边界｜隐藏执行'],
            [by('04｜'),'高校初见身份来源连续性｜隐藏执行'],
            [by('04｜'),'战术终端标签强制｜隐藏执行'],
            [by('30｜'),'高校已识别角色不得重新匿名'],
            [by('41｜'),'第一活骸事故只讲已锚定事实'],
            [by('44｜'),'高校第2巡查姓名来源顺序'],
            [by('67｜'),'泰丝拉姓名必须来自珈儿介绍'],
          ];
          for(const [e,m] of required) if(!String(e?.content||'').includes(m)) throw new Error(`missing release rule: ${m}`);
          const initialMatch=String(card.data?.first_mes||'').match(/<f7d_state>([\s\S]*?)<\/f7d_state>/i);
          if(!initialMatch) throw new Error('initial state missing');
          const initial=JSON.parse(initialMatch[1]);
          if(initial.intel_flags?.zero_identity_known!==false||initial.intel_flags?.countdown_meaning_known!==false) throw new Error('initial secret flags invalid');
          if(!initial.npc_intel||Object.keys(initial.npc_intel).length!==0) throw new Error('initial npc_intel invalid');
          const name='永远的7日之都-七日轮回文本互动-v0.4.23.json';
          await fs.writeFile(`dist-release/${name}`,raw);
          await fs.writeFile('dist-release/SHA256.txt',`${compactSha256}  ${name}\n`);
          console.log(JSON.stringify({version:card.data.character_version,creator:card.data.creator,sha256:compactSha256,bytes:raw.length,privacy:true},null,2));
          NODE
      - name: Upload final release artifact
        uses: actions/upload-artifact@v4
        with:
          name: qidu-card-v0423-final2-release
          path: dist-release/
          if-no-files-found: error
