name: Materialize Huo Nü v1.0.5

on:
  workflow_dispatch:
  push:
    branches: [bench/huonv-preset13-clean]
    paths:
      - '.github/workflows/materialize-huonv-v104.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: bench/huonv-preset13-clean
          fetch-depth: 0

      - name: Generate and validate v1.0.5
        run: |
          set -euo pipefail
          node .lab/make-huonv-v104.mjs cards/huonv/霍女_玲七_v1.0.5.json
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('cards/huonv/霍女_玲七_v1.0.5.json', 'utf8'));
          const identity = c.data.character_book.entries.find(e => e?.name === '身份边界');
          if (c.data.character_version !== '1.0.5') throw new Error('wrong version');
          if (!c.data.system_prompt.includes('异常只写角色能够观察到的结果与由此产生的猜测，不从结果反推机制')) throw new Error('observable-result system rule missing');
          if (!identity?.content?.includes('写到可观察结果即可，不解释她如何做到')) throw new Error('observable-result lore rule missing');
          if (!c.data.mes_example.includes('猜测还是猜测，别拿来替我认账。')) throw new Error('observable-result example missing');
          if (!c.data.system_prompt.includes('不把“人/非人”本身先定为答案')) throw new Error('identity closure lost');
          if (!c.data.system_prompt.includes('分支点前若原作未交代，保持未定义。')) throw new Error('canon closure lost');
          console.log('HUONV_V105_OK');
          NODE

      - name: Commit generated card
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/huonv/霍女_玲七_v1.0.5.json
          if git diff --cached --quiet; then
            echo 'v1.0.5 already materialized'
            exit 0
          fi
          git commit -m 'fix: materialize Huo Nü v1.0.5 observable anomaly pattern'
          git push origin HEAD:bench/huonv-preset13-clean
