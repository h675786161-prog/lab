name: Youzi model probe
on:
  push:
    branches: [test/wb-memory-continuity-two-cards]
    paths:
      - '.github/workflows/wb-youzi-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query models available to the existing YOUZI key
        env:
          YOUZI_KEY: ${{ secrets.YOUZI }}
        run: |
          mkdir -p bench-evidence/wb-youzi-probe
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const key = process.env.YOUZI_KEY;
          if (!key) throw new Error('Existing YOUZI secret is missing');
          const response = await fetch('https://cofi.date/v1/models', {
            headers: { Authorization: 'Bearer ' + key, Accept: 'application/json' },
            signal: AbortSignal.timeout(40_000),
          });
          const raw = await response.text();
          let data;
          try { data = JSON.parse(raw); } catch { data = {}; }
          const models = (Array.isArray(data.data) ? data.data : Array.isArray(data.models) ? data.models : [])
            .map(item => typeof item === 'string' ? item : item.id || item.name || item.model)
            .filter(Boolean);
          const result = { status: response.status, modelIds: models, count: models.length,
            errorCode: response.ok ? '' : data.error?.code || data.code || '' };
          await fs.writeFile('bench-evidence/wb-youzi-probe/models.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify({ status: result.status, count: result.count,
            models: models.filter(id => /flash|v4|gemini|glm/i.test(id)).slice(0, 40) }));
          if (!response.ok || !models.length) throw new Error('Youzi model listing failed');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb-youzi-models
          path: bench-evidence/wb-youzi-probe/
          if-no-files-found: warn
