name: Qidu HE IF v0.3 rc4 UI acceptance v2

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-rc4-ui-acceptance-v2.yml'
      - '.lab/qidu-he-v03-rc4-patch.py'

permissions:
  contents: read

jobs:
  ui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARD: fixtures/qidu-he-if/qidu-he-if.character.json
      EVIDENCE: ${{ github.workspace }}/bench-evidence/qidu-he-v03-rc4-ui-v2
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-v03-rc4-ui-v2-st
    steps:
      - uses: actions/checkout@v4
      - name: Build rc4 candidate
        run: |
          mkdir -p "$EVIDENCE"
          python .lab/qidu-he-v03-rc4-patch.py
      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          cd "$ST_DIR" && npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-v03-rc4-ui-v2.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat "$EVIDENCE/st-runtime.log"; exit 1
      - name: Real UI path
        run: |
          set -euo pipefail
          mkdir -p /tmp/qidu-rc4-ui-v2-browser && cd /tmp/qidu-rc4-ui-v2-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/qidu-rc4-ui-v2.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const {chromium}=await import('file:///tmp/qidu-rc4-ui-v2-browser/node_modules/playwright-core/index.mjs');
          const raw=await fs.readFile(process.env.CARD,'utf8');
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(2500);
          const imported=await page.evaluate(async raw=>{const f=new FormData();f.set('file_type','json');f.set('avatar',new Blob([raw],{type:'application/json'}),'qidu-he-v030-rc4.character.json');const r=await fetch('/api/characters/import',{method:'POST',body:f});return {ok:r.ok,status:r.status,text:(await r.text()).slice(0,500)};},raw);
          if(!imported.ok) throw new Error('seed import failed '+JSON.stringify(imported));
          await page.reload({waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(3500);
          const chid=await page.evaluate(async()=>{const st=await import('/script.js');await st.getCharacters();if(typeof st.printCharactersDebounced==='function')st.printCharactersDebounced();await new Promise(r=>setTimeout(r,700));return (st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');});
          if(chid<0) throw new Error('rc4 missing');

          const drawer=page.locator('#rightNavDrawerIcon');
          await drawer.waitFor({state:'visible',timeout:10000});
          await drawer.click();
          await page.locator('#right-nav-panel').waitFor({state:'visible',timeout:10000});
          await page.waitForTimeout(600);

          const charCard=page.locator(`#rm_print_characters_block .character_select[data-chid="${chid}"]`).first();
          await charCard.waitFor({state:'visible',timeout:15000});
          await charCard.click();
          await page.waitForFunction(async expected=>{const st=await import('/script.js');return String(st.this_chid)===String(expected) && !!st.getCurrentChatId?.();},chid,{timeout:15000});
          await page.waitForTimeout(900);

          const afterCharacterClick=await page.evaluate(async()=>{const st=await import('/script.js');return {thisChid:st.this_chid,currentChatId:st.getCurrentChatId?.()||null,chatLength:Array.isArray(st.chat)?st.chat.length:null};});
          const importButton=page.locator('#import_character_info');
          await importButton.waitFor({state:'visible',timeout:10000});
          await importButton.click();
          await page.waitForTimeout(500);
          const ok=page.locator('#dialogue_popup_ok');
          if(await ok.isVisible().catch(()=>false)) await ok.click();
          await page.waitForTimeout(1800);

          const final=await page.evaluate(async()=>{
            const st=await import('/script.js'); const wi=await import('/scripts/world-info.js');
            await st.getCharacters(); const chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');
            const sorted=await wi.getSortedEntries();
            const defaults={trigger:'normal',personaDescription:'',characterDescription:'',characterPersonality:'',characterDepthPrompt:'',scenario:'',creatorNotes:''};
            const probes=[['芭蕾舞蹈室','源千雪：'],['喷泉广场街头演出','米菈：'],['警局侦探案件','亚修：'],['圣星教会礼拜花房','伊萨克'],['旅行马戏团巡演篷车','悠久乐园'],['黑羽莲华','黑羽莲华']];
            const scans=[];
            for(const [text,needle] of probes){const r=await wi.getWorldInfoPrompt([text],200000,true,defaults);const joined=[r.worldInfoString,r.worldInfoBefore,r.worldInfoAfter,JSON.stringify(r.worldInfoDepth||[]),JSON.stringify(r.outletEntries||{})].join('\n');scans.push({text,needle,hit:joined.includes(needle)});}
            return {thisChid:st.this_chid,currentChatId:st.getCurrentChatId?.()||null,activeWorld:st.characters[chid]?.data?.extensions?.world||'',worldNames:[...(wi.world_names||[])],sortedCount:sorted.length,scans};
          });
          const report={stCommit:process.env.ST_COMMIT,imported,chid,afterCharacterClick,final,pageErrors};
          console.log(JSON.stringify(report,null,2));
          await fs.writeFile(`${process.env.EVIDENCE}/ui-acceptance.json`,JSON.stringify(report,null,2));
          await page.screenshot({path:`${process.env.EVIDENCE}/ui-acceptance.png`,fullPage:true});
          await browser.close();
          if(pageErrors.length||String(final.thisChid)!==String(chid)||!final.currentChatId||final.activeWorld!=='交界都市普通人HE IF世界书'||!final.worldNames.includes(final.activeWorld)||final.sortedCount<31||final.scans.some(x=>!x.hit)) throw new Error('UI acceptance failed '+JSON.stringify({pageErrors,afterCharacterClick,final}));
          NODE
          node /tmp/qidu-rc4-ui-v2.mjs
      - name: Stop ST
        if: always()
        run: if [ -f /tmp/qidu-he-v03-rc4-ui-v2.pid ]; then kill "$(cat /tmp/qidu-he-v03-rc4-ui-v2.pid)" 2>/dev/null || true; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-v03-rc4-ui-v2
          path: bench-evidence/qidu-he-v03-rc4-ui-v2/
          if-no-files-found: error
