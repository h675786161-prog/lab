name: Echo Phase 3 Full Regression V2

on:
  push:
    branches:
      - qa/echo-phase3-20261010
    paths:
      - '.github/workflows/echo-phase3-full-regression-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ST_DIR: /tmp/echo-p3-full-st
      ECHO_DIR: /tmp/echo-p3-full-echo
      QA_DIR: /tmp/echo-p3-full-qa
      LAB_ST_URL: http://127.0.0.1:8039/
      LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence/echo-phase3-full-v2
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ECHO_BRANCH: feature/echo-performance-long-chat

    steps:
      - name: Checkout lab QA branch
        uses: actions/checkout@v4

      - name: Prepare exact SillyTavern, Echo and World Backstage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LAB_EVIDENCE_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          git -C "$ST_DIR" rev-parse HEAD | tee "$LAB_EVIDENCE_DIR/sillytavern-commit.txt"
          cd "$ST_DIR" && npm ci

          git clone --depth=1 --branch "$ECHO_BRANCH" https://github.com/Lenore-111/echo-performance.git "$ECHO_DIR"
          git -C "$ECHO_DIR" rev-parse HEAD | tee "$LAB_EVIDENCE_DIR/echo-commit.txt"
          cd "$ECHO_DIR" && npm run check

          EXT_DIR="$ST_DIR/public/scripts/extensions/third-party/echo-performance"
          TARGET_DIR="$ECHO_DIR"
          export EXT_DIR TARGET_DIR ST_DIR
          bash "$ECHO_DIR/.lab/install.sh"
          test -f "$EXT_DIR/src/dom-compact.js"
          test -f "$EXT_DIR/src/native-bridge.js"

          WB_DIR="$ST_DIR/public/scripts/extensions/third-party/world-backstage"
          git clone --depth=1 https://github.com/h675786161-prog/world-backstage.git "$WB_DIR"
          git -C "$WB_DIR" rev-parse HEAD | tee "$LAB_EVIDENCE_DIR/world-backstage-commit.txt"

      - name: Prepare real Chrome and Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA_DIR" && cd "$QA_DIR"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "LAB_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "LAB_PLAYWRIGHT_CORE_ENTRY=$QA_DIR/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version | tee "$LAB_EVIDENCE_DIR/chrome-version.txt"

      - name: Start isolated real SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          cd "$ST_DIR"
          nohup node server.js --listen --port 8039 --disableCsrf > "$LAB_EVIDENCE_DIR/runtime.log" 2>&1 &
          echo $! > /tmp/echo-p3-full.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 "$LAB_ST_URL" >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/echo-p3-full.pid)" 2>/dev/null; then cat "$LAB_EVIDENCE_DIR/runtime.log"; exit 1; fi
            sleep 1
          done
          exit 1

      - name: Build real 200 500 1000 floor fixtures
        shell: bash
        env:
          ECHO_MODE: baseline
          ECHO_COUNTS: 200,500,1000
          ECHO_REPEATS: 1
          LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence/echo-phase3-full-v2/fixture
        run: |
          set -euo pipefail
          mkdir -p "$LAB_EVIDENCE_DIR"
          node "$ECHO_DIR/.lab/benchmark.mjs"

      - name: Run 200 500 1000 OFF ON metrics three repeats
        id: metrics
        continue-on-error: true
        shell: bash
        env:
          LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence/echo-phase3-full-v2/metrics
        run: |
          set +e
          mkdir -p "$LAB_EVIDENCE_DIR"
          node "$ECHO_DIR/.lab/phase3-metrics.mjs" 2>&1 | tee "$LAB_EVIDENCE_DIR/run.log"
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > "$LAB_EVIDENCE_DIR/exit-code.txt"
          exit "$STATUS"

      - name: Gate measured DOM wheel and restore invariants
        id: metrics_gate
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = process.env.LAB_EVIDENCE_DIR + '/metrics/summary.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (data.errors?.length) throw new Error('phase3-metrics page errors: ' + JSON.stringify(data.errors));
          for (const count of [200, 500, 1000]) {
            const off = data.rows.find(x => x.count === count && x.enabled === false);
            const on = data.rows.find(x => x.count === count && x.enabled === true);
            if (!off || !on) throw new Error('missing metric rows for ' + count);
            if (off.liveMes !== count) throw new Error(`OFF liveMes ${count}: ${off.liveMes}`);
            if (on.liveMes > 180 || on.liveMes < 80) throw new Error(`ON liveMes ${count}: ${on.liveMes}`);
            if (on.wheelP95Ms == null || on.wheelP95Ms >= 50) throw new Error(`wheel p95 ${count}: ${on.wheelP95Ms}`);
            if (on.driftP95Px == null || on.driftP95Px > 8) throw new Error(`drift p95 ${count}: ${on.driftP95Px}`);
            if (count === 1000 && on.detachedChunks < 16) throw new Error(`1000 detached chunks: ${on.detachedChunks}`);
          }
          console.log(JSON.stringify({ verdict: 'PASS', rows: data.rows }, null, 2));
          NODE

      - name: Re-run focused 1000-floor native bridge collect-all
        id: bridge
        continue-on-error: true
        shell: bash
        env:
          LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence/echo-phase3-full-v2/bridge
        run: |
          set +e
          mkdir -p "$LAB_EVIDENCE_DIR"
          node "$ECHO_DIR/.lab/phase3-bridge-smoke-v5.mjs" 2>&1 | tee "$LAB_EVIDENCE_DIR/run.log"
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > "$LAB_EVIDENCE_DIR/exit-code.txt"
          exit "$STATUS"

      - name: Compare exact slash-input observer errors OFF versus ON
        id: slash_observer
        continue-on-error: true
        shell: bash
        env:
          LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence/echo-phase3-full-v2/slash-observer
        run: |
          set +e
          mkdir -p "$LAB_EVIDENCE_DIR"
          node "$ECHO_DIR/.lab/phase3-slash-observer-control.mjs" 2>&1 | tee "$LAB_EVIDENCE_DIR/run.log"
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > "$LAB_EVIDENCE_DIR/exit-code.txt"
          exit "$STATUS"

      - name: Re-run generation lifecycle
        id: lifecycle
        continue-on-error: true
        shell: bash
        env:
          LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence/echo-phase3-full-v2/lifecycle
        run: |
          set +e
          mkdir -p "$LAB_EVIDENCE_DIR"
          node "$ECHO_DIR/.lab/phase3-lifecycle.mjs" 2>&1 | tee "$LAB_EVIDENCE_DIR/run.log"
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > "$LAB_EVIDENCE_DIR/exit-code.txt"
          exit "$STATUS"

      - name: Re-run World Backstage compatibility v2 on latest Echo head
        id: world
        continue-on-error: true
        shell: bash
        env:
          LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence/echo-phase3-full-v2/world
        run: |
          set +e
          mkdir -p "$LAB_EVIDENCE_DIR"
          node "$ECHO_DIR/.lab/phase3-world-v2.mjs" 2>&1 | tee "$LAB_EVIDENCE_DIR/run.log"
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > "$LAB_EVIDENCE_DIR/exit-code.txt"
          exit "$STATUS"

      - name: Gate World Backstage Echo-specific compatibility
        id: world_gate
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = process.env.LAB_EVIDENCE_DIR + '/world/summary.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const off = data.cases?.find(x => x.enabled === false);
          const on = data.cases?.find(x => x.enabled === true);
          if (!off || !on) throw new Error('missing WB OFF/ON cases');
          const required = ['workflowCompleted','automaticRequests','nativeRegenReadable','hiddenPresent','hiddenCovered','worldCoreNotAdvanced','refreshWorldCoreStable','refreshHiddenStable','refreshIndexedStable','echoRecompactAfterRefresh'];
          for (const key of required) {
            if (!on.checks?.[key]) throw new Error(`WB Echo ON failed ${key}`);
            if (!off.checks?.[key] && key !== 'echoRecompactAfterRefresh') throw new Error(`WB baseline failed ${key}`);
          }
          const baselineShared = off.checks?.semanticHistoryPreserved === on.checks?.semanticHistoryPreserved;
          if (!baselineShared) throw new Error('WB semanticHistoryPreserved differs OFF vs ON');
          if (data.pageErrors?.length) throw new Error('WB page errors: ' + JSON.stringify(data.pageErrors));
          console.log(JSON.stringify({ verdict: 'PASS_ECHO_COMPAT', baselineSemanticHistoryPreserved: off.checks?.semanticHistoryPreserved }, null, 2));
          NODE

      - name: Stop isolated runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/echo-p3-full.pid ]; then kill "$(cat /tmp/echo-p3-full.pid)" 2>/dev/null || true; fi

      - name: Upload full regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-phase3-full-regression-v2
          path: lab-evidence/echo-phase3-full-v2/
          if-no-files-found: error

      - name: Preserve full regression verdict
        if: always()
        shell: bash
        run: |
          M="$(cat "$LAB_EVIDENCE_DIR/metrics/exit-code.txt" 2>/dev/null || echo 99)"
          B="$(cat "$LAB_EVIDENCE_DIR/bridge/exit-code.txt" 2>/dev/null || echo 99)"
          S="$(cat "$LAB_EVIDENCE_DIR/slash-observer/exit-code.txt" 2>/dev/null || echo 99)"
          L="$(cat "$LAB_EVIDENCE_DIR/lifecycle/exit-code.txt" 2>/dev/null || echo 99)"
          echo "metrics_exit=$M bridge_exit=$B slash_observer_exit=$S lifecycle_exit=$L"
          test "$M" = 0
          test "$B" = 0
          test "$S" = 0
          test "$L" = 0
          test "${{ steps.metrics_gate.outcome }}" = success
          test "${{ steps.world_gate.outcome }}" = success
