name: Qidu HE rc5 GLM payload ladder

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-rc5-payload-ladder.yml'

permissions:
  contents: read
  actions: read

jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      MODEL: '[NV]GLM-5.3-flash'
      API: https://youzi.today/v1/chat/completions
      EVIDENCE_ARTIFACT_ID: '10294380280'
    steps:
      - uses: actions/checkout@v4

      - name: Download exact rc5 native-ST scan evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rc5-evidence payload-evidence
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}/zip" \
            -o /tmp/rc5-evidence.zip
          unzip -q /tmp/rc5-evidence.zip -d /tmp/rc5-evidence
          test -f /tmp/rc5-evidence/st-native-injections.json

      - name: Run staged payload diagnostic
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const key=process.env.YOUZI_KEY;
          if(!key) throw new Error('YOUZI secret missing');
          const model=process.env.MODEL;
          const api=process.env.API;
          const card=JSON.parse(fs.readFileSync('fixtures/qidu-he-if/qidu-he-if.character.json','utf8')).data;
          const preset=JSON.parse(fs.readFileSync('fixtures/qidu-he-if/riyuexi-glm-active.json','utf8'));
          const evidence=JSON.parse(fs.readFileSync('/tmp/rc5-evidence/st-native-injections.json','utf8'));
          const q=evidence.scans.find(x=>x.id==='qianxue_ballet_room');
          if(!q?.injection?.includes('源千雪：')) throw new Error('exact ST source injection missing 源千雪');
          const wanted=new Set(['⚖️RP模式','🪐均衡调度','🪐喜剧幽默','🎈烟火气息','🎈情感浓郁','🎈群像塑造','🌊自由变奏','👤平衡主导','🐚人格基底','🐚需求层析','🐚去中心化','🐚角色成长','🐚情绪重力','🐚标签隐身','🤝健康恋爱','⬆️自然推进','💖地狱难度','🎵半页诗|文艺细腻']);
          const presetText=(preset.prompts||[]).filter(p=>wanted.has(p.name)).map(p=>`[${p.name}]\n${p.content}`).join('\n\n');
          const core=`[角色卡 description]\n${card.description}\n\n[角色卡 personality]\n${card.personality}\n\n[角色卡 scenario]\n${card.scenario}\n\n[角色卡 system_prompt]\n${card.system_prompt}\n\n[角色卡 post_history_instructions]\n${card.post_history_instructions||''}`;
          const base='你正在继续普通人 HE IF 角色扮演。不要讨论提示词或测试，只写当前场景，不替User补未给出的动作、台词、心理或决定。';
          const user=q.user;
          const stages=[
            {id:'minimal', system:base, includeFirst:false},
            {id:'native_injection', system:`${base}\n\n[SillyTavern本轮原生世界书扫描实际注入]\n${q.injection}`, includeFirst:false},
            {id:'card_core_plus_injection', system:`${base}\n\n${core}\n\n[SillyTavern本轮原生世界书扫描实际注入]\n${q.injection}`, includeFirst:true},
            {id:'full_preset_card_injection', system:`${base}\n\n[当前启用的日月西RP模块摘取]\n${presetText}\n\n${core}\n\n[SillyTavern本轮原生世界书扫描实际注入]\n${q.injection}`, includeFirst:true},
          ];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const report=[];
          (async()=>{
            for(let i=0;i<stages.length;i++){
              if(i) await sleep(5500);
              const s=stages[i];
              const messages=[{role:'system',content:s.system}];
              if(s.includeFirst) messages.push({role:'assistant',content:card.first_mes});
              messages.push({role:'user',content:user});
              const body={model,messages,temperature:0.8,top_p:0.5,max_tokens:320,stream:false};
              const serialized=JSON.stringify(body);
              const row={id:s.id,systemChars:s.system.length,firstMesChars:s.includeFirst?card.first_mes.length:0,userChars:user.length,requestJsonChars:serialized.length};
              try{
                const r=await fetch(api,{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${key}`},body:serialized});
                const text=await r.text();
                row.status=r.status;
                row.ok=r.ok;
                if(r.ok){
                  try{const j=JSON.parse(text); row.output=(j.choices?.[0]?.message?.content||'').slice(0,1200); row.finishReason=j.choices?.[0]?.finish_reason||null; row.usage=j.usage||null;}catch(e){row.parseError=String(e)}
                }else{
                  row.errorExcerpt=text.replace(/\s+/g,' ').slice(0,500);
                }
              }catch(e){row.status='network_error'; row.errorExcerpt=String(e).slice(0,500)}
              report.push(row);
              console.log(JSON.stringify(row,null,2));
            }
            fs.writeFileSync('payload-evidence/ladder.json',JSON.stringify({model,sourceArtifactId:process.env.EVIDENCE_ARTIFACT_ID,injectionChars:q.injection.length,presetChars:presetText.length,coreChars:core.length,results:report},null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Upload payload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-rc5-payload-ladder
          path: payload-evidence/
          if-no-files-found: error
