name: F7D v0.4.2 Real Lab

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/f7d-v040-lab.yml'
      - '.github/workflows/real-sillytavern.yml'
      - '.lab/install.sh'
      - '.lab/runtime-smoke.mjs'
      - '.lab/f7d-live-bench.mjs'
      - '.lab/f7d-targeted-v042.mjs'
      - 'fixtures/f7d/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sillytavern:
    uses: ./.github/workflows/real-sillytavern.yml
    with:
      extension_name: f7d-card
      sillytavern_commit: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      run_project_smoke: true
      artifact_name: f7d-v042-real-sillytavern
      extra_extensions_json: '[]'

  targeted-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      F7D_MODEL: '[B]glm-5.3-flash'
      LAB_OUT: bench-evidence/f7d-v042-targeted
    steps:
      - uses: actions/checkout@v4

      - name: Build exact v0.4.2 candidate
        env:
          LAB_EVIDENCE_DIR: bench-evidence/f7d-v042-targeted
          TARGET_DIR: ${{ github.workspace }}
          ST_DIR: /tmp/f7d-behavior-no-st
        run: bash .lab/install.sh

      - name: Run focused v0.4.2 regression
        run: node .lab/f7d-targeted-v042.mjs

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f7d-v042-targeted
          path: bench-evidence/f7d-v042-targeted/
          if-no-files-found: warn
