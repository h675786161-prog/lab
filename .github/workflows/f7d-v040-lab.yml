name: F7D v0.4.1 Real Lab

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/f7d-v040-lab.yml'
      - '.github/workflows/real-sillytavern.yml'
      - '.lab/install.sh'
      - '.lab/runtime-smoke.mjs'
      - '.lab/f7d-live-bench.mjs'
      - 'fixtures/f7d/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sillytavern:
    uses: ./.github/workflows/real-sillytavern.yml
    with:
      extension_name: f7d-card
      sillytavern_commit: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      run_project_smoke: true
      artifact_name: f7d-v041-real-sillytavern
      extra_extensions_json: '[]'

  live-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      F7D_MODEL: '[B]glm-5.3-flash'
      LAB_OUT: bench-evidence/f7d-v041
    steps:
      - uses: actions/checkout@v4

      - name: Build exact v0.4.1 candidate
        env:
          LAB_EVIDENCE_DIR: bench-evidence/f7d-v041
          TARGET_DIR: ${{ github.workspace }}
          ST_DIR: /tmp/f7d-behavior-no-st
        run: bash .lab/install.sh

      - name: Stabilize behavior harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.lab/f7d-live-bench.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('100_000', '180_000')
          old='const j=await judge(test,r.content,stOut);'
          new="const j={pass:null,severity:'manual',reasons:['manual_review_required'],ooc:null,trigger_error:null,knowledge_leak:null};"
          if old not in s:
              raise SystemExit('judge call patch target missing')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Run F7D v0.4.1 OOC and trigger benchmark
        run: node .lab/f7d-live-bench.mjs

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f7d-v041-live-behavior
          path: bench-evidence/f7d-v041/
          if-no-files-found: warn
