name: F7D v0.4.5 Final Regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/f7d-v040-lab.yml'
      - '.github/workflows/real-sillytavern.yml'
      - '.lab/install.sh'
      - '.lab/runtime-smoke.mjs'
      - '.lab/f7d-targeted-v042.mjs'
      - 'fixtures/f7d/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sillytavern:
    uses: ./.github/workflows/real-sillytavern.yml
    with:
      extension_name: f7d-card
      sillytavern_commit: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      run_project_smoke: true
      artifact_name: f7d-v045-real-sillytavern
      extra_extensions_json: '[]'

  targeted-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      F7D_MODEL: 'glm-4.5-air'
      LAB_OUT: bench-evidence/f7d-v045-targeted
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact v0.4.5 candidate
        env:
          LAB_EVIDENCE_DIR: bench-evidence/f7d-v045-targeted
          TARGET_DIR: ${{ github.workspace }}
          ST_DIR: /tmp/f7d-behavior-no-st
        run: bash .lab/install.sh

      - name: Harden v0.4.5 regression harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.lab/f7d-targeted-v042.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('3db2e5951017f308903784cef7d82a96a027b83b5bf9f1643a0590466b1550bb', '4737dfc9abd5f4faf70b29d647b4e8694607fd86446c596bf737b3f41241f5f2')
          s=s.replace('bench-evidence/f7d-v042-targeted', 'bench-evidence/f7d-v045-targeted')
          s=s.replace('LingQi-F7D-v042-', 'LingQi-F7D-v045-')
          s=s.replace(
              "[测试说明] 这是角色卡实机回归测试。按角色卡本身运行，不要解释测试，不要评价规则。必须输出正文、<f7d_terminal>和完整<f7d_state>。",
              "[测试说明] 这是角色卡实机回归测试。按角色卡本身运行，不要解释测试，不要评价规则。先执行提交前结算扫描；必须把结算完成后的完整<f7d_state>作为回复第一块输出，然后写正文，最后输出<f7d_terminal>。"
          )
          s=s.replace('max_tokens=1500,thinking=true', 'max_tokens=4200,thinking=false')
          s=s.replace('max_tokens:1400,thinking:true', 'max_tokens:3600,thinking:false')
          s=s.replace('for (let attempt=1; attempt<=3; attempt++)', 'for (let attempt=1; attempt<=5; attempt++)')
          s=s.replace('if (attempt<3) await sleep(2500*attempt);', 'if (attempt<5) await sleep(2500*attempt);')
          s=s.replace(
              "battle_flags:{final_battle:null,active_corpse_final:null}, meta:{cg:[],endings:[]},",
              "battle_flags:{final_battle:null,active_corpse_final:null,sybilla_condition_obtained:false,sybilla_rescued:null}, meta:{cg:[],endings:[]},"
          )
          s=s.replace(
              "battle_flags:{final_battle:null,active_corpse_final:null,sybilla_rescue:false}}),",
              "battle_flags:{final_battle:null,active_corpse_final:null,sybilla_condition_obtained:false,sybilla_rescued:null}}),"
          )
          s=s.replace(
              "condition_true:s?.battle_flags?.sybilla_condition_obtained===true,\n      no_invented_mechanism:",
              "condition_true:s?.battle_flags?.sybilla_condition_obtained===true,\n      rescued_still_null:s?.battle_flags?.sybilla_rescued===null,\n      no_legacy_field:!Object.prototype.hasOwnProperty.call(s?.battle_flags||{},'sybilla_rescue'),\n      no_invented_mechanism:"
          )
          s=s.replace(
              "check:(o,s)=>({day3:s?.day===3,node_reset:s?.node_used===0,eligible_true:s?.ann?.eligible===true,chased_untouched:s?.ann?.chased===null,route_not_auto_ann:s?.route==='central'})",
              "check:(o,s)=>({day3:s?.day===3,node_reset:s?.node_used===0,eligible_true:s?.ann?.eligible===true,chased_untouched:s?.ann?.chased===null,route_not_auto_ann:s?.route==='central',ann_cutoff_once:Array.isArray(s?.hiro?.handled)&&s.hiro.handled.filter(x=>x==='ANN_D4_ELIGIBILITY').length===1,day3_morning_once:Array.isArray(s?.hiro?.handled)&&s.hiro.handled.filter(x=>x==='DAY3_MORNING').length===1})"
          )
          s=s.replace(
              "check:(o,s)=>({harbor_lost:s?.cores?.harbor==='lost',not_reopened:s?.cores?.harbor!=='available'&&s?.cores?.harbor!=='purified',route_central:s?.route==='central'})",
              "check:(o,s)=>({harbor_lost:s?.cores?.harbor==='lost',not_reopened:s?.cores?.harbor!=='available'&&s?.cores?.harbor!=='purified',route_central:s?.route==='central',handled_once:Array.isArray(s?.hiro?.handled)&&s.hiro.handled.filter(x=>x==='DAY4_HARBOR').length===1})"
          )
          old="const checks=t.check(r.content,stOut);\n    const pass=!!stOut&&!stOut.__parse_error&&Object.values(checks).every(Boolean);"
          new="const checks=t.check(r.content,stOut);\n    checks.state_first=r.content.trimStart().startsWith('<f7d_state>');\n    const pass=!!stOut&&!stOut.__parse_error&&Object.values(checks).every(Boolean);"
          if old not in s:
              raise SystemExit('case state-first patch target missing')
          s=s.replace(old,new)
          old2="continuity.push({turn:i+1,input:turns[i],output:r.content,state:stOut,ok:!!stOut&&!stOut.__parse_error,attempt:r.attempt});"
          new2="continuity.push({turn:i+1,input:turns[i],output:r.content,state:stOut,state_first:r.content.trimStart().startsWith('<f7d_state>'),ok:!!stOut&&!stOut.__parse_error&&r.content.trimStart().startsWith('<f7d_state>'),attempt:r.attempt,finish_reason:r.finish_reason});"
          if old2 not in s:
              raise SystemExit('continuity state-first patch target missing')
          s=s.replace(old2,new2)
          s=s.replace(
              "school_patrol:lastState?.regions?.school?.patrol??null,\n};",
              "school_patrol:lastState?.regions?.school?.patrol??null,\n  sybilla_condition:lastState?.battle_flags?.sybilla_condition_obtained??null,\n  sybilla_rescued:lastState?.battle_flags?.sybilla_rescued??'missing',\n  sybilla_legacy_present:Object.prototype.hasOwnProperty.call(lastState?.battle_flags||{},'sybilla_rescue'),\n};"
          )
          s=s.replace(
              "continuityChecks.ann_events.includes('ANN_PHOTO') &&\n  continuityChecks.romance!==true;",
              "continuityChecks.ann_events.includes('ANN_PHOTO') &&\n  continuityChecks.romance!==true &&\n  continuityChecks.sybilla_condition===false &&\n  continuityChecks.sybilla_rescued===null &&\n  continuityChecks.sybilla_legacy_present===false;"
          )
          p.write_text(s,encoding='utf-8')
          PY

      - name: Run final v0.4.5 regression
        run: node .lab/f7d-targeted-v042.mjs

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f7d-v045-targeted
          path: bench-evidence/f7d-v045-targeted/
          if-no-files-found: warn
