name: Echo Phase 3 Real SillyTavern Gate

on:
  push:
    branches:
      - qa/echo-phase3-20261010
    paths:
      - '.github/workflows/echo-phase3-real-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3-real-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ST_DIR: /tmp/echo-phase3-sillytavern
      ECHO_DIR: /tmp/echo-performance
      QA_DIR: /tmp/qa-tools
      LAB_ST_URL: http://127.0.0.1:8039/
      LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence/echo-phase3
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ECHO_BRANCH: feature/echo-performance-long-chat

    steps:
      - name: Checkout lab QA branch
        uses: actions/checkout@v4

      - name: Clone exact SillyTavern 1.18.0 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LAB_EVIDENCE_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          ACTUAL="$(git -C "$ST_DIR" rev-parse HEAD)"
          test "$ACTUAL" = "$ST_COMMIT"
          printf '%s\n' "$ACTUAL" > "$LAB_EVIDENCE_DIR/sillytavern-commit.txt"

      - name: Install SillyTavern dependencies
        working-directory: /tmp/echo-phase3-sillytavern
        run: npm ci

      - name: Clone Echo Phase 3 feature branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$ECHO_BRANCH" https://github.com/Lenore-111/echo-performance.git "$ECHO_DIR"
          git -C "$ECHO_DIR" rev-parse HEAD | tee "$LAB_EVIDENCE_DIR/echo-commit.txt"
          cd "$ECHO_DIR"
          npm run check
          EXT_DIR="$ST_DIR/public/scripts/extensions/third-party/echo-performance" TARGET_DIR="$ECHO_DIR" ST_DIR="$ST_DIR" bash .lab/install.sh
          test -f "$EXT_DIR/src/dom-compact.js"

      - name: Prepare real Chrome and Playwright Core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA_DIR"
          cd "$QA_DIR"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "LAB_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "LAB_PLAYWRIGHT_CORE_ENTRY=$QA_DIR/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version | tee "$LAB_EVIDENCE_DIR/chrome-version.txt"

      - name: Start isolated SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          cd "$ST_DIR"
          nohup node server.js --listen --port 8039 --disableCsrf > "$LAB_EVIDENCE_DIR/sillytavern-runtime.log" 2>&1 &
          echo $! > /tmp/echo-phase3-st.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 "$LAB_ST_URL" >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/echo-phase3-st.pid)" 2>/dev/null; then
              cat "$LAB_EVIDENCE_DIR/sillytavern-runtime.log"
              exit 1
            fi
            sleep 1
          done
          echo 'Timed out waiting for SillyTavern.'
          exit 1

      - name: Create real 200 500 1000 chat fixtures with Echo OFF
        shell: bash
        env:
          ECHO_MODE: baseline
          ECHO_COUNTS: 200,500,1000
          ECHO_REPEATS: 1
          LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence/echo-phase3/fixture-setup
        run: |
          set -euo pipefail
          mkdir -p "$LAB_EVIDENCE_DIR"
          node "$ECHO_DIR/.lab/benchmark.mjs"

      - name: Install World Backstage compatibility target
        shell: bash
        run: |
          set -euo pipefail
          WB_DIR="$ST_DIR/public/scripts/extensions/third-party/world-backstage"
          rm -rf "$WB_DIR"
          git clone --depth=1 https://github.com/h675786161-prog/world-backstage.git "$WB_DIR"
          git -C "$WB_DIR" rev-parse HEAD | tee "$LAB_EVIDENCE_DIR/world-backstage-commit.txt"
          test -f "$WB_DIR/manifest.json"
          kill "$(cat /tmp/echo-phase3-st.pid)" 2>/dev/null || true
          sleep 1
          cd "$ST_DIR"
          nohup node server.js --listen --port 8039 --disableCsrf >> "$LAB_EVIDENCE_DIR/sillytavern-runtime.log" 2>&1 &
          echo $! > /tmp/echo-phase3-st.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 "$LAB_ST_URL" >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Run Phase 3 real-browser hard gate
        shell: bash
        run: |
          set +e
          node "$ECHO_DIR/.lab/dom-compact-smoke.mjs" 2>&1 | tee "$LAB_EVIDENCE_DIR/phase3-gate.log"
          STATUS=${PIPESTATUS[0]}
          echo "$STATUS" > "$LAB_EVIDENCE_DIR/phase3-gate-exit-code.txt"
          exit "$STATUS"

      - name: Stop isolated runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/echo-phase3-st.pid ]; then kill "$(cat /tmp/echo-phase3-st.pid)" 2>/dev/null || true; fi

      - name: Upload Phase 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-phase3-real-gate
          path: lab-evidence/echo-phase3/
          if-no-files-found: error
