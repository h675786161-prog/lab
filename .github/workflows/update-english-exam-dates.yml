name: Update English Exam Dates

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Fetch Cambridge exam dates
        run: |
          python -m pip install --quiet beautifulsoup4
          python <<'PY'
          import json, re, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from bs4 import BeautifulSoup

          URL = "https://www.cambridgeenglish.org/exams-and-tests/qualifications/exam-dates/"
          req = urllib.request.Request(URL, headers={"User-Agent":"Mozilla/5.0 LazyEnglishExamDateBot/1.0"})
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "ignore")
          soup = BeautifulSoup(html, "html.parser")

          targets = {
              "B1": "B1 Preliminary",
              "B2": "B2 First",
              "C1": "C1 Advanced",
              "C2": "C2 Proficiency",
          }
          month = {m:i for i,m in enumerate(
              ["January","February","March","April","May","June","July","August","September","October","November","December"],1)}
          found = {}

          for key, title in targets.items():
              heading = None
              for h in soup.find_all(["h2","h3","h4"]):
                  if h.get_text(" ", strip=True) == title:
                      heading = h
                      break
              if not heading:
                  raise RuntimeError(f"Could not find heading for {title}")

              dates = []
              node = heading.find_next()
              while node:
                  if node.name in ["h2","h3","h4"] and node is not heading:
                      break
                  text = node.get_text(" ", strip=True) if getattr(node, "get_text", None) else ""
                  m = re.fullmatch(r"(\d{1,2}) (January|February|March|April|May|June|July|August|September|October|November|December) (20\d{2}) \([A-Za-z]{3}\)", text)
                  if m:
                      d, mon, y = m.groups()
                      iso = f"{y}-{month[mon]:02d}-{int(d):02d}"
                      if iso not in dates:
                          dates.append(iso)
                  node = node.find_next()
              if not dates:
                  raise RuntimeError(f"No dates parsed for {title}")
              found[key] = {"name": title, "dates": sorted(dates)}

          path = Path("english/exam-dates.json")
          old = json.loads(path.read_text("utf-8")) if path.exists() else {}
          old_exams = old.get("exams", {})
          if old_exams == found:
              print("No exam date changes.")
          else:
              data = {
                  "updatedAt": datetime.now(timezone.utc).date().isoformat(),
                  "source": URL,
                  "note": "Paper-based dates are set by Cambridge English. Digital exams are available throughout the year through local exam centres. Registration deadlines and speaking dates must be confirmed with the chosen local centre.",
                  "exams": found
              }
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", "utf-8")
              print("Exam dates updated.")
          PY

      - name: Commit changed dates
        run: |
          if git diff --quiet -- english/exam-dates.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english/exam-dates.json
          git commit -m "chore: refresh Cambridge exam dates"
          git push origin HEAD:gh-pages
