name: Qidu v0424 Targeted Output Shell

on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-shell-v0424-target-trigger.txt'

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_API_KEY: ${{ secrets.GG }}
      MODEL_API_BASE: https://gcli.ggchan.dev/v1
      RELEASE_MODEL: 'gemini-3-flash-preview'
      LAB_OUT_SHELL: bench-evidence/qidu-card-v0424-output-shell
    steps:
      - uses: actions/checkout@v4
      - name: Run output shell regression
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0424-output-shell.mjs && exit 0
            echo "shell retry $n"
            sleep 15
          done
          exit 1
      - name: Upload shell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-output-shell-target
          path: bench-evidence/qidu-card-v0424-output-shell/
          if-no-files-found: warn
