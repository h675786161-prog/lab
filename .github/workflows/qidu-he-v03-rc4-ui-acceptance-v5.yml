name: Qidu HE IF v0.3 rc4 UI acceptance v6

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-rc4-ui-acceptance-v5.yml'
      - '.lab/qidu-he-v03-rc4-patch.py'

permissions:
  contents: read

jobs:
  ui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARD: fixtures/qidu-he-if/qidu-he-if.character.json
      EVIDENCE: ${{ github.workspace }}/bench-evidence/qidu-he-v03-rc4-ui-v6
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-v03-rc4-ui-v6-st
    steps:
      - uses: actions/checkout@v4
      - name: Build rc4 candidate
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python .lab/qidu-he-v03-rc4-patch.py
      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          cd "$ST_DIR" && npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-v03-rc4-ui-v6.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat "$EVIDENCE/st-runtime.log"; exit 1
      - name: Real UI path and keyboard lorebook confirmation
        run: |
          set -euo pipefail
          mkdir -p /tmp/qidu-rc4-ui-v6-browser && cd /tmp/qidu-rc4-ui-v6-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/qidu-rc4-ui-v6.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const {chromium}=await import('file:///tmp/qidu-rc4-ui-v6-browser/node_modules/playwright-core/index.mjs');
          const raw=await fs.readFile(process.env.CARD,'utf8');
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          const evidence={stCommit:process.env.ST_COMMIT,pageErrors,startupDialogs:[]};
          const persist=async(name='ui-progress.json')=>fs.writeFile(`${process.env.EVIDENCE}/${name}`,JSON.stringify(evidence,null,2));

          await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2500);
          evidence.imported=await page.evaluate(async raw=>{
            const f=new FormData();
            f.set('file_type','json');
            f.set('avatar',new Blob([raw],{type:'application/json'}),'qidu-he-v030-rc4.character.json');
            const r=await fetch('/api/characters/import',{method:'POST',body:f});
            return {ok:r.ok,status:r.status,text:(await r.text()).slice(0,500)};
          },raw);
          if(!evidence.imported.ok) throw new Error('seed import failed '+JSON.stringify(evidence.imported));

          await page.reload({waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(3500);

          for(let guard=0; guard<4; guard++){
            const dialog=page.locator('dialog[open]').first();
            if(!(await dialog.count()) || !(await dialog.isVisible().catch(()=>false))) break;
            const snapshot=await dialog.evaluate(el=>({
              text:(el.innerText||el.textContent||'').trim().slice(0,4000),
              buttons:[...el.querySelectorAll('[role="button"],button,input[type="button"],input[type="submit"],.menu_button')].map(b=>({id:b.id||'',text:(b.innerText||b.value||b.textContent||'').trim(),result:b.getAttribute('data-result')})).filter(x=>x.id||x.text)
            }));
            evidence.startupDialogs.push(snapshot);
            await persist();
            const cancel=dialog.getByRole('button',{name:/^(cancel|取消)$/i}).first();
            if(await cancel.isVisible().catch(()=>false)) await cancel.click();
            else {
              const ok=dialog.locator('#dialogue_popup_ok');
              if(await ok.isVisible().catch(()=>false)) await ok.click();
              else {
                const buttons=dialog.locator('[role="button"]:visible,button:visible,input[type="button"]:visible,input[type="submit"]:visible,.menu_button:visible');
                const n=await buttons.count(); if(!n) throw new Error('blocking startup dialog has no button '+JSON.stringify(snapshot));
                await buttons.nth(n-1).click();
              }
            }
            await page.waitForTimeout(900);
          }

          evidence.chid=await page.evaluate(async()=>{
            const st=await import('/script.js');
            await st.getCharacters();
            if(typeof st.printCharactersDebounced==='function') st.printCharactersDebounced();
            await new Promise(r=>setTimeout(r,700));
            return (st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');
          });
          if(evidence.chid<0) throw new Error('rc4 missing');

          const drawer=page.locator('#rightNavDrawerIcon');
          await drawer.waitFor({state:'visible',timeout:10000});
          await drawer.click();
          await page.locator('#right-nav-panel').waitFor({state:'visible',timeout:10000});
          await page.waitForTimeout(600);

          const charCard=page.locator(`#rm_print_characters_block .character_select[data-chid="${evidence.chid}"]`).first();
          await charCard.waitFor({state:'visible',timeout:15000});
          await charCard.click();
          await page.waitForFunction(async expected=>{
            const st=await import('/script.js');
            return String(st.this_chid)===String(expected) && !!st.getCurrentChatId?.();
          },evidence.chid,{timeout:15000});
          await page.waitForTimeout(900);

          evidence.afterCharacterClick=await page.evaluate(async()=>{
            const st=await import('/script.js'); const wi=await import('/scripts/world-info.js');
            await st.getCharacters();
            const chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');
            const sorted=await wi.getSortedEntries();
            const select=document.querySelector('#char-management-dropdown');
            const opt=document.querySelector('#import_character_info');
            return {thisChid:st.this_chid,currentChatId:st.getCurrentChatId?.()||null,chatLength:Array.isArray(st.chat)?st.chat.length:null,activeWorld:st.characters[chid]?.data?.extensions?.world||'',worldNames:[...(wi.world_names||[])],sortedCount:sorted.length,managementVisible:select?getComputedStyle(select).display!=='none':false,importOptionPresent:!!opt,importOptionDisplay:opt?getComputedStyle(opt).display:null,importOptionLabel:opt?.textContent?.trim()||''};
          });
          await persist();

          evidence.manualLorebookImport=false;
          if(evidence.afterCharacterClick.sortedCount<31 || !evidence.afterCharacterClick.worldNames.includes(evidence.afterCharacterClick.activeWorld)){
            const management=page.locator('#char-management-dropdown');
            await management.waitFor({state:'visible',timeout:10000});
            const options=await management.locator('option').evaluateAll(opts=>opts.map(o=>({id:o.id||'',label:(o.textContent||'').trim(),display:getComputedStyle(o).display,value:o.value})));
            evidence.managementOptions=options;
            const target=options.find(o=>o.id==='import_character_info');
            if(!target) throw new Error('Import Card Lore option missing '+JSON.stringify(options));
            await management.selectOption({label:target.label});
            evidence.manualLorebookImport=true;
            await page.waitForTimeout(700);

            const dialog=page.locator('dialog[open]').first();
            if(!(await dialog.isVisible().catch(()=>false))) throw new Error('expected lorebook import confirmation dialog');
            evidence.loreImportDialog=await dialog.evaluate(el=>({text:(el.innerText||el.textContent||'').trim().slice(0,4000),buttons:[...el.querySelectorAll('[role="button"],button,input[type="button"],input[type="submit"],.menu_button')].map(b=>({id:b.id||'',text:(b.innerText||b.value||b.textContent||'').trim(),result:b.getAttribute('data-result'),autofocus:b.hasAttribute('autofocus')})).filter(x=>x.id||x.text)}));

            // The affirmative control is autofocus in ST. Follow a real keyboard path: Tab until Yes owns focus, then Enter.
            const focusTrace=[];
            for(let i=0;i<8;i++){
              const active=await page.evaluate(()=>({tag:document.activeElement?.tagName||'',text:(document.activeElement?.innerText||document.activeElement?.textContent||'').trim(),result:document.activeElement?.getAttribute?.('data-result')||null}));
              focusTrace.push(active);
              if(active.result==='1') break;
              await page.keyboard.press('Tab');
              await page.waitForTimeout(80);
            }
            evidence.loreImportFocusTrace=focusTrace;
            await persist();
            const focusedYes=await page.evaluate(()=>document.activeElement?.getAttribute?.('data-result')==='1');
            if(!focusedYes) throw new Error('could not focus affirmative lorebook button '+JSON.stringify(focusTrace));
            await page.keyboard.press('Enter');

            await dialog.waitFor({state:'hidden',timeout:10000});
            await page.waitForFunction(async world=>{const wi=await import('/scripts/world-info.js');return (wi.world_names||[]).includes(world);},evidence.afterCharacterClick.activeWorld,{timeout:15000});
            await page.waitForTimeout(1200);
          }

          evidence.final=await page.evaluate(async()=>{
            const st=await import('/script.js'); const wi=await import('/scripts/world-info.js');
            await st.getCharacters();
            const chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');
            const sorted=await wi.getSortedEntries();
            const defaults={trigger:'normal',personaDescription:'',characterDescription:'',characterPersonality:'',characterDepthPrompt:'',scenario:'',creatorNotes:''};
            const probes=[['芭蕾舞蹈室','源千雪：'],['喷泉广场街头演出','米菈：'],['警局侦探案件','亚修：'],['圣星教会礼拜花房','伊萨克'],['旅行马戏团巡演篷车','悠久乐园'],['黑羽莲华','黑羽莲华']];
            const scans=[];
            for(const [text,needle] of probes){
              const r=await wi.getWorldInfoPrompt([text],200000,true,defaults);
              const joined=[r.worldInfoString,r.worldInfoBefore,r.worldInfoAfter,JSON.stringify(r.worldInfoDepth||[]),JSON.stringify(r.outletEntries||{})].join('\n');
              scans.push({text,needle,hit:joined.includes(needle)});
            }
            return {thisChid:st.this_chid,currentChatId:st.getCurrentChatId?.()||null,activeWorld:st.characters[chid]?.data?.extensions?.world||'',worldNames:[...(wi.world_names||[])],sortedCount:sorted.length,sortedWorlds:[...new Set(sorted.map(e=>e.world))],scans};
          });

          console.log(JSON.stringify(evidence,null,2));
          await persist('ui-acceptance.json');
          await page.screenshot({path:`${process.env.EVIDENCE}/ui-acceptance.png`,fullPage:true});
          await browser.close();
          const final=evidence.final;
          if(pageErrors.length||String(final.thisChid)!==String(evidence.chid)||!final.currentChatId||final.activeWorld!=='交界都市普通人HE IF世界书'||!final.worldNames.includes(final.activeWorld)||final.sortedCount<31||final.scans.some(x=>!x.hit)) throw new Error('UI acceptance failed '+JSON.stringify(evidence));
          NODE
          node /tmp/qidu-rc4-ui-v6.mjs
      - name: Stop ST
        if: always()
        run: if [ -f /tmp/qidu-he-v03-rc4-ui-v6.pid ]; then kill "$(cat /tmp/qidu-he-v03-rc4-ui-v6.pid)" 2>/dev/null || true; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-v03-rc4-ui-v6
          path: bench-evidence/qidu-he-v03-rc4-ui-v6/
          if-no-files-found: error
