name: Qidu v0424 Targeted Narrative

on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-narrative-v0424-target-trigger.txt'

permissions:
  contents: read

concurrency:
  group: qidu-v0424-targeted-narrative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrative-target:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        kind: [core, encounter, conflict, info, npc, npcsource, chimera]
    env:
      MODEL_API_KEY: ${{ secrets.GG }}
      MODEL_API_BASE: https://gcli.ggchan.dev/v1
      RELEASE_MODEL: 'gemini-3-flash-preview'
      QIDU_MODEL_GAP_MS: '20000'
      LAB_OUT: bench-evidence/qidu-card-v0421-core
      LAB_OUT_ENCOUNTER: bench-evidence/qidu-card-v0421-encounter
    steps:
      - uses: actions/checkout@v4
      - name: Adapt target probes to exact v0.4.24 candidate
        run: python .lab/qidu-final-adapt-probes-v0424.py
      - name: Select live behavioral model
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          base=os.environ['MODEL_API_BASE'].rstrip('/')
          key=os.environ['MODEL_API_KEY']
          candidates=['gemini-3-flash-preview','gemini-3.1-pro-preview-nothinking']
          chosen=None
          rows=[]
          for model in candidates:
            payload={'model':model,'max_tokens':32,'temperature':0,'messages':[{'role':'user','content':'只回答：测试通过'}]}
            req=urllib.request.Request(base+'/chat/completions',data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(req,timeout=25) as r:
                raw=r.read(200000).decode('utf-8','replace'); status=r.status
              data=json.loads(raw)
              content=data.get('choices',[{}])[0].get('message',{}).get('content','')
              if isinstance(content,list):
                content=''.join(str(x.get('text') or x.get('content') or '') if isinstance(x,dict) else str(x) for x in content)
              usable=status==200 and bool(str(content or '').strip())
              rows.append({'model':model,'status':status,'usable':usable})
              if usable:
                chosen=model
                break
            except urllib.error.HTTPError as e:
              body=e.read(800).decode('utf-8','replace')
              rows.append({'model':model,'status':e.code,'usable':False,'error':body[:500]})
            except Exception as e:
              rows.append({'model':model,'status':'error','usable':False,'error':type(e).__name__+': '+str(e)[:300]})
          print(json.dumps({'behavior_model_probe':rows,'chosen':chosen},ensure_ascii=False))
          if not chosen:
            raise SystemExit('no live behavioral model available')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
            f.write('RELEASE_MODEL='+chosen+'\n')
            f.write('BEHAVIOR_MODEL_SELECTED='+chosen+'\n')
          PY
          # Selector itself consumes one provider request. Cool down before the real regression calls.
          sleep 25
      - name: Run targeted narrative probe
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2 3; do
            ok=0
            case "${{ matrix.kind }}" in
              core)
                node .lab/qidu-card-model-bench-v0421-core.mjs && ok=1
                ;;
              encounter)
                node .lab/qidu-card-model-bench-v0421-encounter.mjs && ok=1
                ;;
              conflict)
                node .lab/qidu-card-model-bench-v0418-preset-conflict.mjs && ok=1
                ;;
              info)
                if node .lab/qidu-card-model-bench-v0423-info-timeline.mjs && node .lab/qidu-info-report-gate-v0423.mjs; then ok=1; fi
                ;;
              npc)
                node .lab/qidu-card-model-bench-v0423-npc-knowledge.mjs && ok=1
                ;;
              npcsource)
                node .lab/qidu-card-model-bench-v0423-offscreen-source.mjs && ok=1
                ;;
              chimera)
                node .lab/qidu-first-chimera-release-v0423.mjs && ok=1
                ;;
            esac
            if [ "$ok" = 1 ]; then exit 0; fi
            echo "${{ matrix.kind }} provider/behavior retry $n"
            sleep 15
          done
          exit 1
      - name: Upload targeted narrative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-narrative-target-${{ matrix.kind }}
          path: bench-evidence/
          if-no-files-found: warn
