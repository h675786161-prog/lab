name: LingQi Model Bundle Human Prose
on:
  push:
    branches: ['bench/preset-13']
    paths:
      - '.github/workflows/model-bundle-human.yml'
      - '.lab/model-bundle-human-v1.mjs'
      - '.lab/glm-53-thinking-probe.mjs'
      - 'fixtures/nsfw/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ST_DIR: /tmp/lingqi-sillytavern
      LAB_ST_URL: http://127.0.0.1:8000
      LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      FOCUS_CARD_SHA: a75f0ddef4d90f37dfc4841aad88f5f134cdfb08b9734c5f23db4219ecc7cd7e
    steps:
      - uses: actions/checkout@v4
      - name: Verify benchmark fixtures before starting lab
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum fixtures/nsfw/shaoxiang-focus-card.json | awk '{print $1}')" = "$FOCUS_CARD_SHA"
          cat fixtures/nsfw/glm-pack.part*.b64 | base64 -d | gzip -t
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import zlib from 'node:zlib';
          const card=JSON.parse(fs.readFileSync('fixtures/nsfw/shaoxiang-focus-card.json','utf8'));
          const names=card?.data?.character_book?.entries?.map(x=>x.comment) || [];
          for (const k of ['哨向结合','唐启明','唐启明NSFW','李业','李业NSFW']) if(!names.includes(k)) throw new Error('missing card entry '+k);
          const ns=fs.readdirSync('fixtures/nsfw').filter(n=>/^glm-pack\.part\d+\.b64$/.test(n)).sort();
          const b=ns.map(n=>fs.readFileSync('fixtures/nsfw/'+n,'utf8').trim()).join('');
          const p=JSON.parse(zlib.gunzipSync(Buffer.from(b,'base64')).toString('utf8'));
          for (const k of ['❎丨角色反应可信','🤔丨生动化']) if(!p.candidates?.[k]) throw new Error('missing candidate '+k);
          if(!p.adapters?.['✴️丨GLM模型适配']) throw new Error('missing GLM adapter');
          console.log('fixtures ok', {card_entries:names,pack_parts:ns.length,sequence:p.sequence?.length,candidates:Object.keys(p.candidates||{})});
          NODE
      - name: Prepare isolated real SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR" "$LAB_EVIDENCE_DIR"; mkdir -p "$LAB_EVIDENCE_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          printf 'repository=%s\nsha=%s\nsillytavern_commit=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$ST_COMMIT" > "$LAB_EVIDENCE_DIR/run-context.txt"
          cd "$ST_DIR"; npm ci
      - name: Start isolated SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          cd "$ST_DIR"; nohup node server.js --listen --port 8000 --disableCsrf > "$LAB_EVIDENCE_DIR/sillytavern-runtime.log" 2>&1 & echo $! > /tmp/lingqi-sillytavern.pid
          for i in $(seq 1 90); do curl -fsS --max-time 2 "$LAB_ST_URL/" >/dev/null 2>&1 && exit 0; kill -0 "$(cat /tmp/lingqi-sillytavern.pid)" 2>/dev/null || { cat "$LAB_EVIDENCE_DIR/sillytavern-runtime.log"; exit 1; }; sleep 1; done; exit 1
      - name: Capture browser evidence
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          [ -z "$CHROME_BIN" ] || "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,1000 --screenshot="$LAB_EVIDENCE_DIR/sillytavern-home.png" "$LAB_ST_URL/" >/tmp/chrome.log 2>&1 || true
          curl -fsS "$LAB_ST_URL/" -o "$LAB_EVIDENCE_DIR/sillytavern-home.html"
      - name: Probe GLM 5.3 thinking mode through SillyTavern
        env:
          YOUZI: ${{ secrets.YOUZI }}
        run: |
          set -euo pipefail
          node --check .lab/glm-53-thinking-probe.mjs
          node .lab/glm-53-thinking-probe.mjs
      - name: Run GLM bundle prose benchmark through SillyTavern
        env:
          YOUZI: ${{ secrets.YOUZI }}
        run: |
          set -euo pipefail
          sleep 5
          python - <<'PY'
          from pathlib import Path
          p=Path('.lab/model-bundle-human-v1.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("delay:1800", "delay:4500")
          s=s.replace("custom_include_body:'thinking:\\n  type: disabled'", "custom_include_body:'thinking:\\n  type: enabled\\nreasoning_effort: low'")
          s=s.replace("max_tokens:2600", "max_tokens:5000")
          s=s.replace("thinking:'disabled via ST custom_include_body'", "thinking:'enabled + reasoning_effort low via ST custom_include_body'")
          p.write_text(s,encoding='utf-8')
          PY
          node --check .lab/model-bundle-human-v1.mjs
          node .lab/model-bundle-human-v1.mjs
      - name: Runtime tail
        if: always()
        run: tail -n 500 "$LAB_EVIDENCE_DIR/sillytavern-runtime.log" > "$LAB_EVIDENCE_DIR/sillytavern-runtime-tail.log" 2>/dev/null || true
      - name: Stop
        if: always()
        run: '[ ! -f /tmp/lingqi-sillytavern.pid ] || kill "$(cat /tmp/lingqi-sillytavern.pid)" 2>/dev/null || true'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingqi-model-bundle-human
          path: lab-evidence/
          if-no-files-found: error
