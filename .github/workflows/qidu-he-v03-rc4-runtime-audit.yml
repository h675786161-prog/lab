name: Qidu HE IF v0.3 rc4 runtime audit

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-rc4-runtime-audit.yml'
      - '.lab/qidu-he-v03-coverage-patch.py'
      - '.lab/qidu-he-v03-rc2-patch.py'
      - '.lab/qidu-he-v03-rc3-patch.py'
      - '.lab/qidu-he-v03-rc4-patch.py'
      - 'fixtures/qidu-he-if/coverage-manifest.v03.rc2.json'
      - 'fixtures/qidu-he-if/qidu-he-if.character.json'

permissions:
  contents: read

jobs:
  rc4-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARD: fixtures/qidu-he-if/qidu-he-if.character.json
      EVIDENCE: ${{ github.workspace }}/bench-evidence/qidu-he-v03-rc4-runtime
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-v03-rc4-st
    steps:
      - uses: actions/checkout@v4

      - name: Build rc4 candidate and assert binding names
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python .lab/qidu-he-v03-rc4-patch.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ['CARD']).read_text(encoding='utf-8'))['data']
          assert d['character_version']=='0.3.0-rc4'
          assert d['extensions']['world']==d['character_book']['name']
          assert len(d['character_book']['entries'])==31
          assert 'SillyTavern首次导入要求' in d['creator_notes']
          print({'version':d['character_version'],'world':d['extensions']['world'],'book':d['character_book']['name'],'entries':len(d['character_book']['entries'])})
          PY
          cp "$CARD" "$EVIDENCE/qidu-he-if-v0.3.0-rc4.character.json"

      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          cd "$ST_DIR"
          npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-v03-rc4.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$EVIDENCE/st-runtime.log"
          exit 1

      - name: Browser import, native lorebook import, and native WI scan
        run: |
          set -euo pipefail
          mkdir -p /tmp/qidu-rc4-browser && cd /tmp/qidu-rc4-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/qidu-rc4-runtime.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const { chromium } = await import('file:///tmp/qidu-rc4-browser/node_modules/playwright-core/index.mjs');
          const raw = await fs.readFile(process.env.CARD,'utf8');
          const browser = await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2500);

          const imported=await page.evaluate(async raw=>{
            const f=new FormData();
            f.set('file_type','json');
            f.set('avatar',new Blob([raw],{type:'application/json'}),'qidu-he-v030-rc4.character.json');
            const r=await fetch('/api/characters/import',{method:'POST',body:f});
            return {ok:r.ok,status:r.status,text:(await r.text()).slice(0,1000)};
          },raw);
          if(!imported.ok) throw new Error('character import failed '+JSON.stringify(imported));

          const scan=await page.evaluate(async()=>{
            const st=await import('/script.js');
            const wi=await import('/scripts/world-info.js');
            let chid=-1;
            for(let i=0;i<20;i++){
              await st.getCharacters();
              chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');
              if(chid>=0) break;
              await new Promise(r=>setTimeout(r,500));
            }
            if(chid<0) throw new Error('rc4 character not found after getCharacters');
            await Promise.resolve(st.select_selected_character(chid,{switchMenu:false}));
            await new Promise(r=>setTimeout(r,1200));
            wi.checkEmbeddedWorld(chid);
            const charsBefore=st.characters||[];
            const expectedBook=charsBefore[chid]?.data?.character_book?.name||'';
            const expectedWorld=charsBefore[chid]?.data?.extensions?.world||'';
            const importControlVisible=!!document.querySelector('#import_character_info') && getComputedStyle(document.querySelector('#import_character_info')).display!=='none';
            await wi.importEmbeddedWorldInfo(true);
            await new Promise(r=>setTimeout(r,1600));
            await st.getCharacters();
            chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');
            if(chid<0) throw new Error('rc4 disappeared after lorebook import');
            await Promise.resolve(st.select_selected_character(chid,{switchMenu:false}));
            await new Promise(r=>setTimeout(r,1200));
            const activeWorld=st.characters[chid]?.data?.extensions?.world||'';
            const worldNames=[...(wi.world_names||[])];
            const cases=[
              {id:'source_implicit',text:'下午我第一次去学园区的芭蕾舞蹈室附近看看，不认识任何人。',must:['源千雪：']},
              {id:'mika_implicit',text:'傍晚我去中央城区喷泉广场听街头音乐，不认识当地乐手。',must:['米菈：']},
              {id:'ash_implicit',text:'我遇到一起普通失物案，去警局问有没有擅长推理的人能帮忙。',must:['亚修：']},
              {id:'church_group',text:'周末我第一次走进圣星教会参加礼拜，之后想去花房看看。',must:['伊萨克','格雷穆','赛斯']},
              {id:'circus_group',text:'本地新闻说旅行马戏团进城，我顺着海报去巡演篷车附近看看。',must:['悠久乐园','尤梨','星灼']},
              {id:'rare_direct',text:'我想打听黑羽莲华最近有没有公开活动。',must:['黑羽莲华']},
              {id:'new_people_pool',text:'今天不找熟人，我想通过本地活动认识几个新面孔。',must:['扩展原作角色发现池']},
              {id:'district_school',text:'下午我去学园区随便走走，看看今天附近有什么普通活动。',must:['源千雪','亚修']},
              {id:'district_center',text:'晚上我一个人去中央城区闲逛，不找任何熟人，看看街上有什么。',must:['米菈','妮维','丽']}
            ];
            const defaults={trigger:'normal',personaDescription:'',characterDescription:'',characterPersonality:'',characterDepthPrompt:'',scenario:'',creatorNotes:''};
            const results=[];
            for(const c of cases){
              const r=await wi.getWorldInfoPrompt([c.text],200000,true,defaults);
              const joined=[r.worldInfoString,r.worldInfoBefore,r.worldInfoAfter,JSON.stringify(r.worldInfoDepth||[]),JSON.stringify(r.WIDepthEntries||[]),JSON.stringify(r.ANBeforeEntries||[]),JSON.stringify(r.ANAfterEntries||[]),JSON.stringify(r.outletEntries||{})].join('\n');
              const missing=c.must.filter(x=>!joined.includes(x));
              results.push({id:c.id,hit:missing.length===0,missing,preview:joined.slice(0,16000)});
            }
            return {characterName:st.characters[chid]?.name,expectedBook,expectedWorld,importControlVisible,activeWorld,worldNames,results};
          });

          const report={stCommit:process.env.ST_COMMIT,imported,scan,pageErrors};
          await fs.writeFile(`${process.env.EVIDENCE}/rc4-runtime.json`,JSON.stringify(report,null,2));
          await page.screenshot({path:`${process.env.EVIDENCE}/rc4-runtime.png`,fullPage:true});
          await browser.close();
          console.log(JSON.stringify({stCommit:report.stCommit,imported,scan:{characterName:scan.characterName,expectedBook:scan.expectedBook,expectedWorld:scan.expectedWorld,importControlVisible:scan.importControlVisible,activeWorld:scan.activeWorld,worldNames:scan.worldNames,results:scan.results.map(x=>({id:x.id,hit:x.hit,missing:x.missing}))},pageErrors},null,2));
          const misses=scan.results.filter(x=>!x.hit);
          if(scan.expectedBook!==scan.expectedWorld) throw new Error('candidate binding names differ before import');
          if(scan.activeWorld!==scan.expectedBook) throw new Error('active world differs after import');
          if(!scan.worldNames.includes(scan.expectedBook)) throw new Error('imported lorebook not found by expected name');
          if(pageErrors.length||misses.length) throw new Error('native WI misses '+JSON.stringify({pageErrors,misses:misses.map(x=>({id:x.id,missing:x.missing}))}));
          NODE
          node /tmp/qidu-rc4-runtime.mjs

      - name: Stop ST
        if: always()
        run: if [ -f /tmp/qidu-he-v03-rc4.pid ]; then kill "$(cat /tmp/qidu-he-v03-rc4.pid)" 2>/dev/null || true; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-v03-rc4-runtime
          path: bench-evidence/qidu-he-v03-rc4-runtime/
          if-no-files-found: error
