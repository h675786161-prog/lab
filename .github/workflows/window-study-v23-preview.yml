name: Window Study v2.3 Real Preview
on:
  workflow_dispatch:
  push:
    branches: [qa/window-study-v23b-20261017]
    paths:
      - '.github/workflows/window-study-v23-preview.yml'
      - 'fixtures/window-study-v23/**'
permissions: {contents: read}
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ST_DIR: /tmp/window-study-v23-st
      EVIDENCE: ${{ github.workspace }}/lab-evidence-window-v23
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >/dev/null
          fc-cache -f
      - name: Clone exact SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
      - name: Install
        working-directory: /tmp/window-study-v23-st
        run: npm ci
      - name: Start
        shell: bash
        run: |
          mkdir -p "$EVIDENCE"
          cd "$ST_DIR"
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/sillytavern.log" 2>&1 &
          echo $! >/tmp/window-study-v23.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat "$EVIDENCE/sillytavern.log"
          exit 1
      - name: Browser
        shell: bash
        run: |
          mkdir -p /tmp/window-study-v23-browser
          cd /tmp/window-study-v23-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "PW_ENTRY=file:///tmp/window-study-v23-browser/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
      - name: Screenshot
        run: EVIDENCE="$EVIDENCE" node fixtures/window-study-v23/shot.mjs
      - name: Stop
        if: always()
        run: test ! -f /tmp/window-study-v23.pid || kill "$(cat /tmp/window-study-v23.pid)" 2>/dev/null || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-study-v23-preview
          path: lab-evidence-window-v23
          if-no-files-found: warn
