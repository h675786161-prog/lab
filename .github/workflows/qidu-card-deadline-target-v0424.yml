name: Qidu v0424 Targeted Deadlines

on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-deadline-v0424-target-trigger.txt'

permissions:
  contents: read

jobs:
  deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_API_KEY: ${{ secrets.GG }}
      MODEL_API_BASE: https://gcli.ggchan.dev/v1
      RELEASE_MODEL: 'gemini-3-flash-preview'
      LAB_OUT_DEADLINE: bench-evidence/qidu-card-v0424-deadlines
    steps:
      - uses: actions/checkout@v4
      - name: Run deadline and Ann chase regression
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            node .lab/qidu-card-model-bench-v0424-deadlines.mjs && exit 0
            echo "deadline retry $n"
            sleep 15
          done
          exit 1
      - name: Upload deadline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-deadline-target
          path: bench-evidence/qidu-card-v0424-deadlines/
          if-no-files-found: warn
