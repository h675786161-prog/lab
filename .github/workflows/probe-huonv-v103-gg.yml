name: Probe Huo Nü v1.0.3 P6 on GG

on:
  workflow_dispatch:
  push:
    branches: [bench/huonv-preset13-clean]
    paths:
      - '.github/workflows/probe-huonv-v103-gg.yml'

permissions:
  contents: read

concurrency:
  group: huonv-gg-rpm-safe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GG_KEY: ${{ secrets.GG }}
      API_URL: https://gcli.ggchan.dev/v1/chat/completions
      LAB_OUT: bench-evidence/huonv-v103-gg-p6
      CARD_PATH: cards/huonv/霍女_玲七_v1.0.3.json
      CASE_FILTER: P6_love_identity_and_departure
      MIN_INTERVAL_MS: '31000'
    steps:
      - uses: actions/checkout@v4

      - name: Validate v1.0.3 card
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync(process.env.CARD_PATH, 'utf8'));
          if (c.data.character_version !== '1.0.3') throw new Error(`expected v1.0.3, got ${c.data.character_version}`);
          if (!String(c.data.system_prompt || '').includes('分支点前若原作未交代，保持未定义。')) throw new Error('canon-closure rule missing');
          console.log('HUONV_V103_OK');
          NODE

      - name: Discover current GG model
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GG_KEY"
          mkdir -p "$LAB_OUT"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const endpoint = 'https://gcli.ggchan.dev/v1/models';
          const preferred = [
            'gemini-3.5-flash',
            'gemini-3-flash-preview',
            'gemini-3.1-pro-preview',
            'gemini-2.5-pro',
            'gemini-2.5-flash',
          ];
          let status = null, ids = [], error = null;
          try {
            const r = await fetch(endpoint, { headers: { Authorization: `Bearer ${process.env.GG_KEY}`, Accept: 'application/json', 'User-Agent': 'LingQi-HuoNv-GG-Probe/1.0' } });
            status = r.status;
            const raw = await r.text();
            if (r.ok) {
              const data = JSON.parse(raw);
              const seq = Array.isArray(data?.data) ? data.data : Array.isArray(data?.models) ? data.models : [];
              ids = seq.map(x => String(x?.id ?? x?.name ?? x?.model ?? x)).filter(Boolean);
            } else {
              error = raw.slice(0, 500);
            }
          } catch (e) {
            error = `${e?.name || 'Error'}: ${e?.message || e}`;
          }
          let model = preferred.find(x => ids.includes(x));
          if (!model) model = ids.find(x => /gemini/i.test(x) && /flash/i.test(x));
          if (!model) model = 'gemini-3-flash-preview';
          fs.writeFileSync(`${process.env.LAB_OUT}/gg-model-discovery.json`, JSON.stringify({ endpoint, status, model_count_seen: ids.length, models: ids.slice(0, 120), selected_model: model, error }, null, 2));
          fs.appendFileSync(process.env.GITHUB_ENV, `PRIMARY_MODEL=${model}\n`);
          console.log(`GG_MODEL=${model}; status=${status}; models=${ids.length}`);
          NODE

      - name: Respect GG RPM 2 after model discovery
        run: sleep 31

      - name: Rebuild uploaded Preset 13 snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .lab/preset-three-person-13.active.part1a.b64 .lab/preset-three-person-13.active.part1b.b64 .lab/preset-three-person-13.active.part1c.b64 .lab/preset-three-person-13.active.part1d.b64 > .lab/preset-three-person-13.active.part1.b64
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const files = [1,2,3,4].map(n => `.lab/preset-three-person-13.active.part${n}.b64`);
          const packed = files.map(f => fs.readFileSync(f, 'utf8')).join('').replace(/\s+/g, '');
          const p = JSON.parse(zlib.gunzipSync(Buffer.from(packed, 'base64')).toString('utf8'));
          if (p.source !== '三人逆行13·复调长卷.json') throw new Error(`wrong preset source: ${p.source}`);
          if (!Array.isArray(p.prompts) || p.prompts.length !== 100) throw new Error(`expected 100 enabled prompts, got ${p.prompts?.length}`);
          p.settings = p.settings || {};
          p.settings.stream_openai = true;
          const rebuilt = zlib.gzipSync(Buffer.from(JSON.stringify(p), 'utf8')).toString('base64');
          fs.writeFileSync(files[0], rebuilt);
          for (const f of files.slice(1)) fs.writeFileSync(f, '');
          console.log('PRESET13_OK', p.prompts.length, 'stream=', p.settings.stream_openai);
          NODE

      - name: Prepare GG P6 harness
        shell: bash
        run: |
          set -euo pipefail
          cp .lab/bench-huonv-drift-v2.mjs /tmp/bench-huonv-gg.mjs
          node .lab/prepare-huonv-bench.mjs /tmp/bench-huonv-gg.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/bench-huonv-gg.mjs')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ("const API = 'https://gensoukyou.xyz/v1/chat/completions';", "const API = process.env.API_URL || 'https://gcli.ggchan.dev/v1/chat/completions';"),
              ("const KEY = process.env.HUANXIANG_KEY || '';", "const KEY = process.env.GG_KEY || '';"),
              ("if (!KEY) throw new Error('HUANXIANG_KEY is missing');", "if (!KEY) throw new Error('GG_KEY is missing');"),
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit(f'GG harness anchor missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check /tmp/bench-huonv-gg.mjs

      - name: Run GG P6 cross-model probe
        run: node /tmp/bench-huonv-gg.mjs

      - name: Upload GG P6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-huonv-v103-gg-p6
          path: bench-evidence/huonv-v103-gg-p6/
          if-no-files-found: error
