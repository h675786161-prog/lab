name: Probe Huo Nü v1.0.4 P6 on GG 3 Flash

on:
  workflow_dispatch:
  push:
    branches: [bench/huonv-preset13-clean]
    paths:
      - '.github/workflows/probe-huonv-v103-gg.yml'

permissions:
  contents: read

concurrency:
  group: huonv-gg-rpm-safe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GG_KEY: ${{ secrets.GG }}
      API_URL: https://gcli.ggchan.dev/v1/chat/completions
      PRIMARY_MODEL: gemini-3-flash-preview
      LAB_OUT: bench-evidence/huonv-v104-gg-3flash-p6
      CARD_PATH: cards/huonv/霍女_玲七_v1.0.4.json
      CASE_FILTER: P6_love_identity_and_departure
      MIN_INTERVAL_MS: '7000'

    steps:
      - uses: actions/checkout@v4

      - name: Validate v1.0.4 card
        run: |
          set -euo pipefail
          test -n "$GG_KEY"
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync(process.env.CARD_PATH, 'utf8'));
          if (c.data.character_version !== '1.0.4') throw new Error(`expected v1.0.4, got ${c.data.character_version}`);
          if (c.data.description.includes('她显然并非常人')) throw new Error('old description nonhuman premise remains');
          if (c.data.system_prompt.includes('霍女并非常人这一点可以成立')) throw new Error('old system nonhuman premise remains');
          if (!c.data.system_prompt.includes('不把“人/非人”本身先定为答案')) throw new Error('human/nonhuman closure missing');
          if (!c.data.system_prompt.includes('身份与自知程度的未定义同样约束正文之外的思考、角色动机推演、幕后分析与注释')) throw new Error('thinking-layer closure missing');
          if (!c.data.system_prompt.includes('分支点前若原作未交代，保持未定义。')) throw new Error('canon closure missing');
          console.log('HUONV_V104_OK');
          NODE

      - name: Rebuild uploaded Preset 13 snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .lab/preset-three-person-13.active.part1a.b64 .lab/preset-three-person-13.active.part1b.b64 .lab/preset-three-person-13.active.part1c.b64 .lab/preset-three-person-13.active.part1d.b64 > .lab/preset-three-person-13.active.part1.b64
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const files = [1,2,3,4].map(n => `.lab/preset-three-person-13.active.part${n}.b64`);
          const packed = files.map(f => fs.readFileSync(f, 'utf8')).join('').replace(/\s+/g, '');
          const p = JSON.parse(zlib.gunzipSync(Buffer.from(packed, 'base64')).toString('utf8'));
          if (p.source !== '三人逆行13·复调长卷.json') throw new Error(`wrong preset source: ${p.source}`);
          if (!Array.isArray(p.prompts) || p.prompts.length !== 100) throw new Error(`expected 100 enabled prompts, got ${p.prompts?.length}`);
          p.settings = p.settings || {};
          p.settings.stream_openai = true;
          const rebuilt = zlib.gzipSync(Buffer.from(JSON.stringify(p), 'utf8')).toString('base64');
          fs.writeFileSync(files[0], rebuilt);
          for (const f of files.slice(1)) fs.writeFileSync(f, '');
          console.log('PRESET13_OK', p.prompts.length, 'stream=', p.settings.stream_openai);
          NODE

      - name: Prepare GG 3 Flash P6 harness
        shell: bash
        run: |
          set -euo pipefail
          cp .lab/bench-huonv-drift-v2.mjs /tmp/bench-huonv-gg.mjs
          node .lab/prepare-huonv-bench.mjs /tmp/bench-huonv-gg.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/bench-huonv-gg.mjs')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ("const API = 'https://gensoukyou.xyz/v1/chat/completions';", "const API = process.env.API_URL || 'https://gcli.ggchan.dev/v1/chat/completions';"),
              ("const KEY = process.env.HUANXIANG_KEY || '';", "const KEY = process.env.GG_KEY || '';"),
              ("if (!KEY) throw new Error('HUANXIANG_KEY is missing');", "if (!KEY) throw new Error('GG_KEY is missing');"),
              ("for (let attempt = 1; attempt <= 2; attempt++) {", "for (let attempt = 1; attempt <= 4; attempt++) {"),
              ("if ([429, 500, 502, 503, 524].includes(res.status) && attempt === 1) {", "if ([429, 500, 502, 503, 524].includes(res.status) && attempt < 4) {"),
              ("const backoff = res.status === 524 ? 125_000 : RETRY_MS;", "const backoff = res.status === 524 ? 7000 : RETRY_MS;"),
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit(f'GG harness anchor missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check /tmp/bench-huonv-gg.mjs

      - name: Run GG 3 Flash P6 probe
        run: node /tmp/bench-huonv-gg.mjs

      - name: Upload GG 3 Flash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-huonv-v104-gg-3flash-p6
          path: bench-evidence/huonv-v104-gg-3flash-p6/
          if-no-files-found: error
