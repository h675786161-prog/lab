name: Qidu Provider Availability Probe

on:
  workflow_dispatch:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-provider-trigger.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      GG_KEY: ${{ secrets.GG }}
      PIAOMIAO_KEY: ${{ secrets.PIAOMIAO }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe model endpoints without exposing credentials
        run: |
          set -euo pipefail
          mkdir -p provider-evidence
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          providers=[
            ('YOUZI','https://youzi.today/v1',os.environ.get('YOUZI_KEY','')),
            ('GG','https://gcli.ggchan.dev/v1',os.environ.get('GG_KEY','')),
            ('PIAOMIAO','https://claudeapi.cc.cd/v1',os.environ.get('PIAOMIAO_KEY','')),
          ]
          rows=[]
          for name,base,key in providers:
            row={'provider':name,'base':base,'secret_present':bool(key)}
            if not key:
              row.update(ok=False,status='missing_secret',models=[]);rows.append(row);continue
            req=urllib.request.Request(base+'/models',headers={'Authorization':'Bearer '+key,'Accept':'application/json','User-Agent':'Qidu-Lab-Probe/1.0'})
            try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                raw=resp.read(1500000);status=resp.status
              data=json.loads(raw.decode('utf-8','replace'))
              seq=(data.get('data') or data.get('models') or []) if isinstance(data,dict) else []
              ids=[]
              for x in seq:
                if isinstance(x,dict): mid=x.get('id') or x.get('name') or x.get('model')
                else: mid=str(x)
                if mid: ids.append(str(mid))
              wanted=[m for m in ids if any(k in m.lower() for k in ('qwen','glm','step'))]
              row.update(ok=200<=status<300,status=status,model_count=len(ids),wanted=wanted[:80])
            except urllib.error.HTTPError as e:
              row.update(ok=False,status=e.code,error_excerpt=e.read(500).decode('utf-8','replace'))
            except Exception as e:
              row.update(ok=False,status='error',error=type(e).__name__+': '+str(e)[:240])
            rows.append(row)
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          with open('provider-evidence/qidu-provider-probe.json','w',encoding='utf-8') as f: json.dump({'results':rows},f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qidu-provider-availability
          path: provider-evidence/
          if-no-files-found: error
