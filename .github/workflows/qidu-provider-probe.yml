name: Qidu Provider Availability Probe

on:
  workflow_dispatch:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-provider-trigger.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      GG_KEY: ${{ secrets.GG }}
      PIAOMIAO_KEY: ${{ secrets.PIAOMIAO }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe live completion-capable models
        run: |
          set -euo pipefail
          mkdir -p provider-evidence
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          providers=[('YOUZI','https://youzi.today/v1',os.environ.get('YOUZI_KEY','')),('GG','https://gcli.ggchan.dev/v1',os.environ.get('GG_KEY','')),('PIAOMIAO','https://claudeapi.cc.cd/v1',os.environ.get('PIAOMIAO_KEY',''))]
          def req(url,key,payload=None,timeout=15):
            h={'Authorization':'Bearer '+key,'Accept':'application/json','User-Agent':'Qidu-Release-Probe/1.0'}; data=None
            if payload is not None:h['Content-Type']='application/json';data=json.dumps(payload,ensure_ascii=False).encode()
            try:
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method='POST' if data else 'GET'),timeout=timeout) as r: raw=r.read(1000000);st=r.status
              try:b=json.loads(raw.decode('utf-8','replace'))
              except:b={}
              return st,b,None
            except urllib.error.HTTPError as e:return e.code,{},e.read(1000).decode('utf-8','replace')[:500]
            except Exception as e:return 'error',{},type(e).__name__+': '+str(e)[:250]
          rows=[]
          for name,base,key in providers:
            row={'provider':name,'base':base,'models':[],'probes':[]}
            if not key:row['status']='missing_secret';rows.append(row);continue
            st,d,er=req(base+'/models',key);seq=(d.get('data') or d.get('models') or []) if isinstance(d,dict) else []
            ids=[]
            for x in seq:
              mid=(x.get('id') or x.get('name') or x.get('model')) if isinstance(x,dict) else str(x)
              if mid:ids.append(str(mid))
            row.update(status=st,models=ids[:100],error=er)
            priority=[]
            preferred=['[iao]MiniMaxAI/MiniMax-M2.7','[ok]mimo-v2-5','[ok]hy3','[ov]moonshotai/kimi-k3','gemini-3.6-flash','gemini-3.5-flash-lite','[ma]gpt-6-astra','[ma]gpt-5.6-sol']
            for m in preferred+ids:
              low=m.lower()
              if m in ids and m not in priority and any(k in low for k in ('glm','qwen','gemini','claude','gpt','grok','deepseek','step','minimax','mimo','hy3','kimi','moonshot')) and 'vision' not in low:priority.append(m)
            for model in priority[:8]:
              p={'model':model,'max_tokens':24,'temperature':0,'messages':[{'role':'user','content':'只回答：测试通过'}]}
              ps,body,pe=req(base+'/chat/completions',key,p,12);c=''
              try:
                c=body.get('choices',[{}])[0].get('message',{}).get('content','')
                if isinstance(c,list):c=''.join(str(y.get('text') or y.get('content') or '') if isinstance(y,dict) else str(y) for y in c)
                c=str(c or '')
              except:pass
              row['probes'].append({'model':model,'status':ps,'usable':ps==200 and bool(c.strip()),'content_len':len(c),'error':pe})
              if row['probes'][-1]['usable'] and name=='GG': break
            rows.append(row)
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          with open('provider-evidence/qidu-provider-probe.json','w',encoding='utf-8') as f:json.dump({'results':rows},f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qidu-provider-availability
          path: provider-evidence/
          if-no-files-found: error
