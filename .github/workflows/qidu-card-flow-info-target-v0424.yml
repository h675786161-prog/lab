name: Qidu v0424 Targeted Flow+Info

on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-flow-info-v0424-target-trigger.txt'

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [flow, info]
    env:
      MODEL_API_KEY: ${{ secrets.GG }}
      MODEL_API_BASE: https://gcli.ggchan.dev/v1
      RELEASE_MODEL: 'gemini-3-flash-preview'
      LAB_OUT_FLOW: bench-evidence/qidu-card-v0424-narrative-flow
      LAB_OUT_INFO: bench-evidence/qidu-card-v0423-info-timeline
    steps:
      - uses: actions/checkout@v4
      - name: Adapt info probe to exact v0.4.24 candidate
        if: ${{ matrix.kind == 'info' }}
        run: python .lab/qidu-final-adapt-probes-v0424.py
      - name: Run target
        run: |
          set -euo pipefail
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/.lab/qidu-fetch-retry-preload.mjs"
          for n in 1 2; do
            if [ "${{ matrix.kind }}" = flow ]; then
              node .lab/qidu-card-model-bench-v0424-flow.mjs && exit 0
            else
              if node .lab/qidu-card-model-bench-v0423-info-timeline.mjs && node .lab/qidu-info-report-gate-v0423.mjs; then exit 0; fi
            fi
            echo "${{ matrix.kind }} retry $n"
            sleep 15
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-flow-info-${{ matrix.kind }}
          path: bench-evidence/
          if-no-files-found: warn
