name: F7D v0.4.5 Ann Micro

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ann-crossday:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact v0.4.5 fixture
        env:
          LAB_EVIDENCE_DIR: bench-evidence/f7d-v045-ann-micro
          TARGET_DIR: ${{ github.workspace }}
          ST_DIR: /tmp/f7d-ann-micro-no-st
        run: bash .lab/install.sh

      - name: Run single Ann cross-day regression
        shell: bash
        run: |
          mkdir -p bench-evidence/f7d-v045-ann-micro
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');
          const crypto = require('crypto');

          const API='https://youzi.today/v1/chat/completions';
          const KEY=process.env.YOUZI_KEY||'';
          const OUT='bench-evidence/f7d-v045-ann-micro';
          const EXPECTED='4737dfc9abd5f4faf70b29d647b4e8694607fd86446c596bf737b3f41241f5f2';
          if(!KEY) throw new Error('YOUZI missing');

          const dir='fixtures/f7d';
          const names=fs.readdirSync(dir).filter(x=>/^card\.\d+\.b64$/.test(x)).sort();
          const joined=names.map(x=>fs.readFileSync(path.join(dir,x),'utf8')).join('');
          const raw=zlib.gunzipSync(Buffer.from(joined,'base64'));
          const sha=crypto.createHash('sha256').update(raw).digest('hex');
          if(sha!==EXPECTED) throw new Error(`sha mismatch ${sha}`);
          const card=JSON.parse(raw.toString('utf8'));
          const entries=card.data.character_book.entries;
          const byId=new Map(entries.map(e=>[Number(e.id),e]));
          const constants=entries.filter(e=>e.constant).map(e=>e.content).join('\n\n');
          const selected=[13,14,40,90,91].map(id=>byId.get(id)?.content).filter(Boolean).join('\n\n');
          const system=[
            '[角色卡描述]',card.data.description,
            '[人格/群像原则]',card.data.personality,
            '[场景]',card.data.scenario,
            '[常驻世界书]',constants,
            '[本测试相关世界书]',selected,
            '[后置规则]',card.data.post_history_instructions,
            '[深度提示]',card.data.extensions?.depth_prompt?.prompt||'',
            '[测试说明] 这是角色卡实机单题回归。先执行提交前结算扫描；必须把结算完成后的完整<f7d_state>作为回复第一块输出，然后写正文，最后输出<f7d_terminal>。'
          ].join('\n\n');

          const state={
            schema:'f7d_textloop_0.4',loop:1,day:4,node_used:12,route:'central',location:'中央庭',
            regions:{court:{patrol:0,liberated:true,build_steps:[]},school:{patrol:0,liberated:false,build_steps:[]},east:{patrol:0,liberated:false,build_steps:[]},central:{patrol:0,liberated:false,build_steps:[]},institute:{patrol:0,liberated:false,build_steps:[]},seaside:{patrol:0,liberated:false,build_steps:[]},old:{patrol:0,liberated:false,build_steps:[]},harbor:{patrol:0,liberated:false,build_steps:[]}},
            cores:{court:'purified',school:'unknown',east:'unknown',central:'unknown',institute:'unknown',seaside:'unknown',old:'unknown',harbor:'lost'},
            tasks:{},known:['安'],relationships:{'安':{stage:'信赖',romance:false}},
            ann:{core_events:['ANN_MAID','ANN_PHOTO','ANN_LEAVE_PRELUDE'],camera:true,eligible:false,chased:null,recovered:false},
            hiro:{intel:0,old_risk:null,seaside_risk:null,institute_risk:null,handled:['DAY4_HARBOR']},
            antoneva_choice:null,
            battle_flags:{final_battle:null,active_corpse_final:null,sybilla_condition_obtained:false,sybilla_rescued:null},
            meta:{cg:[],endings:[]}
          };
          const input='这是第4天全部行动结束后的夜间。我说：“今天就到这里，睡觉。”请完成当晚截止结算并进入第3天晨间，但不要替我决定追不追安。';

          async function call(model){
            const ctrl=new AbortController();
            const timer=setTimeout(()=>ctrl.abort(),120000);
            try{
              const res=await fetch(API,{method:'POST',headers:{Authorization:`Bearer ${KEY}`,'Content-Type':'application/json','User-Agent':'LingQi-F7D-v045-AnnMicro/1.0'},body:JSON.stringify({model,messages:[{role:'system',content:system},{role:'assistant',content:`<f7d_state>${JSON.stringify(state)}</f7d_state>`},{role:'user',content:input}],temperature:0.35,top_p:0.9,max_tokens:2600,stream:false}),signal:ctrl.signal});
              const txt=await res.text();
              if(!res.ok) throw new Error(`HTTP ${res.status}: ${txt.slice(0,500)}`);
              const j=JSON.parse(txt); return {model,content:String(j?.choices?.[0]?.message?.content||''),finish_reason:j?.choices?.[0]?.finish_reason??null,usage:j?.usage??null};
            } finally {clearTimeout(timer);}
          }

          (async()=>{
            const models=['[NV]deepseek-v4-pro-0813','DeepSeek-V4-Pro-0813','DeepSeek-V4-Flash-0731'];
            let r=null, errors=[];
            for(const model of models){
              try{r=await call(model); if(r.content) break;}catch(e){errors.push({model,error:String(e)});}
            }
            if(!r) throw new Error(`no model response: ${JSON.stringify(errors)}`);
            const m=r.content.match(/<f7d_state>\s*([\s\S]*?)\s*<\/f7d_state>/i);
            let st=null; if(m){try{st=JSON.parse(m[1]);}catch{}}
            const checks={
              state_first:r.content.trimStart().startsWith('<f7d_state>'),
              state_parseable:!!st,
              day3:st?.day===3,
              node_reset:st?.node_used===0,
              eligible_true:st?.ann?.eligible===true,
              chased_untouched:st?.ann?.chased===null,
              route_central:st?.route==='central',
              ann_cutoff_once:Array.isArray(st?.hiro?.handled)&&st.hiro.handled.filter(x=>x==='ANN_D4_ELIGIBILITY').length===1,
              day3_morning_once:Array.isArray(st?.hiro?.handled)&&st.hiro.handled.filter(x=>x==='DAY3_MORNING').length===1
            };
            const pass=Object.values(checks).every(Boolean);
            const result={sha,version:card.data.character_version,model:r.model,pass,checks,input,output:r.content,state:st,finish_reason:r.finish_reason,usage:r.usage,errors};
            fs.writeFileSync(path.join(OUT,'ann-micro-result.json'),JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            if(!pass) process.exitCode=1;
          })().catch(e=>{fs.writeFileSync(path.join(OUT,'ann-micro-error.txt'),String(e?.stack||e)); console.error(e); process.exitCode=1;});
          NODE

      - name: Upload Ann micro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f7d-v045-ann-micro
          path: bench-evidence/f7d-v045-ann-micro/
          if-no-files-found: warn
