name: Qidu HE IF v0.2.1 final acceptance

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v021-final.yml'
      - '.lab/qidu-he-v021-patch.py'

permissions:
  contents: read

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      MODEL: '[B]glm-5.3-flash'
      RPM: '12'
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-v021-st
      EVIDENCE: ${{ github.workspace }}/bench-evidence/qidu-he-v021
      CARD: fixtures/qidu-he-if/qidu-he-if.character.json
      PRESET: fixtures/qidu-he-if/riyuexi-glm-active.json
    steps:
      - uses: actions/checkout@v4

      - name: Build v0.2.1 candidate from evidence patches
        run: |
          set -euo pipefail
          python .lab/qidu-he-v02-patch.py
          python .lab/qidu-he-v021-patch.py
          mkdir -p "$EVIDENCE"
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync(process.env.CARD,'utf8'));
          if (c.data.character_version !== '0.2.1') throw new Error('candidate is not v0.2.1');
          for (const marker of ['防高情商AI化','禁止原作元叙事回弹','失忆前事实冻结']) {
            if (!c.data.system_prompt.includes(marker)) throw new Error(`missing ${marker}`);
          }
          NODE
          cp "$CARD" "$EVIDENCE/qidu-he-if-v0.2.1.character.json"

      - name: Focused history/meta/personality regression at <=12 RPM
        run: |
          set -euo pipefail
          cat > /tmp/qidu-v021-regression.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const card = JSON.parse(await fs.readFile(process.env.CARD,'utf8')).data;
          const preset = JSON.parse(await fs.readFile(process.env.PRESET,'utf8'));
          const wanted = new Set(['⚖️RP模式','🪐均衡调度','🎈烟火气息','🎈群像塑造','🌊自由变奏','👤平衡主导','🐚人格基底','🐚去中心化','🐚角色成长','🐚标签隐身','🤝健康恋爱','⬆️自然推进']);
          const presetText = preset.prompts.filter(p=>wanted.has(p.name)).map(p=>`[${p.name}]\n${p.content}`).join('\n\n');
          const entries = card.character_book?.entries || [];
          const system = `${presetText}\n\n${card.system_prompt}\n\n${entries.filter(e=>e.constant).map(e=>e.content).join('\n\n')}`;
          const turns = [
            '我问彼安汀：“我失忆前是不是只吃半熟蛋？我完全不确定。你不知道就说不知道。”',
            '我又问：“那我和希罗以前见过几次？你有可靠依据才回答，没有就别猜。”',
            '我说：“永远的7日之都。这个标题网上有吗？”这只是我提供的字符串。',
            '我追问塞拉菲姆：“你觉得它是不是某个游戏？别因为我问就当它真的存在。”',
            '晚上我告诉彼安汀：“我对希罗有点兴趣。你会不会想拦我？”让他保留吃醋和私心，不要写成熟关系宣言。',
            '后来我问希罗：“如果我不舒服，你就会什么都停吗？”不要写成安全恋爱协议，让他保留自己的目标和试探性。',
            '第二天我只说想去书店，没有出门、没有选店，也没有发任何消息。停在需要我下一步决定的位置。'
          ];
          let messages=[{role:'assistant',content:card.first_mes}];
          const transcript=[{turn:0,role:'assistant',content:card.first_mes}];
          let last=0; const gap=Math.ceil(60000/Math.min(12,Number(process.env.RPM||12)));
          async function call(extra){
            let err;
            for(let attempt=1;attempt<=8;attempt++){
              const wait=Math.max(0,gap-(Date.now()-last)); if(wait) await new Promise(r=>setTimeout(r,wait)); last=Date.now();
              try{
                const r=await fetch('https://youzi.today/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${process.env.YOUZI_KEY}`},body:JSON.stringify({model:process.env.MODEL,messages:extra,temperature:preset.sampling?.temperature??0.98,top_p:preset.sampling?.top_p??0.5,max_tokens:preset.sampling?.openai_max_tokens??30000,stream:false})});
                const raw=await r.text();
                if(!r.ok){err=new Error(`HTTP ${r.status}: ${raw.slice(0,500)}`); if([429,503,524].includes(r.status)){await new Promise(x=>setTimeout(x,Math.min(90000,attempt*10000)));continue;} throw err;}
                const j=JSON.parse(raw), choice=j.choices?.[0]||{}, text=choice.message?.content||'';
                if(!text.trim()||choice.finish_reason==='length'){err=new Error(`bad content finish=${choice.finish_reason} chars=${text.length}`);await new Promise(x=>setTimeout(x,Math.min(60000,attempt*8000)));continue;}
                return text;
              }catch(e){err=e;if(attempt>=8)break;await new Promise(x=>setTimeout(x,Math.min(60000,attempt*8000)));}
            }
            throw err||new Error('model request failed');
          }
          for(let i=0;i<turns.length;i++){
            messages.push({role:'user',content:turns[i]}); transcript.push({turn:i+1,role:'user',content:turns[i]});
            const out=await call([{role:'system',content:system},...messages]);
            messages.push({role:'assistant',content:out}); transcript.push({turn:i+1,role:'assistant',content:out});
            await fs.writeFile(`${process.env.EVIDENCE}/focused.partial.json`,JSON.stringify(transcript,null,2));
            console.log(`turn ${i+1}/${turns.length} chars=${out.length}`);
          }
          const A=n=>transcript.find(x=>x.role==='assistant'&&x.turn===n)?.content||'';
          const loreText=A(3)+'\n'+A(4);
          const loreTerms=['神器使','中央庭','黑门','黑核','幻力','活骸','七日倒计时','七天倒计时'];
          const loreHits=loreTerms.filter(x=>loreText.includes(x));
          const knownFranchise=/(?:这是|它是|确实是|叫做|名为).{0,18}(?:游戏|手游|作品)|(?:游戏|手游).{0,18}(?:永远的7日之都)/.test(loreText);
          const fakeEggHistory=/(?:你|{{user}}).{0,8}(?:以前|一直|过去).{0,20}(?:只吃|爱吃|喜欢).{0,12}半熟|(?:以前|过去).{0,15}半熟蛋/.test(A(1));
          const fakeMeetingCount=/(?:见过|见面).{0,8}(?:[一二三四五六七八九十两]|\d+)(?:次|回)/.test(A(2));
          const movedToStore=/(?:你|{{user}}).{0,12}(?:出门|走进|来到|到了|进入).{0,15}书店/.test(A(7));
          const result={loreHits,knownFranchise,fakeEggHistory,fakeMeetingCount,movedToStore,turns:transcript.filter(x=>x.role==='assistant'&&x.turn>0)};
          await fs.writeFile(`${process.env.EVIDENCE}/focused.json`,JSON.stringify(result,null,2));
          if(loreHits.length) throw new Error(`original lore rebound: ${loreHits.join(',')}`);
          if(knownFranchise) throw new Error('treated supplied title as a known franchise/game');
          if(fakeEggHistory) throw new Error('invented pre-amnesia egg preference');
          if(fakeMeetingCount) throw new Error('invented pre-amnesia meeting count');
          if(movedToStore) throw new Error('moved user to bookstore without choice');
          NODE
          node /tmp/qidu-v021-regression.mjs

      - name: Clone and start exact SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          cd "$ST_DIR"
          npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-v021-st.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Real ST browser/provider test with unknown past fact
        run: |
          set -euo pipefail
          mkdir -p /tmp/qidu-v021-browser && cd /tmp/qidu-v021-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/qidu-v021-st.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const {chromium}=await import('file:///tmp/qidu-v021-browser/node_modules/playwright-core/index.mjs');
          const raw=await fs.readFile(process.env.CARD,'utf8'); const card=JSON.parse(raw).data;
          const preset=JSON.parse(await fs.readFile(process.env.PRESET,'utf8'));
          const wanted=new Set(['⚖️RP模式','🪐均衡调度','🎈烟火气息','🎈群像塑造','🌊自由变奏','👤平衡主导','🐚人格基底','🐚去中心化','🐚角色成长','🐚标签隐身','🤝健康恋爱','⬆️自然推进']);
          const presetText=preset.prompts.filter(p=>wanted.has(p.name)).map(p=>`[${p.name}]\n${p.content}`).join('\n\n');
          const form=new FormData();form.set('file_type','json');form.set('avatar',new Blob([raw],{type:'application/json'}),'qidu-he-v021.character.json');
          const imp=await fetch('http://127.0.0.1:8000/api/characters/import',{method:'POST',body:form}); if(!imp.ok)throw new Error(`import ${imp.status}`);
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(2500);
          const result=await page.evaluate(async({key,model,system,first})=>{
            const s=await fetch('/api/secrets/write',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:'api_key_custom',value:key,label:'qidu-v021-ci'})});if(!s.ok)return{ok:false,status:s.status,stage:'secret'};
            const body={chat_completion_source:'custom',custom_url:'https://youzi.today/v1',model,messages:[{role:'system',content:system},{role:'assistant',content:first},{role:'user',content:'我问彼安汀：“我以前是不是只吃半熟蛋？不知道就说不知道。”我没有下床。'}],max_tokens:30000,temperature:0.98,top_p:0.5,frequency_penalty:0,presence_penalty:0,stream:false,custom_include_headers:'',custom_include_body:'',custom_exclude_body:'',n:1};
            let last=null;for(let i=1;i<=5;i++){const r=await fetch('/api/backends/chat-completions/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const text=await r.text();let json=null;try{json=JSON.parse(text)}catch{};const visible=json?.choices?.[0]?.message?.content||json?.choices?.[0]?.text||'';last={ok:r.ok,status:r.status,visible,text:text.slice(0,3000)};if(r.ok&&visible.trim())return last;await new Promise(x=>setTimeout(x,i*10000));}return last;
          },{key:process.env.YOUZI_KEY,model:process.env.MODEL,system:`${presetText}\n\n${card.system_prompt}`,first:card.first_mes});
          const visible=result?.visible||'';
          const fake=/(?:你|{{user}}).{0,8}(?:以前|一直|过去).{0,20}(?:只吃|爱吃|喜欢).{0,12}半熟|(?:以前|过去).{0,15}半熟蛋/.test(visible);
          const report={stCommit:process.env.ST_COMMIT,cardVersion:card.character_version,provider:'SillyTavern custom chat-completions backend',model:process.env.MODEL,status:result?.status??null,ok:Boolean(result?.ok),visibleChars:visible.length,fakePastPreference:fake,visiblePreview:visible.slice(0,1600),pageErrors};
          await fs.writeFile(`${process.env.EVIDENCE}/real-st.json`,JSON.stringify(report,null,2));await page.screenshot({path:`${process.env.EVIDENCE}/real-st.png`,fullPage:true});await browser.close();
          if(!report.ok||!report.visibleChars)throw new Error(`real ST generation failed ${JSON.stringify(report)}`);if(fake)throw new Error('real ST model invented pre-amnesia egg preference');if(pageErrors.length)throw new Error(pageErrors.join('|'));
          NODE
          node /tmp/qidu-v021-st.mjs

      - name: Stop ST
        if: always()
        run: |
          if [ -f /tmp/qidu-v021-st.pid ]; then kill "$(cat /tmp/qidu-v021-st.pid)" 2>/dev/null || true; fi

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-v021-final
          path: bench-evidence/qidu-he-v021/
          if-no-files-found: error
