name: Qidu CG v0424 Model Behavior

on:
  workflow_dispatch:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-cg-v0424-model-trigger.txt'

permissions:
  contents: read

jobs:
  cg-model-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: a
            cases: ann_first_meet,antoneva_first_meet,journey_ending,eternal_ending,sacrifice_male
          - group: b
            cases: sacrifice_female,final_male,box_female,box_unknown_gender,journey_repeat_suppressed
    env:
      MODEL_API_KEY: ${{ secrets.PIAOMIAO }}
      MODEL_API_BASE: https://claudeapi.cc.cd/v1
      CG_MODEL: 'deepseek/deepseek-v4.1-flash'
      CG_CASES: ${{ matrix.cases }}
      CG_MAX_TOKENS: 1200
      CG_TIMEOUT_MS: 45000
      CG_ATTEMPTS: 2
      LAB_OUT_CG_MODEL: ${{ github.workspace }}/cg-model-evidence/${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run exact v0.4.24 CG behavior bench
        run: node .lab/qidu-card-model-bench-v0424-cg.mjs
      - name: Upload CG model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-cg-model-evidence-${{ matrix.group }}
          path: cg-model-evidence/${{ matrix.group }}/
          if-no-files-found: warn
