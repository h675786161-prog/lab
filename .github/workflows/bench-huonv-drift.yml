name: Bench Huo Nü Persona Drift

on:
  pull_request:
    paths:
      - 'cards/huonv/**'
      - '.lab/bench-huonv-drift.mjs'
      - '.github/workflows/bench-huonv-drift.yml'

permissions:
  contents: read

concurrency:
  group: gensoukyou-huonv-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUANXIANG_KEY: ${{ secrets.HUANXIANG }}
      LAB_OUT: bench-evidence/huonv-drift
      PRIMARY_MODEL: glm-5.3
      CROSS_MODEL: deepseek-v4-flash-0731
      MIN_INTERVAL_MS: '17000'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare conservative retry harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LAB_OUT"
          printf '{"status":"started","rate_limit":"serial_17s","max_theoretical_rpm":3.53}\n' > "$LAB_OUT/run-start.json"
          python - <<'PY'
          from pathlib import Path
          p = Path('.lab/bench-huonv-drift.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('if ([502, 503].includes(response.status) && attempt === 1)', 'if ([500, 502, 503].includes(response.status) && attempt === 1)')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Run Huo Nü persona drift benchmark
        run: node .lab/bench-huonv-drift.mjs

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-huonv-drift
          path: bench-evidence/huonv-drift/
          if-no-files-found: error
