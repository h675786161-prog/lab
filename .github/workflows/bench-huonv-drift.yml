name: Bench Huo Nü Persona Drift

on:
  pull_request:
    paths:
      - 'cards/huonv/**'
      - '.lab/bench-huonv-drift-v2.mjs'
      - '.lab/preset-three-person-13.active.part*.b64'
      - '.github/workflows/bench-huonv-drift.yml'

permissions:
  contents: read

concurrency:
  group: huonv-drift-gensoukyou-rpm-safe
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUANXIANG_KEY: ${{ secrets.HUANXIANG }}
      LAB_OUT: bench-evidence/huonv-drift
      PRIMARY_MODEL: glm-5.3
      MIN_INTERVAL_MS: '17000'
    steps:
      - uses: actions/checkout@v4
      - name: Run Huo Nü with uploaded Preset 13 active snapshot
        run: node .lab/bench-huonv-drift-v2.mjs
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-huonv-preset13
          path: bench-evidence/huonv-drift/
          if-no-files-found: error
