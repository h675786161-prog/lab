name: LingQi GLM Alive A-B v2
on:
  push:
    branches: ['bench/preset-13']
    paths:
      - '.github/workflows/glm-alive-ab-v2.yml'
      - '.lab/glm-alive-ab-v2.mjs'
      - '.lab/glm-alive-ab-v1.mjs'
      - 'fixtures/nsfw/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ST_DIR: /tmp/lingqi-sillytavern
      LAB_ST_URL: http://127.0.0.1:8000
      LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --check .lab/glm-alive-ab-v1.mjs
          node --check .lab/glm-alive-ab-v2.mjs
          cat fixtures/nsfw/glm-pack.part*.b64 | base64 -d | gzip -t
      - name: Prepare isolated real SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR" "$LAB_EVIDENCE_DIR"; mkdir -p "$LAB_EVIDENCE_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          cd "$ST_DIR"; npm ci
      - name: Start isolated SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          cd "$ST_DIR"; nohup node server.js --listen --port 8000 --disableCsrf > "$LAB_EVIDENCE_DIR/sillytavern-runtime.log" 2>&1 & echo $! > /tmp/lingqi-sillytavern.pid
          for i in $(seq 1 90); do curl -fsS --max-time 2 "$LAB_ST_URL/" >/dev/null 2>&1 && exit 0; kill -0 "$(cat /tmp/lingqi-sillytavern.pid)" 2>/dev/null || { cat "$LAB_EVIDENCE_DIR/sillytavern-runtime.log"; exit 1; }; sleep 1; done; exit 1
      - name: Capture browser evidence
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          [ -z "$CHROME_BIN" ] || "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,1000 --screenshot="$LAB_EVIDENCE_DIR/sillytavern-home.png" "$LAB_ST_URL/" >/tmp/chrome.log 2>&1 || true
      - name: Run refined GLM alive A-B through SillyTavern
        env:
          YOUZI: ${{ secrets.YOUZI }}
        run: node .lab/glm-alive-ab-v2.mjs
      - name: Runtime tail
        if: always()
        run: tail -n 500 "$LAB_EVIDENCE_DIR/sillytavern-runtime.log" > "$LAB_EVIDENCE_DIR/sillytavern-runtime-tail.log" 2>/dev/null || true
      - name: Stop
        if: always()
        run: '[ ! -f /tmp/lingqi-sillytavern.pid ] || kill "$(cat /tmp/lingqi-sillytavern.pid)" 2>/dev/null || true'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingqi-glm-alive-ab-v2
          path: lab-evidence/
          if-no-files-found: error
