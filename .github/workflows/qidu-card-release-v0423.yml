name: Qidu Card Release Gate

on:
  workflow_dispatch:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-release-trigger.txt'

permissions:
  contents: read

jobs:
  real-sillytavern-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ST_DIR: /tmp/qidu-sillytavern
      BROWSER_DIR: /tmp/qidu-browser-qa
      LAB_EVIDENCE_DIR: ${{ github.workspace }}/release-evidence
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clone exact SillyTavern runtime
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
      - name: Install SillyTavern dependencies
        working-directory: /tmp/qidu-sillytavern
        run: npm ci
      - name: Start isolated SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$LAB_EVIDENCE_DIR"
          mkdir -p "$LAB_EVIDENCE_DIR"
          cd "$ST_DIR"
          nohup node server.js --listen --port 8000 --disableCsrf > /tmp/qidu-sillytavern.log 2>&1 &
          echo $! > /tmp/qidu-sillytavern.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/ >/dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat /tmp/qidu-sillytavern.pid)" 2>/dev/null; then cat /tmp/qidu-sillytavern.log; exit 1; fi
            sleep 1
          done
          cat /tmp/qidu-sillytavern.log
          exit 1
      - name: Prepare browser QA
        run: |
          set -euo pipefail
          rm -rf "$BROWSER_DIR"
          mkdir -p "$BROWSER_DIR"
          cd "$BROWSER_DIR"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "LAB_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "LAB_PLAYWRIGHT_CORE_ENTRY=file://$BROWSER_DIR/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          echo "LAB_ST_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "LAB_ST_DIR=$ST_DIR" >> "$GITHUB_ENV"
      - name: Run exact release-candidate browser acceptance
        run: node .lab/runtime-release-candidate-v0423.mjs
      - name: Stop isolated runtime
        if: always()
        run: |
          if [ -f /tmp/qidu-sillytavern.pid ]; then kill "$(cat /tmp/qidu-sillytavern.pid)" 2>/dev/null || true; fi
      - name: Upload release browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0423-release-browser-evidence
          path: release-evidence/
          if-no-files-found: error

  narrative-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MODEL_API_KEY: ${{ secrets.PIAOMIAO }}
      MODEL_API_BASE: https://claudeapi.cc.cd/v1
      YOUZI_KEY: ${{ secrets.YOUZI }}
      GLM_MODEL: 'zai/glm-5.3-flash'
      LAB_OUT: bench-evidence/qidu-card-v0421-core
      LAB_OUT_CONFLICT: bench-evidence/qidu-card-v0418-preset-conflict
      LAB_OUT_INFO: bench-evidence/qidu-card-v0423-info-timeline
      LAB_OUT_ENCOUNTER: bench-evidence/qidu-card-v0421-encounter
      LAB_OUT_NPC_KNOWLEDGE: bench-evidence/qidu-card-v0423-npc-knowledge
      LAB_OUT_NPC_SOURCE: bench-evidence/qidu-card-v0423-offscreen-source
    steps:
      - uses: actions/checkout@v4
      - name: Adapt legacy narrative probes to selected provider and exact candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            '.lab/qidu-card-model-bench-v0418-core.mjs',
            '.lab/qidu-card-model-bench-v0421-encounter.mjs',
            '.lab/qidu-card-model-bench-v0418-preset-conflict.mjs',
            '.lab/qidu-card-model-bench-v0423-info-timeline.mjs',
            '.lab/qidu-card-model-bench-v0423-npc-knowledge.mjs',
            '.lab/qidu-card-model-bench-v0423-offscreen-source.mjs',
            '.lab/qidu-first-chimera-release-v0423.mjs',
          ]
          for name in files:
            p=Path(name); s=p.read_text(encoding='utf-8')
            s=s.replace("process.env.YOUZI_KEY||''", "process.env.MODEL_API_KEY||process.env.YOUZI_KEY||''")
            s=s.replace("process.env.YOUZI_KEY || ''", "process.env.MODEL_API_KEY||process.env.YOUZI_KEY||''")
            s=s.replace("const API_BASE='https://youzi.today/v1';", "const API_BASE=process.env.MODEL_API_BASE||'https://youzi.today/v1';")
            s=s.replace("const API='https://youzi.today/v1/chat/completions';", "const API=`${process.env.MODEL_API_BASE||'https://youzi.today/v1'}/chat/completions`;")
            s=s.replace("import { loadQiduOneFileCard, entryMap } from './qidu-card-v0423-author-secret-guard.mjs';", "import { loadQiduReleaseCandidate as loadQiduOneFileCard, entryMap } from './qidu-card-v0423-release-candidate.mjs';")
            s=s.replace("import { loadQiduOneFileCard, entryMap } from './qidu-card-v0423-release-sanitized.mjs';", "import { loadQiduReleaseCandidate as loadQiduOneFileCard, entryMap } from './qidu-card-v0423-release-candidate.mjs';")
            s=s.replace("const contentOf=d=>String(d?.choices?.[0]?.message?.content||'');", "const contentOf=d=>{const c=d?.choices?.[0]?.message?.content;if(Array.isArray(c))return c.map(x=>typeof x==='string'?x:(x?.text||x?.content||'')).join('');return String(c||'')};")
            s=s.replace("const pref=['[B]qwen3.8-flash','qwen3.8-flash','step-3.5-flash',...ids.filter(x=>/(qwen|step)/i.test(x))];", "const pref=[process.env.GLM_MODEL,'[B]qwen3.8-flash','qwen3.8-flash','step-3.5-flash',...ids.filter(x=>/(glm|qwen|step)/i.test(x))];")
            s=s.replace("for(const m of ['[B]qwen3.8-flash','qwen3.8-flash','step-3.5-flash'])", "for(const m of [process.env.GLM_MODEL,'[B]qwen3.8-flash','qwen3.8-flash','step-3.5-flash'].filter(Boolean))")
            p.write_text(s,encoding='utf-8')
          PY
      - name: Record selected narrative provider
        run: |
          echo "provider_base=$MODEL_API_BASE"
          echo "requested_glm=$GLM_MODEL"
      - id: core
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0421-core.mjs
      - run: sleep 4
      - id: encounter
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0421-encounter.mjs
      - run: sleep 4
      - id: conflict
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0418-preset-conflict.mjs
      - run: sleep 4
      - id: info
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0423-info-timeline.mjs
      - id: infosemantic
        name: Re-evaluate first-chimera wording semantically
        if: always()
        continue-on-error: true
        run: node .lab/qidu-info-report-gate-v0423.mjs
      - run: sleep 4
        if: always()
      - id: npc
        if: always()
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0423-npc-knowledge.mjs
      - run: sleep 4
        if: always()
      - id: npcsource
        if: always()
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0423-offscreen-source.mjs
      - run: sleep 4
        if: always()
      - id: chimera
        name: Gate exact release-candidate first-chimera fidelity
        if: always()
        continue-on-error: true
        run: node .lab/qidu-first-chimera-release-v0423.mjs
      - name: Enforce narrative gate
        if: always()
        run: |
          echo "core=${{ steps.core.outcome }}"
          echo "encounter=${{ steps.encounter.outcome }}"
          echo "conflict=${{ steps.conflict.outcome }}"
          echo "info_raw=${{ steps.info.outcome }}"
          echo "info_semantic=${{ steps.infosemantic.outcome }}"
          echo "npc=${{ steps.npc.outcome }}"
          echo "npcsource=${{ steps.npcsource.outcome }}"
          echo "release_chimera=${{ steps.chimera.outcome }}"
          test "${{ steps.core.outcome }}" = "success"
          test "${{ steps.encounter.outcome }}" = "success"
          test "${{ steps.conflict.outcome }}" = "success"
          test "${{ steps.infosemantic.outcome }}" = "success"
          test "${{ steps.npc.outcome }}" = "success"
          test "${{ steps.npcsource.outcome }}" = "success"
          test "${{ steps.chimera.outcome }}" = "success"

  package:
    needs: [real-sillytavern-release, narrative-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact privacy-sanitized release candidate
        run: |
          set -euo pipefail
          rm -rf dist-release
          mkdir -p dist-release
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { loadQiduReleaseCandidate, assertReleasePrivacy } from './.lab/qidu-card-v0423-release-candidate.mjs';
          const {card,raw,compactSha256}=await loadQiduReleaseCandidate(process.cwd(),{skipHashCheck:true});
          assertReleasePrivacy(card);
          const rawText=raw.toString('utf8');
          const forbidden=/(?:玲|h675786161|github\.com|raw\.githubusercontent\.com|api\.github\.com|实验酒馆|world-backstage|(?:\bLAB\b|[-_]lab\b|\blab[-_])|feature\/qidu-card|gmail\.com)/i;
          if(forbidden.test(rawText)) throw new Error('private development provenance remains in release bytes');
          if(card.data.character_version!=='0.4.23') throw new Error(`unexpected version ${card.data.character_version}`);
          if(card.data.creator!=='叶罹') throw new Error(`unexpected creator ${card.data.creator}`);
          if(card.data.creator_notes!=='《永远的7日之都》七日轮回文本互动角色卡。') throw new Error('creator notes mismatch');
          if(card.creatorcomment!=='《永远的7日之都》七日轮回文本互动角色卡。作者：叶罹。') throw new Error('top-level creator comment mismatch');
          if(card.data.character_book?.extensions?.creator!=='叶罹') throw new Error('worldbook creator mismatch');
          if(card.data.character_book?.extensions?.version!=='0.4.23') throw new Error('worldbook release version mismatch');
          if(card.data.character_book?.description!=='《永远的7日之都》七日轮回文本互动世界书。') throw new Error('worldbook description mismatch');
          if(Object.prototype.hasOwnProperty.call(card,'create_date')||Object.prototype.hasOwnProperty.call(card.data,'create_date')) throw new Error('creation timestamp should not be present in release card');
          for(const k of ['repo','repository','repository_url','repositoryUrl','git','git_url','gitUrl','branch','commit','source_url','sourceUrl','homepage','homepage_url','homepageUrl','author_url','authorUrl','creator_url','creatorUrl']) {
            if(Object.prototype.hasOwnProperty.call(card,k)||Object.prototype.hasOwnProperty.call(card.data,k)||Object.prototype.hasOwnProperty.call(card.data.extensions||{},k)||Object.prototype.hasOwnProperty.call(card.data.character_book||{},k)||Object.prototype.hasOwnProperty.call(card.data.character_book?.extensions||{},k)) throw new Error(`private metadata key remains: ${k}`);
          }
          if(card.data.extensions?.qidu_choice_bridge) throw new Error('external choice bridge dependency still present');
          const scripts=card.data.extensions?.regex_scripts||[];
          const rx=id=>scripts.find(x=>x?.id===id);
          const terminal=rx('f7d-terminal-v040'),stateHide=rx('f7d-state-hide-v040'),choices=rx('f7d-choices-wrap-v0414'),choice=rx('f7d-choice-button-v0414');
          if(!terminal||!stateHide||!choices||!choice) throw new Error('required embedded UI regex missing');
          const tr=String(terminal.replaceString||''),sr=String(stateHide.replaceString??''),gr=String(choices.replaceString||''),cr=String(choice.replaceString||'');
          if(!tr.includes('linear-gradient')||!tr.includes('border-radius')) throw new Error('terminal beautification missing');
          if(sr!=='') throw new Error('hidden state is no longer hidden');
          if(!gr.includes('display:grid')||!gr.includes('linear-gradient')||!gr.includes('border-radius')) throw new Error('choice grid beautification missing');
          if(!/<label\b/i.test(cr)||!cr.includes('for="send_textarea"')||!cr.includes('min-height:44px')||!cr.includes('linear-gradient')||!cr.includes('border-radius')) throw new Error('choice tile behavior/style missing');
          const by=p=>(card.data.character_book?.entries||[]).find(e=>String(e.name||'').startsWith(p));
          const p=by('04｜'),d7=by('10｜'),d6=by('11｜'),s=by('30｜'),a=by('41｜'),k=by('44｜'),t=by('67｜'),st=by('91｜');
          const rules={identity:Boolean(p?.content?.includes('角色首次识别门禁｜隐藏执行')),requiredCast:Boolean(p?.content?.includes('场景必出角色连续性检查')),schoolOrder:Boolean(p?.content?.includes('高校初见姓名令牌顺序锁｜隐藏执行')),schoolIdentityContinuity:Boolean(p?.content?.includes('高校初见身份来源连续性｜隐藏执行')),npcKnowledge:Boolean(p?.content?.includes('NPC知识来源门禁｜隐藏执行')),npcZeroSource:Boolean(p?.content?.includes('NPC零来源硬锁与不可见自检｜隐藏执行')),selfAuditBan:Boolean(p?.content?.includes('禁止合规自评旁白｜隐藏执行')),secretNames:Boolean(p?.content?.includes('未解锁秘密名词消隐｜隐藏执行')),countdownLock:Boolean(p?.content?.includes('倒计时含义未解锁时禁止补完｜隐藏执行')),firstChimeraScope:Boolean(p?.content?.includes('第一活骸事故事实边界｜隐藏执行')),day7Countdown:Boolean(d7?.content?.includes('第7天倒计时含义仍锁定')),day6Secret:Boolean(d6?.content?.includes('第6天零身份仍锁定时禁止否定式点名')),day6ChimeraScope:Boolean(d6?.content?.includes('第一活骸事故禁止扩写未锚定伤亡')),school2of6:Boolean(s?.content?.includes('高校2/6姓名顺序不可交换')),schoolKnownContinuity:Boolean(s?.content?.includes('高校已识别角色不得重新匿名')),antonevaScope:Boolean(a?.content?.includes('第一活骸事故只讲已锚定事实')),kajiKnowledge:Boolean(k?.content?.includes('活骸知识边界')),kajiSource:Boolean(k?.content?.includes('珈儿无来源知识不得借名补齐')),kajiIdentityOrder:Boolean(k?.content?.includes('高校第2巡查姓名来源顺序')),teslaIntro:Boolean(t?.content?.includes('首次会合不得先被点名')),teslaIdentitySource:Boolean(t?.content?.includes('泰丝拉姓名必须来自珈儿介绍')),npcLedger:Boolean(st?.content?.includes('NPC知识账本npc_intel')),sourceInvariant:Boolean(st?.content?.includes('NPC来源不可由合理化旁白创建')),countdownSplit:Boolean(st?.content?.includes('倒计时可见与倒计时含义分离'))};
          for(const [label,ok] of Object.entries(rules)) if(!ok) throw new Error(`missing release rule: ${label}`);
          const m=String(card.data.first_mes||'').match(/<f7d_state>([\s\S]*?)<\/f7d_state>/i);
          if(!m) throw new Error('initial state missing');
          const initial=JSON.parse(m[1]);
          if(!initial.npc_intel||Object.keys(initial.npc_intel).length) throw new Error('initial npc_intel invalid');
          if(initial.intel_flags?.zero_identity_known!==false||initial.intel_flags?.countdown_meaning_known!==false) throw new Error('initial secret flags invalid');
          const name='永远的7日之都-七日轮回文本互动-v0.4.23.json';
          await fs.writeFile(`dist-release/${name}`,raw);
          await fs.writeFile('dist-release/SHA256.txt',`${compactSha256}  ${name}\n`);
          console.log(JSON.stringify({version:card.data.character_version,creator:card.data.creator,entries:card.data.character_book?.entries?.length,privacy:true,releaseCandidate:true,rules,sha256:compactSha256},null,2));
          NODE
      - name: Upload release card
        uses: actions/upload-artifact@v4
        with:
          name: qidu-card-v0423-release
          path: dist-release/
          if-no-files-found: error
