name: Qidu HE IF rc5 recursion-isolation candidate

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-rc5-candidate-behavior.yml'
      - '.lab/qidu-he-v03-rc5-recursion-patch.py'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      GLM_API: https://youzi.today/v1/chat/completions
      GLM_MODEL: '[NV]GLM-5.3-flash'
      CARD_PATH: fixtures/qidu-he-if/qidu-he-if.character.json
      PRESET_PATH: fixtures/qidu-he-if/riyuexi-glm-active.json
      LAB_OUT: ${{ github.workspace }}/bench-evidence/qidu-he-rc5-candidate
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-rc5-candidate-st
      ST_URL: http://127.0.0.1:8000/
      PLAYWRIGHT_MODULE: file:///tmp/qidu-rc5-candidate-browser/node_modules/playwright-core/index.mjs
    steps:
      - uses: actions/checkout@v4

      - name: Build rc5 candidate in workspace only
        run: |
          set -euo pipefail
          python .lab/qidu-he-v03-rc5-recursion-patch.py
          node - <<'NODE'
          const d=JSON.parse(require('fs').readFileSync(process.env.CARD_PATH,'utf8')).data;
          if(d.character_version!=='0.3.0-rc5') throw new Error(d.character_version);
          if(d.character_book.entries.length!==31) throw new Error(String(d.character_book.entries.length));
          const n=d.character_book.entries.filter(e=>e.extensions?.prevent_recursion===true).length;
          if(n!==31) throw new Error(`prevent_recursion ${n}/31`);
          console.log('candidate', d.character_version, 'entries', d.character_book.entries.length, 'prevent_recursion', n);
          NODE

      - name: Adapt shared behavior harness for rc5 selectivity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.lab/qidu-he-rc4-behavior.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('0.3.0-rc4','0.3.0-rc5').replace('expected rc4 card','expected rc5 card').replace('rc4 character not loaded','rc5 character not loaded')
          old="""const controlScan = scans.find(x => x.id === 'control_coffee');
          for (const name of ['源千雪：', '米菈：', '亚修：']) {
            if (controlScan.injection.includes(name)) throw new Error(`control scan unexpectedly injected ${name}`);
          }
          """
          new="""const detailedNeedles = ['源千雪：', '米菈：', '亚修：'];
          for (const s of scans.filter(x => x.target)) {
            for (const name of detailedNeedles) {
              if (name !== s.injectionNeedle && s.injection.includes(name)) throw new Error(`${s.id} cross-injected unrelated detail ${name}`);
            }
          }
          const controlScan = scans.find(x => x.id === 'control_coffee');
          for (const name of detailedNeedles) {
            if (controlScan.injection.includes(name)) throw new Error(`control scan unexpectedly injected ${name}`);
          }
          """
          if old not in s:
              raise SystemExit('selectivity anchor not found')
          s=s.replace(old,new)
          old_state="return { thisChid: st.this_chid, chat: st.getCurrentChatId?.() || null, worldNames: [...(wi.world_names || [])], sortedCount: sorted.length };"
          new_state="return { thisChid: st.this_chid, chat: st.getCurrentChatId?.() || null, worldNames: [...(wi.world_names || [])], sortedCount: sorted.length, preventRecursionCount: sorted.filter(e=>e.preventRecursion===true).length };"
          if old_state not in s:
              raise SystemExit('st state anchor not found')
          s=s.replace(old_state,new_state)
          old_assert="if (stState.sortedCount !== 31 || !stState.worldNames.includes(data.extensions.world)) throw new Error(`ST world state invalid: ${JSON.stringify(stState)}`);"
          new_assert="if (stState.sortedCount !== 31 || stState.preventRecursionCount !== 31 || !stState.worldNames.includes(data.extensions.world)) throw new Error(`ST world state invalid: ${JSON.stringify(stState)}`);"
          if old_assert not in s:
              raise SystemExit('state assert anchor not found')
          s=s.replace(old_assert,new_assert)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          mkdir -p "$LAB_OUT"
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          cd "$ST_DIR" && npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$LAB_OUT/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-rc5-candidate.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat "$LAB_OUT/st-runtime.log"; exit 1

      - name: Install browser driver
        run: |
          set -euo pipefail
          rm -rf /tmp/qidu-rc5-candidate-browser
          mkdir -p /tmp/qidu-rc5-candidate-browser
          cd /tmp/qidu-rc5-candidate-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          echo "CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"

      - name: Native ST selectivity then real GLM behavior
        run: node .lab/qidu-he-rc4-behavior.mjs

      - name: Stop ST
        if: always()
        run: if [ -f /tmp/qidu-he-rc5-candidate.pid ]; then kill "$(cat /tmp/qidu-he-rc5-candidate.pid)" 2>/dev/null || true; fi

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-rc5-candidate-native-st-glm
          path: bench-evidence/qidu-he-rc5-candidate/
          if-no-files-found: error
