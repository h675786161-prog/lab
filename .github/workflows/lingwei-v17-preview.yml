name: LingWei v1.7 Compact Master Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/lingwei-v17-preview.yml','fixtures/lingwei-v17/**']
permissions: {contents: read}
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ST_DIR: /tmp/lingwei-v17-st
      EVIDENCE: ${{ github.workspace }}/lab-evidence-v17
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
    steps:
      - uses: actions/checkout@v4
      - name: Build CSS
        run: |
          mkdir -p "$EVIDENCE"
          cat fixtures/lingwei-v14/assets-frame.css fixtures/lingwei-v14/assets-bottle.css fixtures/lingwei-v14/assets-stars.css fixtures/lingwei-v14/assets-deco.css fixtures/lingwei-v14/theme.css fixtures/lingwei-v15/master-reference.css fixtures/lingwei-v16/refine.css fixtures/lingwei-v17/refine.css > /tmp/lingwei-v17.css
          test -s /tmp/lingwei-v17.css
      - name: Clone exact SillyTavern
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
      - name: Install
        working-directory: /tmp/lingwei-v17-st
        run: npm ci
      - name: Start
        run: |
          cd "$ST_DIR"; nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/sillytavern.log" 2>&1 & echo $! >/tmp/lingwei-v17.pid
          for i in $(seq 1 90); do curl -fsS --max-time 2 http://127.0.0.1:8000/ >/dev/null 2>&1 && exit 0; sleep 1; done; cat "$EVIDENCE/sillytavern.log"; exit 1
      - name: Browser
        run: |
          mkdir -p /tmp/lingwei-v17-browser; cd /tmp/lingwei-v17-browser; npm init -y >/dev/null 2>&1; npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; test -n "$CHROME_BIN"; echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"; echo "PW_ENTRY=file:///tmp/lingwei-v17-browser/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
      - name: Screenshot real SillyTavern
        run: EVIDENCE="$EVIDENCE" node fixtures/lingwei-v17/shot.mjs
      - name: Stop
        if: always()
        run: test ! -f /tmp/lingwei-v17.pid || kill "$(cat /tmp/lingwei-v17.pid)" 2>/dev/null || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: lingwei-v17-preview, path: lab-evidence-v17, if-no-files-found: warn}
