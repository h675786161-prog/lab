name: Qidu HE IF materialize v0.3 rc4

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-rc4-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qidu-he-if-longrp
          fetch-depth: 0
      - name: Materialize rc4 fixture
        run: |
          set -euo pipefail
          python .lab/qidu-he-v03-rc4-patch.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('fixtures/qidu-he-if/qidu-he-if.character.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          data=obj['data']
          assert data['character_version']=='0.3.0-rc4', data['character_version']
          assert data['extensions']['world']=='交界都市普通人HE IF世界书', data['extensions']['world']
          assert data['character_book']['name']=='交界都市普通人HE IF世界书', data['character_book']['name']
          assert data['extensions']['world']==data['character_book']['name']
          assert len(data['character_book']['entries'])==31, len(data['character_book']['entries'])
          print('materialized fixture ok:', data['character_version'], len(data['character_book']['entries']))
          PY
      - name: Commit materialized fixture only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- fixtures/qidu-he-if/qidu-he-if.character.json
          if git diff --cached --quiet; then
            echo 'fixture already materialized; nothing to commit'
            exit 0
          fi
          git commit -m 'feat(qidu): materialize v0.3.0-rc4 candidate'
          git push origin HEAD:qidu-he-if-longrp
