name: Qidu HE IF v0.3 rc4 UI acceptance

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-rc4-ui-acceptance.yml'
      - '.lab/qidu-he-v03-rc4-patch.py'

permissions:
  contents: read

jobs:
  ui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARD: fixtures/qidu-he-if/qidu-he-if.character.json
      EVIDENCE: ${{ github.workspace }}/bench-evidence/qidu-he-v03-rc4-ui
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-v03-rc4-ui-st
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python .lab/qidu-he-v03-rc4-patch.py
      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          cd "$ST_DIR"
          npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-v03-rc4-ui.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat "$EVIDENCE/st-runtime.log"; exit 1
      - name: Click character and import lorebook through UI
        run: |
          set -euo pipefail
          mkdir -p /tmp/qidu-rc4-ui-browser && cd /tmp/qidu-rc4-ui-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/qidu-rc4-ui.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const {chromium}=await import('file:///tmp/qidu-rc4-ui-browser/node_modules/playwright-core/index.mjs');
          const raw=await fs.readFile(process.env.CARD,'utf8');
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2500);

          // Seed the candidate file into this clean ST instance. The acceptance actions below are UI clicks.
          const imported=await page.evaluate(async raw=>{
            const f=new FormData(); f.set('file_type','json'); f.set('avatar',new Blob([raw],{type:'application/json'}),'qidu-he-v030-rc4.character.json');
            const r=await fetch('/api/characters/import',{method:'POST',body:f}); return {ok:r.ok,status:r.status,text:(await r.text()).slice(0,500)};
          },raw);
          if(!imported.ok) throw new Error('seed character import failed '+JSON.stringify(imported));

          // Reload like a user reopening ST so the character browser is rendered from persisted data.
          await page.reload({waitUntil:'domcontentloaded',timeout:60000}); await page.waitForTimeout(3500);
          const ids=await page.evaluate(async()=>{const st=await import('/script.js');await st.getCharacters();if(typeof st.printCharactersDebounced==='function'){st.printCharactersDebounced();await new Promise(r=>setTimeout(r,700));}const chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');return {chid,names:(st.characters||[]).map(c=>c?.name)};});
          if(ids.chid<0) throw new Error('rc4 not loaded '+JSON.stringify(ids.names.slice(0,20)));

          const charSelector=`#rm_print_characters_block .character_select[data-chid="${ids.chid}"], #rm_print_characters_block .character_select[chid="${ids.chid}"]`;
          const charCard=page.locator(charSelector).first();
          await charCard.waitFor({state:'attached',timeout:15000});
          await charCard.click({force:true});
          await page.waitForFunction(chid=>window.jQuery && String(window.jQuery('#character_popup').length)>= '0',ids.chid,{timeout:5000}).catch(()=>{});
          await page.waitForTimeout(1800);

          const afterClick=await page.evaluate(async expected=>{const st=await import('/script.js');const wi=await import('/scripts/world-info.js');return {thisChid:st.this_chid,currentChatId:typeof st.getCurrentChatId==='function'?st.getCurrentChatId():null,chatLength:Array.isArray(st.chat)?st.chat.length:null,expected,buttonExists:!!document.querySelector('#import_character_info'),buttonDisplay:document.querySelector('#import_character_info')?getComputedStyle(document.querySelector('#import_character_info')).display:null,buttonChid:window.jQuery?window.jQuery('#import_character_info').data('chid'):null,worldNames:[...(wi.world_names||[])]};},String(ids.chid));
          if(String(afterClick.thisChid)!==String(ids.chid)) throw new Error('UI character click did not establish this_chid '+JSON.stringify(afterClick));

          // The embedded-lorebook control is part of the actual ST character UI. Click it, not the JS function.
          const importButton=page.locator('#import_character_info');
          await importButton.waitFor({state:'attached',timeout:10000});
          await importButton.click({force:true});
          await page.waitForTimeout(500);
          const ok=page.locator('#dialogue_popup_ok');
          if(await ok.count()){
            const visible=await ok.first().isVisible().catch(()=>false);
            if(visible) await ok.first().click({force:true});
          }
          await page.waitForTimeout(1800);

          const final=await page.evaluate(async()=>{
            const st=await import('/script.js'); const wi=await import('/scripts/world-info.js');
            await st.getCharacters(); const chid=(st.characters||[]).findIndex(c=>c?.data?.character_version==='0.3.0-rc4');
            if(String(st.this_chid)!==String(chid) && typeof st.selectCharacterById==='function') await st.selectCharacterById(chid);
            await new Promise(r=>setTimeout(r,700));
            const sorted=await wi.getSortedEntries();
            const defaults={trigger:'normal',personaDescription:'',characterDescription:'',characterPersonality:'',characterDepthPrompt:'',scenario:'',creatorNotes:''};
            const probes=[
              ['芭蕾舞蹈室','源千雪：'],
              ['喷泉广场街头演出','米菈：'],
              ['圣星教会礼拜花房','伊萨克'],
              ['旅行马戏团巡演篷车','悠久乐园'],
              ['黑羽莲华','黑羽莲华']
            ];
            const scans=[];
            for(const [text,needle] of probes){const r=await wi.getWorldInfoPrompt([text],200000,true,defaults);const joined=[r.worldInfoString,r.worldInfoBefore,r.worldInfoAfter,JSON.stringify(r.worldInfoDepth||[]),JSON.stringify(r.outletEntries||{})].join('\n');scans.push({text,needle,hit:joined.includes(needle)});}
            return {thisChid:st.this_chid,currentChatId:typeof st.getCurrentChatId==='function'?st.getCurrentChatId():null,activeWorld:st.characters[chid]?.data?.extensions?.world||'',worldNames:[...(wi.world_names||[])],sortedCount:sorted.length,sortedWorlds:[...new Set(sorted.map(e=>e.world))],scans};
          });

          const report={stCommit:process.env.ST_COMMIT,imported,charSelector,afterClick,final,pageErrors};
          console.log(JSON.stringify(report,null,2));
          await fs.writeFile(`${process.env.EVIDENCE}/ui-acceptance.json`,JSON.stringify(report,null,2));
          await page.screenshot({path:`${process.env.EVIDENCE}/ui-acceptance.png`,fullPage:true});
          await browser.close();
          if(pageErrors.length||!final.currentChatId||final.sortedCount<31||final.activeWorld!=='交界都市普通人HE IF世界书'||!final.worldNames.includes(final.activeWorld)||final.scans.some(x=>!x.hit)) throw new Error('UI acceptance failed '+JSON.stringify({pageErrors,afterClick,final}));
          NODE
          node /tmp/qidu-rc4-ui.mjs
      - name: Stop ST
        if: always()
        run: if [ -f /tmp/qidu-he-v03-rc4-ui.pid ]; then kill "$(cat /tmp/qidu-he-v03-rc4-ui.pid)" 2>/dev/null || true; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-v03-rc4-ui-acceptance
          path: bench-evidence/qidu-he-v03-rc4-ui/
          if-no-files-found: error
