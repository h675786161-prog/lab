name: Qidu HE IF long RP

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-longrp.yml'
      - '.lab/qidu-he-longrp.mjs'
      - '.lab/runtime-smoke.mjs'
      - 'fixtures/qidu-he-if/**'

permissions:
  contents: read
  actions: read

jobs:
  real-sillytavern:
    uses: ./.github/workflows/real-sillytavern.yml
    with:
      extension_name: qidu-he-if
      run_project_smoke: true
      artifact_name: qidu-he-real-sillytavern

  long-rp:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      GLM_MODEL: '[B]glm-5.3-flash'
      RPM: '12'
      LAB_OUT: bench-evidence/qidu-he-longrp
      CARD_PATH: fixtures/qidu-he-if/qidu-he-if.character.json
      PRESET_PATH: fixtures/qidu-he-if/riyuexi-glm-active.json
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixture JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync(process.env.CARD_PATH,'utf8')); JSON.parse(require('fs').readFileSync(process.env.PRESET_PATH,'utf8')); console.log('fixtures valid')"
      - name: Restore turn-31 checkpoint from run 34632841483
        uses: actions/download-artifact@v4
        with:
          name: qidu-he-longrp
          path: bench-evidence/qidu-he-longrp
          github-token: ${{ github.token }}
          repository: h675786161-prog/lab
          run-id: 34632841483
      - name: Adapt benchmark for checkpoint resume and GLM reasoning budget
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.lab/qidu-he-longrp.mjs')
          s = p.read_text()
          old_state = """let messages = [{ role: 'assistant', content: data.first_mes }];
          const transcript = [{ turn: 0, role: 'assistant', content: data.first_mes }];"""
          new_state = r"""const resumePath = path.join(OUT, 'transcript.partial.json');
          let transcript;
          let messages;
          let completedTurns = 0;
          try {
            const resumeRaw = await fs.readFile(resumePath, 'utf8');
            transcript = JSON.parse(resumeRaw);
            const done = transcript.filter(x => x.role === 'assistant' && Number.isInteger(x.turn)).map(x => x.turn);
            completedTurns = Math.max(0, ...done);
            messages = transcript.map(x => ({ role: x.role, content: x.content }));
            console.log(`resume checkpoint loaded: completed_turns=${completedTurns}`);
          } catch (error) {
            console.warn(`no usable checkpoint, starting fresh: ${String(error?.message || error)}`);
            messages = [{ role: 'assistant', content: data.first_mes }];
            transcript = [{ turn: 0, role: 'assistant', content: data.first_mes }];
          }"""
          if old_state not in s:
              raise SystemExit('state anchor not found')
          s = s.replace(old_state, new_state)
          start = s.index('async function callModel(')
          end = s.index('\n\nfor (let i', start)
          replacement = r'''async function callModel(extraMessages, maxTokens = 30000) {
            let lastError = null;
            for (let attempt = 1; attempt <= 8; attempt++) {
              const now = Date.now();
              const wait = Math.max(0, minStartGap - (now - lastStart));
              if (wait) await new Promise(r => setTimeout(r, wait));
              lastStart = Date.now();
              try {
                const response = await fetch(API, {
                  method: 'POST',
                  headers: { 'content-type': 'application/json', authorization: `Bearer ${KEY}` },
                  body: JSON.stringify({
                    model: MODEL,
                    messages: extraMessages,
                    temperature: preset.sampling?.temperature ?? 0.98,
                    top_p: preset.sampling?.top_p ?? 0.5,
                    frequency_penalty: preset.sampling?.frequency_penalty ?? 0,
                    presence_penalty: preset.sampling?.presence_penalty ?? 0,
                    max_tokens: Math.max(maxTokens, preset.sampling?.openai_max_tokens ?? 30000),
                    stream: false,
                  }),
                });
                const raw = await response.text();
                if (!response.ok) {
                  lastError = new Error(`HTTP ${response.status}: ${raw.slice(0, 1000)}`);
                  if (response.status === 429 || response.status === 503) {
                    console.warn(`transient upstream HTTP ${response.status}, request retry ${attempt}/8`);
                    await new Promise(r => setTimeout(r, Math.min(90000, attempt * 12000)));
                    continue;
                  }
                  throw lastError;
                }
                const json = JSON.parse(raw);
                const choice = json.choices?.[0] || {};
                const message = choice.message || {};
                const content = message.content ?? '';
                if (choice.finish_reason === 'length') {
                  lastError = new Error(`Truncated response: finish_reason=length visible_chars=${content.length}`);
                  console.warn(`length-truncated response, retry ${attempt}/8 visible_chars=${content.length}`);
                  await new Promise(r => setTimeout(r, Math.min(60000, attempt * 8000)));
                  continue;
                }
                if (!content.trim()) {
                  const reasoningChars = String(message.reasoning_content ?? '').length;
                  lastError = new Error(`Reasoning-only response (${reasoningChars} chars), no visible RP content`);
                  console.warn(`reasoning-only response, request retry ${attempt}/8 reasoning_chars=${reasoningChars}`);
                  await new Promise(r => setTimeout(r, Math.min(60000, attempt * 8000)));
                  continue;
                }
                return { content, usage: json.usage || null, finish_reason: choice.finish_reason || null };
              } catch (error) {
                lastError = error;
                if (attempt >= 8) break;
                console.warn(`request error retry ${attempt}/8: ${String(error?.message || error).slice(0, 300)}`);
                await new Promise(r => setTimeout(r, Math.min(60000, attempt * 8000)));
              }
            }
            throw lastError || new Error('Model request failed after retries');
          }'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('for (let i = 0; i < userTurns.length; i++) {', 'for (let i = completedTurns; i < userTurns.length; i++) {')
          s = s.replace("transcript.push({ turn: i + 1, role: 'assistant', content: result.content, usage: result.usage });", "transcript.push({ turn: i + 1, role: 'assistant', content: result.content, usage: result.usage, finish_reason: result.finish_reason });")
          s = s.replace('], 850);', '], 30000);')
          s = s.replace('], 1600);', '], 30000);')
          s = s.replace("operational_note: 'Generation max_tokens capped at 850 for repeatable benchmark runtime; sampling temperature/top_p/frequency/presence come from uploaded preset snapshot.',", "operational_note: 'Resumed from the 31-turn run-4 checkpoint. max_tokens follows uploaded preset openai_max_tokens (30000); finish_reason=length, reasoning-only, 429 and 503 responses are retried without discarding RP history.',")
          p.write_text(s)
          PY
      - name: Continue turns 32-36 and judge full 36-turn history at 12 RPM
        run: node .lab/qidu-he-longrp.mjs
      - name: Upload long-RP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-longrp
          path: bench-evidence/qidu-he-longrp/
          if-no-files-found: warn
