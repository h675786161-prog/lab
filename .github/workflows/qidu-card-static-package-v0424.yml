name: Qidu Card v0424 Static Package Gate

on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-static-package-trigger-v0424.txt'

permissions:
  contents: read

jobs:
  static-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build and validate exact static release package
        env:
          LAB_STATIC_PACKAGE_OUT: dist-static-v0424
        run: node .lab/qidu-static-package-v0424.mjs
      - name: Upload static package evidence
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-static-package
          path: dist-static-v0424/
          if-no-files-found: error
