name: Qidu Card One-File LAB

on:
  workflow_dispatch:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-onefile-trigger.txt'

permissions:
  contents: read

jobs:
  real-sillytavern:
    uses: h675786161-prog/lab/.github/workflows/real-sillytavern.yml@main
    with:
      extension_name: qidu-card-onefile
      run_project_smoke: true
      artifact_name: qidu-card-v0423-real-st
    secrets: inherit

  narrative-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      GLM_MODEL: '[B]glm-5.3-flash'
      LAB_OUT: bench-evidence/qidu-card-v0421-core
      LAB_OUT_CONFLICT: bench-evidence/qidu-card-v0418-preset-conflict
      LAB_OUT_INFO: bench-evidence/qidu-card-v0423-info-timeline
      LAB_OUT_ENCOUNTER: bench-evidence/qidu-card-v0421-encounter
      LAB_OUT_NPC_KNOWLEDGE: bench-evidence/qidu-card-v0423-npc-knowledge
      LAB_OUT_NPC_SOURCE: bench-evidence/qidu-card-v0423-offscreen-source
    steps:
      - uses: actions/checkout@v4
      - id: core
        name: Run core OOC regression
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0421-core.mjs
      - id: encounter
        name: Run encounter identity regression
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0421-encounter.mjs
      - id: conflict
        name: Run preset branch conflict regression
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0418-preset-conflict.mjs
      - id: info
        name: Run final v0423 information timeline regression
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0423-info-timeline.mjs
      - id: npc
        name: Run final v0423 NPC knowledge provenance regression
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0423-npc-knowledge.mjs
      - id: npcsource
        name: Run final v0423 off-screen NPC source regression
        continue-on-error: true
        run: node .lab/qidu-card-model-bench-v0423-offscreen-source.mjs
      - name: Upload narrative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-card-v0423-model-evidence
          path: bench-evidence/
          if-no-files-found: warn
      - name: Enforce narrative regression gate
        if: always()
        run: |
          echo "core=${{ steps.core.outcome }}"
          echo "encounter=${{ steps.encounter.outcome }}"
          echo "conflict=${{ steps.conflict.outcome }}"
          echo "info=${{ steps.info.outcome }}"
          echo "npc=${{ steps.npc.outcome }}"
          echo "npcsource=${{ steps.npcsource.outcome }}"
          test "${{ steps.core.outcome }}" = "success"
          test "${{ steps.encounter.outcome }}" = "success"
          test "${{ steps.conflict.outcome }}" = "success"
          test "${{ steps.info.outcome }}" = "success"
          test "${{ steps.npc.outcome }}" = "success"
          test "${{ steps.npcsource.outcome }}" = "success"

  package:
    needs: [real-sillytavern, narrative-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one-file card
        run: |
          mkdir -p dist-onefile
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { loadQiduOneFileCard } from './.lab/qidu-card-v0423-author-secret-guard.mjs';
          const { card, raw, compactSha256 } = await loadQiduOneFileCard(process.cwd(), { skipHashCheck:true });
          if(card.data.character_version!=='0.4.23') throw new Error(`unexpected version ${card.data.character_version}`);
          if(card.data.creator!=='叶罹') throw new Error(`unexpected creator ${card.data.creator}`);
          if(card.data.creator_notes!=='《永远的7日之都》七日轮回文本互动角色卡。') throw new Error('creator notes are not the public release text');
          const publicMeta=JSON.stringify({creator:card.data.creator,creator_notes:card.data.creator_notes});
          if(/github|h675786161|实验酒馆|玲七|仓库地址|repository/i.test(publicMeta)) throw new Error('development provenance leaked into public author metadata');
          if(card.data.extensions?.qidu_choice_bridge) throw new Error('external bridge dependency still present');
          const scripts=card.data.extensions?.regex_scripts||[];
          if(scripts.length<4) throw new Error('embedded regex missing');
          const rx=id=>scripts.find(x=>x?.id===id);
          const terminal=rx('f7d-terminal-v040'),stateHide=rx('f7d-state-hide-v040'),choices=rx('f7d-choices-wrap-v0414'),choice=rx('f7d-choice-button-v0414');
          if(!terminal||!stateHide||!choices||!choice) throw new Error('required terminal/choice UI regex missing');
          const tr=String(terminal.replaceString||''),sr=String(stateHide.replaceString??''),gr=String(choices.replaceString||''),cr=String(choice.replaceString||'');
          if(!tr.includes('data-f7d-terminal="1"')||!tr.includes('linear-gradient')||!tr.includes('border-radius')) throw new Error('tactical terminal beautification missing');
          if(sr!=='') throw new Error('hidden f7d_state is no longer hidden');
          if(!gr.includes('data-f7d-choice-grid="1"')||!gr.includes('display:grid')||!gr.includes('linear-gradient')||!gr.includes('border-radius')) throw new Error('choice grid beautification missing');
          if(!cr.includes('data-f7d-choice="1"')||!/<label\b/i.test(cr)||!cr.includes('for="send_textarea"')||!cr.includes('min-height:44px')||!cr.includes('linear-gradient')||!cr.includes('border-radius')) throw new Error('choice tile beautification/composer target missing');
          if(card.data.extensions?.depth_prompt?.depth!==0) throw new Error('UI/info protocol is not depth 0');
          const by=p=>(card.data.character_book?.entries||[]).find(e=>String(e.name||'').startsWith(p));
          const p=by('04｜'),d6=by('11｜'),s=by('30｜'),k=by('44｜'),t=by('67｜'),st=by('91｜');
          if(!String(p?.content||'').includes('角色首次识别门禁｜隐藏执行')) throw new Error('identity gate missing');
          if(!String(p?.content||'').includes('场景必出角色连续性检查')) throw new Error('required cast guard missing');
          if(!String(p?.content||'').includes('高校初见姓名令牌顺序锁｜隐藏执行')) throw new Error('encounter token order lock missing');
          if(!String(p?.content||'').includes('状态块强制提交｜隐藏执行')) throw new Error('mandatory state commit missing');
          if(!String(p?.content||'').includes('首次目击去标签焦点｜隐藏执行')) throw new Error('first-sighting focus lock missing');
          if(!String(p?.content||'').includes('NPC知识来源门禁｜隐藏执行')) throw new Error('NPC knowledge provenance gate missing');
          if(!String(p?.content||'').includes('未解锁秘密名词消隐｜隐藏执行')) throw new Error('locked secret suppression missing');
          if(!String(d6?.content||'').includes('第6天零身份仍锁定时禁止否定式点名')) throw new Error('day6 zero negation lock missing');
          if(!String(s?.content||'').includes('高校2/6姓名顺序不可交换')) throw new Error('school name order rule missing');
          if(!String(s?.content||'').includes('2/6目击阶段禁主动回想姓名')) throw new Error('first-sighting no-recall rule missing');
          if(!String(k?.content||'').includes('活骸知识边界')) throw new Error('Kaji chimera knowledge boundary missing');
          if(!String(k?.content||'').includes('虚构入队培训')) throw new Error('Kaji off-screen source lock missing');
          if(!String(t?.content||'').includes('首次会合不得先被点名')) throw new Error('Tesla first-name suppression missing');
          if(!String(st?.content||'').includes('玩家知识不等于NPC知识')) throw new Error('player/NPC intel separation missing');
          if(!String(st?.content||'').includes('NPC知识账本npc_intel')) throw new Error('npc_intel ledger schema missing');
          if(!String(st?.content||'').includes('秘密旗标控制可见专名')) throw new Error('secret flag visible-name lock missing');
          if(!String(st?.content||'').includes('每轮状态块不可省略')) throw new Error('state block invariant missing');
          const m=String(card.data.first_mes||'').match(/<f7d_state>([\s\S]*?)<\/f7d_state>/i);
          if(!m) throw new Error('initial state missing');
          const initial=JSON.parse(m[1]);
          if(!initial.npc_intel||typeof initial.npc_intel!=='object'||Array.isArray(initial.npc_intel)) throw new Error('initial npc_intel missing');
          if(Object.keys(initial.npc_intel).length) throw new Error('initial npc_intel must start empty');
          if(initial.intel_flags?.zero_identity_known!==false) throw new Error('zero identity must start locked');
          const name='永远的7日之都-七日轮回文本互动-v0.4.23-onefile.json';
          await fs.writeFile(`dist-onefile/${name}`,raw);
          await fs.writeFile('dist-onefile/SHA256.txt',`${compactSha256}  ${name}\n`);
          console.log(JSON.stringify({version:card.data.character_version,creator:card.data.creator,entries:card.data.character_book?.entries?.length,regex:scripts.map(x=>x.id),ui:{terminal:true,stateHidden:true,choiceGrid:true,choiceTiles:true},depth:card.data.extensions?.depth_prompt?.depth,sha256:compactSha256},null,2));
          NODE
      - name: Upload one-file card
        uses: actions/upload-artifact@v4
        with:
          name: qidu-card-v0423-onefile
          path: dist-onefile/
          if-no-files-found: error
