name: Qidu Card One-File LAB

on:
  workflow_dispatch:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-onefile-trigger.txt'

permissions:
  contents: read

jobs:
  real-sillytavern:
    uses: h675786161-prog/lab/.github/workflows/real-sillytavern.yml@main
    with:
      extension_name: qidu-card-onefile
      run_project_smoke: true
      artifact_name: qidu-card-onefile-real-st
    secrets: inherit

  narrative-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUZI_KEY: ${{ secrets.YOUZI }}
      GLM_MODEL: '[B]glm-5.3-flash'
      LAB_OUT: bench-evidence/qidu-card-v0418-core
      LAB_OUT_CONFLICT: bench-evidence/qidu-card-v0418-preset-conflict
      LAB_OUT_INFO: bench-evidence/qidu-card-v0418-info-timeline
      LAB_OUT_ENCOUNTER: bench-evidence/qidu-card-v0419-encounter
    steps:
      - uses: actions/checkout@v4
      - name: Run v0418 core OOC regression
        run: node .lab/qidu-card-model-bench-v0418-core.mjs
      - name: Run v0418 preset branch conflict regression
        run: node .lab/qidu-card-model-bench-v0418-preset-conflict.mjs
      - name: Run v0418 information timeline regression
        run: node .lab/qidu-card-model-bench-v0418-info-timeline.mjs
      - name: Run v0419 encounter identity regression
        run: node .lab/qidu-card-model-bench-v0419-encounter.mjs
      - name: Upload narrative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-card-v0419-model-evidence
          path: bench-evidence/
          if-no-files-found: warn

  package:
    needs: [real-sillytavern, narrative-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one-file card
        run: |
          mkdir -p dist-onefile
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { loadQiduOneFileCard } from './.lab/qidu-card-v0419-encounter-gate.mjs';
          const { card, raw, compactSha256 } = await loadQiduOneFileCard(process.cwd(), { skipHashCheck:true });
          if (card.data.extensions?.qidu_choice_bridge) throw new Error('external bridge dependency still present');
          if ((card.data.extensions?.regex_scripts || []).length < 4) throw new Error('embedded regex missing');
          if (card.data.extensions?.depth_prompt?.depth !== 0) throw new Error('UI/info protocol is not depth 0');
          const p=(card.data.character_book?.entries||[]).find(e=>String(e.name||'').startsWith('04｜'));
          const s=(card.data.character_book?.entries||[]).find(e=>String(e.name||'').startsWith('30｜'));
          const t=(card.data.character_book?.entries||[]).find(e=>String(e.name||'').startsWith('67｜'));
          if(!String(p?.content||'').includes('角色首次识别门禁｜隐藏执行')) throw new Error('identity gate missing');
          if(!String(s?.content||'').includes('高校双人初见硬锁')) throw new Error('school pair gate missing');
          if(!String(t?.content||'').includes('高校主线不可省略')) throw new Error('Tesla required rule missing');
          const name='永远的7日之都-七日轮回文本互动-v0.4.19-onefile.json';
          await fs.writeFile(`dist-onefile/${name}`, raw);
          await fs.writeFile('dist-onefile/SHA256.txt', `${compactSha256}  ${name}\n`);
          console.log(JSON.stringify({version:card.data.character_version,entries:card.data.character_book?.entries?.length,regex:(card.data.extensions?.regex_scripts||[]).map(x=>x.id),depth:card.data.extensions?.depth_prompt?.depth,sha256:compactSha256},null,2));
          NODE
      - name: Upload one-file card
        uses: actions/upload-artifact@v4
        with:
          name: qidu-card-v0419-onefile
          path: dist-onefile/
          if-no-files-found: error
