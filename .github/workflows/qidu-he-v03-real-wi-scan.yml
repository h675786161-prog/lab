name: Qidu HE IF v0.3 real ST world-info scan

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-real-wi-scan.yml'
      - '.lab/qidu-he-v03-coverage-patch.py'
      - '.lab/qidu-he-v03-rc2-patch.py'
      - '.lab/qidu-he-v03-rc3-patch.py'
      - 'fixtures/qidu-he-if/coverage-manifest.v03.rc2.json'
      - 'fixtures/qidu-he-if/qidu-he-if.character.json'

permissions:
  contents: read

jobs:
  real-world-info-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARD: fixtures/qidu-he-if/qidu-he-if.character.json
      EVIDENCE: ${{ github.workspace }}/bench-evidence/qidu-he-v03-real-wi
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-v03-real-wi-st
    steps:
      - uses: actions/checkout@v4

      - name: Build rc3 candidate
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python .lab/qidu-he-v03-rc3-patch.py

      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          cd "$ST_DIR"
          npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-v03-real-wi.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$EVIDENCE/st-runtime.log"
          exit 1

      - name: Import card and call SillyTavern world-info scanner
        run: |
          set -euo pipefail
          mkdir -p /tmp/qidu-real-wi-browser && cd /tmp/qidu-real-wi-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/qidu-real-wi-scan.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const { chromium } = await import('file:///tmp/qidu-real-wi-browser/node_modules/playwright-core/index.mjs');
          const raw = await fs.readFile(process.env.CARD, 'utf8');
          const browser = await chromium.launch({ headless:true, executablePath:process.env.CHROME_BIN, args:['--no-sandbox','--disable-dev-shm-usage'] });
          const page = await browser.newPage({ viewport:{width:1440,height:1000} });
          const pageErrors=[]; page.on('pageerror', e=>pageErrors.push(String(e)));
          await page.goto('http://127.0.0.1:8000/', {waitUntil:'domcontentloaded', timeout:60000});
          await page.waitForTimeout(2500);

          const imported = await page.evaluate(async raw => {
            const f = new FormData();
            f.set('file_type','json');
            f.set('avatar',new Blob([raw],{type:'application/json'}),'qidu-he-v030-rc3.character.json');
            const r = await fetch('/api/characters/import',{method:'POST',body:f});
            return {ok:r.ok,status:r.status,text:(await r.text()).slice(0,1000)};
          }, raw);
          if (!imported.ok) throw new Error('import failed '+JSON.stringify(imported));

          await page.reload({waitUntil:'domcontentloaded', timeout:60000});
          await page.waitForTimeout(3500);

          const scan = await page.evaluate(async () => {
            const st = await import('/script.js');
            const wi = await import('/scripts/world-info.js');
            const chars = st.characters || [];
            const chid = chars.findIndex(c => c?.data?.character_version === '0.3.0-rc3' || c?.name === '交界都市：普通人的人生 HE IF');
            if (chid < 0) throw new Error('imported rc3 character not found in client character list');
            await Promise.resolve(st.select_selected_character(chid, {switchMenu:false}));
            await new Promise(r=>setTimeout(r,1800));

            const cases = [
              {id:'source_implicit', text:'下午我第一次去学园区的芭蕾舞蹈室附近看看，不认识任何人。', must:['源千雪：']},
              {id:'mika_implicit', text:'傍晚我去中央城区喷泉广场听街头音乐，不认识当地乐手。', must:['米菈：']},
              {id:'ash_implicit', text:'我遇到一起普通失物案，去警局问有没有擅长推理的人能帮忙。', must:['亚修：']},
              {id:'church_group', text:'周末我第一次走进圣星教会参加礼拜，之后想去花房看看。', must:['伊萨克','格雷穆','赛斯']},
              {id:'circus_group', text:'本地新闻说旅行马戏团进城，我顺着海报去巡演篷车附近看看。', must:['悠久乐园','尤梨','星灼']},
              {id:'rare_direct', text:'我想打听黑羽莲华最近有没有公开活动。', must:['黑羽莲华']},
              {id:'new_people_pool', text:'今天不找熟人，我想通过本地活动认识几个新面孔。', must:['扩展原作角色发现池']},
              {id:'district_school', text:'下午我去学园区随便走走，看看今天附近有什么普通活动。', must:['源千雪','亚修']},
              {id:'district_center', text:'晚上我一个人去中央城区闲逛，不找任何熟人，看看街上有什么。', must:['米菈','妮维','丽']}
            ];
            const defaults={trigger:'normal',personaDescription:'',characterDescription:'',characterPersonality:'',characterDepthPrompt:'',scenario:'',creatorNotes:''};
            const results=[];
            for (const c of cases) {
              const r = await wi.getWorldInfoPrompt([c.text], 200000, true, defaults);
              const joined = [r.worldInfoString,r.worldInfoBefore,r.worldInfoAfter,JSON.stringify(r.worldInfoDepth||[]),JSON.stringify(r.anBefore||[]),JSON.stringify(r.anAfter||[]),JSON.stringify(r.outletEntries||{})].join('\n');
              const missing = c.must.filter(x=>!joined.includes(x));
              results.push({id:c.id,text:c.text,must:c.must,missing,hit:missing.length===0,preview:joined.slice(0,14000)});
            }
            return {chid, characterName:chars[chid]?.name, results};
          });

          const report={stCommit:process.env.ST_COMMIT,imported,scan,pageErrors};
          await fs.writeFile(`${process.env.EVIDENCE}/real-world-info-scan.json`, JSON.stringify(report,null,2));
          await page.screenshot({path:`${process.env.EVIDENCE}/real-world-info-scan.png`,fullPage:true});
          await browser.close();
          console.log(JSON.stringify({stCommit:report.stCommit,imported:report.imported,characterName:scan.characterName,results:scan.results.map(x=>({id:x.id,hit:x.hit,missing:x.missing})) ,pageErrors},null,2));
          const misses=scan.results.filter(x=>!x.hit);
          if (pageErrors.length || misses.length) throw new Error('real ST WI scan failed: '+JSON.stringify({pageErrors,misses:misses.map(x=>({id:x.id,missing:x.missing}))}));
          NODE
          node /tmp/qidu-real-wi-scan.mjs

      - name: Stop ST
        if: always()
        run: if [ -f /tmp/qidu-he-v03-real-wi.pid ]; then kill "$(cat /tmp/qidu-he-v03-real-wi.pid)" 2>/dev/null || true; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-v03-real-wi-scan
          path: bench-evidence/qidu-he-v03-real-wi/
          if-no-files-found: error
