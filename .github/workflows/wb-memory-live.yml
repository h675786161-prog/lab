name: World Backstage memory model comparison
on:
  pull_request:
    paths:
      - '.lab/wb-memory-live.mjs'
      - '.lab/wb-memory-fixtures.json'
      - '.github/workflows/wb-memory-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: h675786161-prog/world-backstage
          ref: 7a75ba4cf7422ce790d8bafa44b4cac70cc6ff9d
          path: wb-candidate
      - uses: actions/checkout@v4
        with:
          repository: h675786161-prog/world-backstage
          ref: 9adafde433c13e20cde88e3ac7c712855969a430
          path: wb-baseline
      - name: Compare archived recall with the configured LAB model
        env:
          YOUZI_KEY: ${{ secrets.YOUZI }}
          GLM_MODEL: '[B]glm-5.3-flash'
        run: node .lab/wb-memory-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb-memory-model-comparison
          path: bench-evidence/wb-memory/
          if-no-files-found: warn
