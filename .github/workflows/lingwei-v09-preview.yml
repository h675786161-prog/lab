name: LingWei v0.9 Real SillyTavern Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lingwei-v09-preview.yml'
      - 'fixtures/lingwei-v09/**'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ST_DIR: /tmp/lingwei-v09-st
      EVIDENCE: ${{ github.workspace }}/lab-evidence-v09
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8

    steps:
      - name: Checkout LAB
        uses: actions/checkout@v4

      - name: Reconstruct v0.9 CSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          cat fixtures/lingwei-v09/part*.b64 | base64 -d | gunzip > /tmp/lingwei-v09.css
          test -s /tmp/lingwei-v09.css
          echo "css_bytes=$(wc -c < /tmp/lingwei-v09.css)" | tee "$EVIDENCE/theme-info.txt"

      - name: Clone exact SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"

      - name: Install SillyTavern dependencies
        working-directory: /tmp/lingwei-v09-st
        run: npm ci

      - name: Start isolated SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          cd "$ST_DIR"
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/sillytavern.log" 2>&1 &
          echo $! > /tmp/lingwei-v09.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "HTTP 200 from real SillyTavern"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/lingwei-v09.pid)" 2>/dev/null; then
              cat "$EVIDENCE/sillytavern.log"
              exit 1
            fi
            sleep 1
          done
          cat "$EVIDENCE/sillytavern.log"
          exit 1

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lingwei-v09-browser
          cd /tmp/lingwei-v09-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "PW_ENTRY=file:///tmp/lingwei-v09-browser/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"

      - name: Capture real SillyTavern desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/lingwei-v09-shot.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const { chromium } = await import(process.env.PW_ENTRY);
          const css = await fs.readFile('/tmp/lingwei-v09.css', 'utf8');
          const evidence = process.env.EVIDENCE;
          const pageErrors = [];
          const consoleErrors = [];
          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.CHROME_BIN,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });

          async function prepare(page) {
            page.on('pageerror', e => pageErrors.push(String(e?.stack || e)));
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            const response = await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(3000);
            await page.addStyleTag({ content: css });
            await page.waitForTimeout(1200);

            const keyNodes = await page.evaluate(() => ({
              chat: !!document.querySelector('#chat'),
              topBar: !!document.querySelector('#top-bar, #top-settings-holder'),
              sendForm: !!document.querySelector('#send_form'),
              textarea: !!document.querySelector('#send_textarea'),
              send: !!document.querySelector('#send_but'),
              stop: !!document.querySelector('#mes_stop'),
              cont: !!document.querySelector('#mes_continue'),
            }));

            if (keyNodes.chat) {
              await page.evaluate(() => {
                const chat = document.querySelector('#chat');
                if (!chat) return;
                chat.innerHTML = '';
                const makeMessage = ({ user, name, text, time }) => {
                  const row = document.createElement('div');
                  row.className = 'mes last_mes';
                  row.setAttribute('is_user', user ? 'true' : 'false');
                  row.setAttribute('is_system', 'false');
                  row.innerHTML = `
                    <div class="mesAvatarWrapper">
                      <div class="avatar"><div style="width:100%;height:100%;border-radius:inherit;background:linear-gradient(145deg,rgba(248,218,233,.92),rgba(205,194,234,.92));"></div></div>
                    </div>
                    <div class="mes_block">
                      <div class="ch_name"><span class="name_text">${name}</span><span class="timestamp">${time}</span></div>
                      ${user ? '' : '<div class="mes_reasoning_details"><div class="mes_reasoning_header">Thought trace</div><div class="mes_reasoning">A quiet reasoning layer stays subordinate to the reply.</div></div>'}
                      <div class="mes_text">${text}</div>
                      <div class="mes_buttons"></div>
                    </div>`;
                  return row;
                };
                chat.appendChild(makeMessage({
                  user: false,
                  name: 'Elaine',
                  time: '04:31',
                  text: 'The light outside the window has turned pale violet. I left the notes beside the glass, where the little stars catch the last warm reflection.'
                }));
                chat.appendChild(makeMessage({
                  user: true,
                  name: 'Ling',
                  time: '04:32',
                  text: 'Then keep the window open a little longer. I want the room to feel airy, soft, and lived in, not like decorations pasted onto a card.'
                }));
                chat.appendChild(makeMessage({
                  user: false,
                  name: 'Elaine',
                  time: '04:33',
                  text: 'Fine. The ornaments can overlap the structure, but the structure itself still has to carry the composition.'
                }));
                chat.scrollTop = 0;
              });
              await page.waitForTimeout(800);
            }

            return { httpStatus: response?.status() ?? null, title: await page.title(), keyNodes };
          }

          const desktop = await browser.newPage({ viewport: { width: 1480, height: 1027 } });
          const desktopReport = await prepare(desktop);
          await desktop.screenshot({ path: path.join(evidence, 'lingwei-v09-desktop.png'), fullPage: false });

          const mobile = await browser.newPage({ viewport: { width: 430, height: 844 }, deviceScaleFactor: 1 });
          const mobileReport = await prepare(mobile);
          const mobileMetrics = await mobile.evaluate(() => ({
            innerWidth: window.innerWidth,
            scrollWidth: document.documentElement.scrollWidth,
            horizontalOverflow: document.documentElement.scrollWidth - window.innerWidth,
          }));
          await mobile.screenshot({ path: path.join(evidence, 'lingwei-v09-mobile.png'), fullPage: false });

          await fs.writeFile(path.join(evidence, 'report.json'), JSON.stringify({
            desktop: desktopReport,
            mobile: mobileReport,
            mobileMetrics,
            pageErrors,
            consoleErrors,
            note: 'Real SillyTavern runtime with v0.9 CSS injected. Chat rows are QA fixtures inserted into the real #chat DOM. External decorative PNG assets are not bundled in this first pipeline proof.'
          }, null, 2));
          await browser.close();
          NODE
          EVIDENCE="$EVIDENCE" node /tmp/lingwei-v09-shot.mjs
          cat "$EVIDENCE/report.json"

      - name: Stop isolated runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/lingwei-v09.pid ]; then
            kill "$(cat /tmp/lingwei-v09.pid)" 2>/dev/null || true
          fi

      - name: Upload v0.9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingwei-v09-preview
          path: lab-evidence-v09
          if-no-files-found: warn
