name: Qidu CG v0424 Targeted Behavior

on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-cg-v0424-target-trigger.txt'

permissions:
  contents: read

jobs:
  targeted-cg-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      MODEL_API_KEY: ${{ secrets.PIAOMIAO }}
      MODEL_API_BASE: https://claudeapi.cc.cd/v1
      CG_MODEL: 'gemini-3.6-flash'
      CG_CASES: ann_first_meet
      CG_MAX_TOKENS: 4000
      CG_TIMEOUT_MS: 120000
      CG_ATTEMPTS: 1
      CG_CASE_GAP_MS: 1000
      LAB_OUT_CG_MODEL: ${{ github.workspace }}/cg-target-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run targeted exact v0.4.24 CG behavior bench
        run: node .lab/qidu-card-model-bench-v0424-cg.mjs
      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-v0424-cg-target-evidence
          path: cg-target-evidence/
          if-no-files-found: warn
