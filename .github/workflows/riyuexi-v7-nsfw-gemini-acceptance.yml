name: LingQi Riyuexi V7 NSFW Gemini Style Smoke
on:
  push:
    branches: ['bench/riyuexi-depattern-v1']
    paths:
      - 'triggers/riyuexi-v7-nsfw-gemini-acceptance.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ST_DIR: /tmp/lingqi-sillytavern
      LAB_ST_URL: http://127.0.0.1:8000
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
    steps:
      - uses: actions/checkout@v4
      - name: Build exact V7 NSFW Gemini runners
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/lab-evidence-nsfw-gemini"; mkdir -p "$GITHUB_WORKSPACE/lab-evidence-nsfw-gemini/g35" "$GITHUB_WORKSPACE/lab-evidence-nsfw-gemini/g31"
          cat fixtures/riyuexi-v7-glm/active-pack.repair08.b64 fixtures/riyuexi-v7-glm/active-pack.repair09.b64 > fixtures/riyuexi-v7-glm/active-pack.part06.b64
          cat fixtures/riyuexi-v7-glm/active-pack.part*.b64 | base64 -d | gzip -t
          node .lab/make-riyuexi-v11-style-runner.mjs .lab/riyuexi-v7-glm-exact.mjs /tmp/riyuexi-v7-open.mjs
          node .lab/make-riyuexi-nsfw-style-runner.mjs /tmp/riyuexi-v7-open.mjs /tmp/riyuexi-v7-nsfw-base.mjs
          node .lab/make-riyuexi-gemini-acceptance-runner.mjs /tmp/riyuexi-v7-nsfw-base.mjs /tmp/riyuexi-v7-nsfw-g35.mjs 3.5
          node .lab/make-riyuexi-gemini-acceptance-runner.mjs /tmp/riyuexi-v7-nsfw-base.mjs /tmp/riyuexi-v7-nsfw-g31.mjs 3.1
          node --check /tmp/riyuexi-v7-nsfw-g35.mjs
          node --check /tmp/riyuexi-v7-nsfw-g31.mjs
      - name: Discover GG Gemini models
        env:
          GG: ${{ secrets.GG }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          (async()=>{const r=await fetch('https://gcli.ggchan.dev/v1/models',{headers:{Authorization:`Bearer ${process.env.GG}`}}); const t=await r.text(); if(!r.ok) throw new Error(`models ${r.status}`); const d=JSON.parse(t); const ids=(d.data||d.models||[]).map(x=>typeof x==='string'?x:(x.id||x.name)).filter(Boolean); const g35=ids.find(x=>/^gemini[-_.]?3[._-]?5[-_.]?flash$/i.test(x))||ids.find(x=>/gemini.*3[._-]?5.*flash/i.test(x))||''; const g31=ids.find(x=>/gemini.*3[._-]?1.*pro/i.test(x))||''; fs.appendFileSync(process.env.GITHUB_ENV,`MODEL35=${g35}\nMODEL31=${g31}\n`); fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/lab-evidence-nsfw-gemini/models.json`,JSON.stringify({g35,g31},null,2)); if(!g35) throw new Error('Gemini 3.5 Flash not found');})();
          NODE
      - name: Prepare isolated real SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          cd "$ST_DIR"; npm ci
      - name: Start isolated SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          cd "$ST_DIR"; nohup node server.js --listen --port 8000 --disableCsrf > "$GITHUB_WORKSPACE/lab-evidence-nsfw-gemini/sillytavern-runtime.log" 2>&1 & echo $! >/tmp/lingqi-sillytavern.pid
          for i in $(seq 1 90); do curl -fsS --max-time 2 "$LAB_ST_URL/" >/dev/null 2>&1 && exit 0; kill -0 "$(cat /tmp/lingqi-sillytavern.pid)" 2>/dev/null || exit 1; sleep 1; done; exit 1
      - name: Run V7 3.5 and 3.1 NSFW style smoke
        env:
          GG: ${{ secrets.GG }}
        shell: bash
        run: |
          set -euo pipefail
          LAB_EVIDENCE_DIR="$GITHUB_WORKSPACE/lab-evidence-nsfw-gemini/g35" LAB_MODEL="$MODEL35" node /tmp/riyuexi-v7-nsfw-g35.mjs
          if [ -n "${MODEL31:-}" ]; then
            sleep 31
            LAB_EVIDENCE_DIR="$GITHUB_WORKSPACE/lab-evidence-nsfw-gemini/g31" LAB_MODEL="$MODEL31" node /tmp/riyuexi-v7-nsfw-g31.mjs
          else
            printf 'Gemini 3.1 Pro unavailable on GG model list\n' > "$GITHUB_WORKSPACE/lab-evidence-nsfw-gemini/g31/unavailable.txt"
          fi
      - name: Runtime tail
        if: always()
        run: tail -n 500 "$GITHUB_WORKSPACE/lab-evidence-nsfw-gemini/sillytavern-runtime.log" > "$GITHUB_WORKSPACE/lab-evidence-nsfw-gemini/sillytavern-runtime-tail.log" 2>/dev/null || true
      - name: Stop runtime
        if: always()
        run: '[ ! -f /tmp/lingqi-sillytavern.pid ] || kill "$(cat /tmp/lingqi-sillytavern.pid)" 2>/dev/null || true'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riyuexi-v7-nsfw-gemini-style-smoke
          path: lab-evidence-nsfw-gemini/
          if-no-files-found: error
