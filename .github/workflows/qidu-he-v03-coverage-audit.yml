name: Qidu HE IF v0.3 canon coverage audit

on:
  workflow_dispatch:
  push:
    branches: [qidu-he-if-longrp]
    paths:
      - '.github/workflows/qidu-he-v03-coverage-audit.yml'
      - '.lab/qidu-he-v03-coverage-patch.py'
      - 'fixtures/qidu-he-if/coverage-manifest.v03.json'
      - 'fixtures/qidu-he-if/qidu-he-if.character.json'
      - 'fixtures/qidu-he-if/riyuexi-glm-active.json'

permissions:
  contents: read

jobs:
  coverage-static-and-st:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARD: fixtures/qidu-he-if/qidu-he-if.character.json
      MANIFEST: fixtures/qidu-he-if/coverage-manifest.v03.json
      EVIDENCE: ${{ github.workspace }}/bench-evidence/qidu-he-v03
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      ST_DIR: /tmp/qidu-he-v03-st
    steps:
      - uses: actions/checkout@v4

      - name: Build v0.3 candidate
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python .lab/qidu-he-v03-coverage-patch.py
          cp "$CARD" "$EVIDENCE/qidu-he-if-v0.3.0-rc1.character.json"

      - name: Audit original-character anchors and reachability
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          card = json.loads(Path(os.environ['CARD']).read_text(encoding='utf-8'))['data']
          manifest = json.loads(Path(os.environ['MANIFEST']).read_text(encoding='utf-8'))
          entries = card['character_book']['entries']
          all_text = json.dumps(card, ensure_ascii=False)
          entry_by_name = {e.get('name'): e for e in entries}

          if card.get('character_version') != '0.3.0-rc1':
              raise SystemExit(f"wrong candidate version {card.get('character_version')}")

          forbidden = [
              '艾露比：\\n- 成年女性',
              '妮维：\\n- 成年女性',
              '赛哈姆：\\n- 成年女性，退役军人',
              '薇拉：\\n- 成年女性，前军职背景',
          ]
          bad = [x for x in forbidden if x in all_text]
          if bad:
              raise SystemExit('stale canon drift remains: ' + repr(bad))

          required_sections = [
              '城市角色覆盖路由', '角色发现与触发机制', '学生与未成年角色边界',
              '源千雪', '米菈', '亚修', '圣星教会群像', '悠久乐园群像'
          ]
          missing_sections = [x for x in required_sections if x not in entry_by_name]
          if missing_sections:
              raise SystemExit('missing required entries: ' + repr(missing_sections))

          detailed_blob = '\n'.join(
              e.get('content','') for e in entries
              if e.get('name') not in {'城市角色覆盖路由','角色发现与触发机制'}
          )
          missing_detail = [x for x in manifest['must_have_detailed_entries'] if x not in detailed_blob]
          if missing_detail:
              raise SystemExit('names lack detailed anchors: ' + repr(missing_detail))

          roster = []
          for group, names in manifest['groups'].items():
              for n in names:
                  if n not in roster:
                      roster.append(n)
          coverage = entry_by_name['城市角色覆盖路由']['content']
          missing_roster = [n for n in roster if n not in coverage and n not in detailed_blob]
          if missing_roster:
              raise SystemExit('roster absent from card: ' + repr(missing_roster))

          trigger_entry_names = {
              '源千雪':'源千雪', '米菈':'米菈', '亚修':'亚修',
              '圣星教会':'圣星教会群像', '悠久乐园':'悠久乐园群像'
          }
          missing_triggers = {}
          for route, terms in manifest['direct_trigger_examples'].items():
              e = entry_by_name[trigger_entry_names[route]]
              hay = '\n'.join(e.get('keys',[])) + '\n' + e.get('content','')
              miss = [t for t in terms if t not in hay]
              if miss:
                  missing_triggers[route] = miss
          if missing_triggers:
              raise SystemExit('missing route triggers: ' + repr(missing_triggers))

          guard = entry_by_name['学生与未成年角色边界']['content']
          for n in ['米菈','艾露比','妮维','亚修','源千雪','伊萨克']:
              if n not in guard:
                  raise SystemExit('minor/student guard missing ' + n)

          route_rules = entry_by_name['角色发现与触发机制']['content']
          for marker in ['1~3个场景转换内','低频角色','不要求{{user}}先知道角色名字','不得垄断所有剧情']:
              if marker not in route_rules:
                  raise SystemExit('reachability rule missing: ' + marker)

          report = {
              'candidateVersion': card['character_version'],
              'uniqueNativeRosterCount': len(roster),
              'detailedMustHaveCount': len(manifest['must_have_detailed_entries']),
              'detailedMustHave': manifest['must_have_detailed_entries'],
              'fixedExisting': manifest['must_fix_existing'],
              'groups': {k: len(v) for k,v in manifest['groups'].items()},
              'routeTriggers': manifest['direct_trigger_examples'],
              'result': 'PASS'
          }
          Path(os.environ['EVIDENCE'],'coverage-static.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Start exact SillyTavern
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          test "$(git -C "$ST_DIR" rev-parse HEAD)" = "$ST_COMMIT"
          cd "$ST_DIR"
          npm ci
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE/st-runtime.log" 2>&1 &
          echo $! > /tmp/qidu-he-v03-st.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$EVIDENCE/st-runtime.log"
          exit 1

      - name: Real browser import candidate and inspect stored card
        run: |
          set -euo pipefail
          mkdir -p /tmp/qidu-v03-browser && cd /tmp/qidu-v03-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          export CHROME_BIN
          cd "$GITHUB_WORKSPACE"
          cat > /tmp/qidu-v03-import.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const {chromium}=await import('file:///tmp/qidu-v03-browser/node_modules/playwright-core/index.mjs');
          const raw=await fs.readFile(process.env.CARD,'utf8');
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2500);
          const result=await page.evaluate(async(raw)=>{
            const form=new FormData();
            form.set('file_type','json');
            form.set('avatar',new Blob([raw],{type:'application/json'}),'qidu-he-if-v0.3.0-rc1.character.json');
            const imp=await fetch('/api/characters/import',{method:'POST',body:form});
            const impText=await imp.text();
            const all=await fetch('/api/characters/all',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
            const allText=await all.text();
            return {importStatus:imp.status,importOk:imp.ok,importText:impText.slice(0,1000),allStatus:all.status,allOk:all.ok,allText:allText.slice(0,100000)};
          },raw);
          let stored=false,version=false,source=false,circus=false,church=false;
          try{
            const chars=JSON.parse(result.allText);
            const text=JSON.stringify(chars);
            stored=text.includes('交界都市：普通人的人生 HE IF');
            version=text.includes('0.3.0-rc1');
            source=text.includes('源千雪');
            circus=text.includes('悠久乐园');
            church=text.includes('圣星教会');
          }catch{}
          await page.screenshot({path:`${process.env.EVIDENCE}/real-st-v03-import.png`,fullPage:true});
          const report={stCommit:process.env.ST_COMMIT,...result,stored,version,source,circus,church,pageErrors};
          await fs.writeFile(`${process.env.EVIDENCE}/real-st-import.json`,JSON.stringify(report,null,2));
          await browser.close();
          if(!result.importOk||!result.allOk||!stored||!version||!source||!circus||!church||pageErrors.length) throw new Error(JSON.stringify(report));
          console.log(JSON.stringify(report,null,2));
          NODE
          node /tmp/qidu-v03-import.mjs

      - name: Stop ST
        if: always()
        run: |
          if [ -f /tmp/qidu-he-v03-st.pid ]; then kill "$(cat /tmp/qidu-he-v03-st.pid)" 2>/dev/null || true; fi

      - name: Upload candidate/static/ST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-v03-coverage-static-st
          path: bench-evidence/qidu-he-v03/
          if-no-files-found: error

  behavior-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: coverage-static-and-st
    env:
      CARD: fixtures/qidu-he-if/qidu-he-if.character.json
      PRESET: fixtures/qidu-he-if/riyuexi-glm-active.json
      EVIDENCE: ${{ github.workspace }}/bench-evidence/qidu-he-v03-behavior
      YOUZI_KEY: ${{ secrets.YOUZI }}
      MODEL: '[B]glm-5.3-flash'
      RPM: '12'
    steps:
      - uses: actions/checkout@v4
      - name: Build same candidate
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          python .lab/qidu-he-v03-coverage-patch.py

      - name: Probe low-frequency routes and canon drift
        continue-on-error: true
        id: probe
        run: |
          set -euo pipefail
          cat > /tmp/qidu-v03-probe.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const card=JSON.parse(await fs.readFile(process.env.CARD,'utf8')).data;
          const preset=JSON.parse(await fs.readFile(process.env.PRESET,'utf8'));
          const wanted=new Set(['⚖️RP模式','🪐均衡调度','🎈烟火气息','🎈群像塑造','🌊自由变奏','👤平衡主导','🐚人格基底','🐚去中心化','🐚角色成长','🐚标签隐身','🤝健康恋爱','⬆️自然推进']);
          const presetText=preset.prompts.filter(p=>wanted.has(p.name)).map(p=>`[${p.name}]\n${p.content}`).join('\n\n');
          const entries=card.character_book?.entries||[];
          const byName=new Map(entries.map(e=>[e.name,e]));
          const cases=[
            {id:'source',target:'源千雪',prompt:'下午我第一次去学园区的芭蕾舞蹈室附近看看，不认识任何人，也没有点名找谁。让场景自然发生。',entries:['源千雪','角色发现与触发机制','学生与未成年角色边界']},
            {id:'mika',target:'米菈',prompt:'傍晚我去中央城区喷泉广场听街头音乐，不认识当地乐手。让场景自然发生。',entries:['米菈','角色发现与触发机制','学生与未成年角色边界']},
            {id:'ash',target:'亚修',prompt:'我遇到一起普通失物案，去警局问有没有擅长推理的人能帮忙，但我不知道任何侦探的名字。',entries:['亚修','角色发现与触发机制','学生与未成年角色边界']},
            {id:'church',target:'伊萨克',prompt:'周末我第一次走进圣星教会，没预约也不认识里面的人。不要一次把所有成员排队介绍，正常写我最可能碰到的一两个现场人物。',entries:['圣星教会群像','角色发现与触发机制','学生与未成年角色边界']},
            {id:'circus',target:'悠久乐园',prompt:'手机本地新闻说旅行马戏团最近进城了。我顺着海报去临时演出场看看，不认识任何团员。让一两个合理的团员自然进入场景。',entries:['悠久乐园群像','角色发现与触发机制']}
          ];
          const results=[]; let last=0; const gap=Math.ceil(60000/Math.min(12,Number(process.env.RPM||12)));
          async function call(messages){
            let err;
            for(let attempt=1;attempt<=3;attempt++){
              const wait=Math.max(0,gap-(Date.now()-last)); if(wait) await new Promise(r=>setTimeout(r,wait)); last=Date.now();
              const r=await fetch('https://youzi.today/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${process.env.YOUZI_KEY}`},body:JSON.stringify({model:process.env.MODEL,messages,temperature:preset.sampling?.temperature??0.98,top_p:preset.sampling?.top_p??0.5,max_tokens:8000,stream:false})});
              const raw=await r.text();
              if(!r.ok){err=new Error(`HTTP ${r.status}: ${raw.slice(0,600)}`); if([429,503,524].includes(r.status)){await new Promise(x=>setTimeout(x,attempt*8000));continue;} throw err;}
              let j; try{j=JSON.parse(raw)}catch{throw new Error('bad json '+raw.slice(0,500))}
              const text=j.choices?.[0]?.message?.content||'';
              if(text.trim()) return text;
              err=new Error('empty visible content'); await new Promise(x=>setTimeout(x,attempt*8000));
            }
            throw err||new Error('provider failed');
          }
          try{
            for(const c of cases){
              const triggered=c.entries.map(n=>byName.get(n)?.content||'').join('\n\n');
              const system=`${presetText}\n\n${card.system_prompt}\n\n【本轮按关键词触发的世界书条目】\n${triggered}`;
              const text=await call([{role:'system',content:system},{role:'assistant',content:card.first_mes},{role:'user',content:c.prompt}]);
              const hit=c.id==='circus' ? /(尤梨|星灼|达格|拉奥拉|鲁特|赛德|悠久乐园)/.test(text) : c.id==='church' ? /(伊萨克|赛斯|格雷穆|瑟雷斯|伊斯卡里奥)/.test(text) : text.includes(c.target);
              results.push({...c,hit,text});
              console.log(`${c.id}: hit=${hit} chars=${text.length}`);
            }
            const all=results.map(x=>x.text).join('\n');
            const drift={adultElubi:/成年.{0,5}(?:艾露比)|艾露比.{0,15}成年/.test(all),adultNivi:/成年.{0,5}(?:妮维)|妮维.{0,15}成年/.test(all),militarySeham:/赛哈姆.{0,30}(?:退役军人|正规军)/.test(all),militaryVera:/薇拉.{0,30}(?:退役军人|军队出身|军人出身)/.test(all)};
            const report={status:'completed',results,drift};
            await fs.writeFile(`${process.env.EVIDENCE}/behavior.json`,JSON.stringify(report,null,2));
            const misses=results.filter(x=>!x.hit).map(x=>x.id);
            if(misses.length) throw new Error('route misses: '+misses.join(','));
            if(Object.values(drift).some(Boolean)) throw new Error('canon drift detected '+JSON.stringify(drift));
          }catch(e){
            const msg=String(e?.message||e);
            const blocked=/(insufficient_user_quota|账户额度不足|model_not_found|No available channel|Payment Required|HTTP 402)/i.test(msg);
            const report={status:blocked?'blocked_upstream':'failed',error:msg,partial:results};
            await fs.writeFile(`${process.env.EVIDENCE}/behavior.json`,JSON.stringify(report,null,2));
            if(blocked){console.log('::warning::YOUZI behavior probe blocked upstream; static/ST candidate audit remains valid.');process.exit(0)}
            throw e;
          }
          NODE
          node /tmp/qidu-v03-probe.mjs

      - name: Upload behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qidu-he-v03-behavior
          path: bench-evidence/qidu-he-v03-behavior/
          if-no-files-found: error
