name: Huo Nv Card Real SillyTavern

on:
  push:
    branches: ['feature/huonv-card']
    paths:
      - 'cards/huonv/**'
      - '.github/workflows/huonv-card-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  huonv-real-st:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ST_DIR: /tmp/huonv-sillytavern
      BROWSER_DIR: /tmp/huonv-browser-qa
      EVIDENCE_DIR: ${{ github.workspace }}/huonv-evidence
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
      CARD_PATH: cards/huonv/霍女_玲七_v1.0.0.json
      GENSOUKYOU_PASSWORD: ${{ secrets.GENSOUKYOU_PASSWORD }}

    steps:
      - name: Checkout card branch
        uses: actions/checkout@v4

      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "sha=$GITHUB_SHA"
            echo "sillytavern_commit=$ST_COMMIT"
            echo "card=$CARD_PATH"
          } > "$EVIDENCE_DIR/run-context.txt"

      - name: Clone exact SillyTavern runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          ACTUAL="$(git -C "$ST_DIR" rev-parse HEAD)"
          test "$ACTUAL" = "$ST_COMMIT"
          echo "$ACTUAL" > "$EVIDENCE_DIR/sillytavern-commit.txt"

      - name: Install SillyTavern dependencies
        working-directory: /tmp/huonv-sillytavern
        run: npm ci

      - name: Validate Character Card V2 and card invariants
        shell: bash
        run: |
          set -euo pipefail
          export CARD_ABS="$GITHUB_WORKSPACE/$CARD_PATH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const card = JSON.parse(await fs.readFile(process.env.CARD_ABS, 'utf8'));
          const mod = await import(pathToFileURL(path.join(process.env.ST_DIR, 'src/validator/TavernCardValidator.js')).href);
          const validator = new mod.TavernCardValidator(card);
          const result = validator.validate();
          if (result !== 2) throw new Error(`Expected Tavern Card V2, got ${result}; field=${validator.lastValidationError}`);

          const d = card.data;
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          assert(d.name === '霍女', 'name mismatch');
          assert(d.creator === '玲 × 七', 'creator mismatch');
          assert(d.character_version === '1.0.0', 'version mismatch');
          assert(Array.isArray(d.tags) && d.tags.length === 3, 'expected exactly 3 tags');
          assert(d.alternate_greetings.length >= 3, 'expected at least 3 alternate greetings');
          assert(d.character_book?.entries?.length >= 8, 'expected embedded lore entries');
          assert(d.system_prompt.includes('具体物种、仙籍、修行体系'), 'identity ambiguity rule missing');
          assert(d.system_prompt.includes('玩家未表达的内心'), 'knowledge boundary missing');
          assert(d.system_prompt.includes('重大不可逆安排'), 'player boundary rule missing');
          assert(d.extensions?.lingqi?.ui_required === false, 'this card must not require UI');

          const report = {
            validator_version: result,
            name: d.name,
            creator: d.creator,
            version: d.character_version,
            tags: d.tags,
            alternate_greetings: d.alternate_greetings.length,
            lore_entries: d.character_book.entries.length,
            ui_required: d.extensions.lingqi.ui_required,
            checks: 'pass',
          };
          await fs.writeFile(path.join(process.env.EVIDENCE_DIR, 'static-card-validation.json'), JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report));
          NODE

      - name: Start exact SillyTavern runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$ST_DIR"
          nohup node server.js --listen --port 8000 --disableCsrf > "$EVIDENCE_DIR/sillytavern-runtime.log" 2>&1 &
          echo $! > /tmp/huonv-sillytavern.pid
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo 'SillyTavern is reachable.'
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/huonv-sillytavern.pid)" 2>/dev/null; then
              cat "$EVIDENCE_DIR/sillytavern-runtime.log"
              exit 1
            fi
            sleep 1
          done
          echo 'Timed out waiting for SillyTavern.'
          cat "$EVIDENCE_DIR/sillytavern-runtime.log"
          exit 1

      - name: Prepare Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BROWSER_DIR"
          mkdir -p "$BROWSER_DIR"
          cd "$BROWSER_DIR"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core@1.55.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "LAB_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "LAB_PLAYWRIGHT_CORE_ENTRY=file://$BROWSER_DIR/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"

      - name: Import card through real SillyTavern and read it back
        shell: bash
        run: |
          set -euo pipefail
          export CARD_ABS="$GITHUB_WORKSPACE/$CARD_PATH"
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const { chromium } = await import(process.env.LAB_PLAYWRIGHT_CORE_ENTRY);
          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.LAB_CHROME,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', e => pageErrors.push(String(e?.stack || e)));
          page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });

          let report = {};
          try {
            const response = await page.goto('http://127.0.0.1:8000/', { waitUntil: 'domcontentloaded', timeout: 60_000 });
            await page.waitForTimeout(2500);
            if (!response || response.status() >= 400) throw new Error(`ST page HTTP ${response?.status()}`);

            const cardText = await fs.readFile(process.env.CARD_ABS, 'utf8');
            const imported = await page.evaluate(async text => {
              const file = new File([text], 'huonv.json', { type: 'application/json' });
              const form = new FormData();
              form.set('file_type', 'json');
              form.set('avatar', file);
              const r = await fetch('/api/characters/import', { method: 'POST', body: form });
              let body = null;
              try { body = await r.json(); } catch { body = await r.text(); }
              return { status: r.status, ok: r.ok, body };
            }, cardText);

            if (!imported.ok || imported.status !== 200 || !imported.body?.file_name) {
              throw new Error(`Character import failed: ${JSON.stringify(imported)}`);
            }
            const avatar = `${imported.body.file_name}.png`;

            const readback = await page.evaluate(async avatarUrl => {
              const r = await fetch('/api/characters/get', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ avatar_url: avatarUrl }),
              });
              let body = null;
              try { body = await r.json(); } catch { body = await r.text(); }
              return { status: r.status, ok: r.ok, body };
            }, avatar);

            if (!readback.ok || readback.status !== 200) throw new Error(`Character readback failed: ${JSON.stringify(readback)}`);
            const rb = readback.body;
            const raw = typeof rb?.json_data === 'string' ? JSON.parse(rb.json_data) : null;
            const d = raw?.data ?? rb?.data ?? raw ?? rb;
            const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
            assert(d?.name === '霍女', `readback name mismatch: ${d?.name}`);
            assert(d?.creator === '玲 × 七', 'readback creator mismatch');
            assert(d?.character_version === '1.0.0', 'readback version mismatch');
            assert(Array.isArray(d?.tags) && d.tags.includes('霍女'), 'readback tags missing');
            assert(Array.isArray(d?.alternate_greetings) && d.alternate_greetings.length >= 3, 'alternate greetings lost');
            assert(d?.character_book?.entries?.length >= 8, 'embedded lorebook lost');
            assert(String(d?.system_prompt || '').includes('具体物种、仙籍、修行体系'), 'system prompt damaged');

            report = {
              st_http_status: response.status(),
              imported_status: imported.status,
              imported_file_name: imported.body.file_name,
              readback_status: readback.status,
              readback: {
                name: d.name,
                creator: d.creator,
                version: d.character_version,
                tags: d.tags,
                alternate_greetings: d.alternate_greetings.length,
                lore_entries: d.character_book.entries.length,
                system_prompt_preserved: true,
              },
              page_errors: pageErrors,
              console_error_count: consoleErrors.length,
              result: 'pass',
            };

            await page.screenshot({ path: path.join(process.env.EVIDENCE_DIR, 'huonv-real-sillytavern.png'), fullPage: true });
          } finally {
            await fs.writeFile(path.join(process.env.EVIDENCE_DIR, 'huonv-real-st-report.json'), JSON.stringify(report, null, 2));
            await browser.close();
          }
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Probe Gensoukyou site gate without exposing credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const { chromium } = await import(process.env.LAB_PLAYWRIGHT_CORE_ENTRY);
          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.LAB_CHROME,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
          const report = { site: 'https://gensoukyou.xyz/', secret_present: Boolean(process.env.GENSOUKYOU_PASSWORD) };
          try {
            const resp = await page.goto(report.site, { waitUntil: 'domcontentloaded', timeout: 60_000 });
            await page.waitForTimeout(2500);
            report.initial = {
              status: resp?.status() ?? null,
              url: page.url(),
              title: await page.title(),
              password_inputs: await page.locator('input[type="password"]').count(),
              text_inputs: await page.locator('input[type="text"], input:not([type])').count(),
              submit_buttons: await page.locator('button, input[type="submit"]').count(),
            };
            await page.screenshot({ path: path.join(process.env.EVIDENCE_DIR, 'gensoukyou-gate.png'), fullPage: true });

            const passwordInput = page.locator('input[type="password"]').first();
            if (await passwordInput.count()) {
              if (!process.env.GENSOUKYOU_PASSWORD) {
                report.login = { result: 'not_run_missing_GENSOUKYOU_PASSWORD_secret' };
              } else {
                await passwordInput.fill(process.env.GENSOUKYOU_PASSWORD);
                const submit = page.locator('button[type="submit"], input[type="submit"], button').first();
                if (await submit.count()) await submit.click(); else await passwordInput.press('Enter');
                await page.waitForTimeout(3500);
                report.login = {
                  result: 'attempted',
                  url_after: page.url(),
                  title_after: await page.title(),
                  password_inputs_after: await page.locator('input[type="password"]').count(),
                };
                await page.screenshot({ path: path.join(process.env.EVIDENCE_DIR, 'gensoukyou-after-login.png'), fullPage: true });
              }
            } else {
              report.login = { result: 'no_html_password_gate_detected' };
            }
          } catch (error) {
            report.error = `${error?.name || 'Error'}: ${String(error?.message || error).slice(0, 500)}`;
          } finally {
            await fs.writeFile(path.join(process.env.EVIDENCE_DIR, 'gensoukyou-probe.json'), JSON.stringify(report, null, 2));
            await browser.close();
          }
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/huonv-sillytavern.pid ]; then
            kill "$(cat /tmp/huonv-sillytavern.pid)" 2>/dev/null || true
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huonv-real-sillytavern
          path: huonv-evidence/
          if-no-files-found: error
