name: GLM Student Dean v1.0 Benchmark

on:
  workflow_dispatch:
  push:
    branches: ['bench/glm-student-dean-v10']
    paths:
      - '.github/workflows/glm-student-dean-v10.yml'
      - '.lab/glm-student-dean-v10.mjs'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      ST_DIR: /tmp/lingqi-sillytavern
      LAB_ST_URL: http://127.0.0.1:8000
      LAB_EVIDENCE_DIR: ${{ github.workspace }}/lab-evidence-student-dean-v10
      ST_COMMIT: 8172dcd0ee672d3cd9a5e5f7af134f91a45cd2b8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated real SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ST_DIR" "$LAB_EVIDENCE_DIR"
          mkdir -p "$LAB_EVIDENCE_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/SillyTavern/SillyTavern.git "$ST_DIR"
          git -C "$ST_DIR" fetch origin "$ST_COMMIT" --depth=1
          git -C "$ST_DIR" checkout --detach "$ST_COMMIT"
          cd "$ST_DIR"
          npm ci
      - name: Start SillyTavern
        shell: bash
        run: |
          set -euo pipefail
          cd "$ST_DIR"
          nohup node server.js --listen --port 8000 --disableCsrf > "$LAB_EVIDENCE_DIR/runtime.log" 2>&1 &
          echo $! >/tmp/lingqi-sillytavern.pid
          for i in $(seq 1 90); do
            curl -fsS --max-time 2 "$LAB_ST_URL/" >/dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1
      - name: Run Student Dean v1.0 A/B
        env:
          YOUZI: ${{ secrets.YOUZI }}
        run: |
          node --check .lab/glm-student-dean-v10.mjs
          node .lab/glm-student-dean-v10.mjs
      - name: Runtime tail
        if: always()
        run: tail -n 160 "$LAB_EVIDENCE_DIR/runtime.log" || true
      - name: Stop
        if: always()
        run: '[ ! -f /tmp/lingqi-sillytavern.pid ] || kill "$(cat /tmp/lingqi-sillytavern.pid)" 2>/dev/null || true'
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glm-student-dean-v10
          path: lab-evidence-student-dean-v10/
          if-no-files-found: error
