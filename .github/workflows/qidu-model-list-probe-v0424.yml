name: Qidu Model List Probe v0424
on:
  push:
    branches: ['feature/qidu-card-v0411-lab']
    paths:
      - '.lab/qidu-model-list-probe-trigger-v0424.txt'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODEL_API_KEY: ${{ secrets.PIAOMIAO }}
      MODEL_API_BASE: https://claudeapi.cc.cd/v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: node .lab/qidu-model-list-probe-v0424.mjs
